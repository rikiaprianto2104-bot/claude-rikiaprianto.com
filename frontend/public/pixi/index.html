<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngobrol dengan Pixi | Future Makers</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ungu:#6c5ce7; --ungu-tua:#3f33a8; --kuning:#ffc83d; --lavender:#dcd5ff; --lav-muda:#f3f0ff; --krem:#fff6da;
    --teks:#2a2270;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:'Baloo 2',system-ui,'Segoe UI',sans-serif;
    color:var(--teks);
    /* Latar dunia Pixi. Ditaruh di tengah supaya panggung bundar selalu ada di
       tengah layar, tepat di bawah Pixi. 'cover' membuatnya penuh tanpa gepeng.
       Warna langit dipasang sebagai cadangan kalau gambar belum termuat. */
    background:#7ec4f2 url('latar.webp') center center / cover no-repeat;
    overflow:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}

  .merek{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top));z-index:5;
    font-weight:800;font-size:clamp(15px,2.6vw,18px);color:var(--ungu-tua);display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.82);padding:6px 14px;border-radius:999px;backdrop-filter:blur(4px)}
  .merek i{width:14px;height:14px;background:var(--kuning);display:inline-block;
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  #tombolSuara{position:fixed;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:5;
    width:46px;height:46px;border-radius:50%;border:0;background:var(--lav-muda);font-size:22px;
    box-shadow:0 3px 0 var(--lavender);cursor:pointer}

  #bubble{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);
    width:min(600px,92vw);z-index:4;text-align:center}
  #teksPixi{background:rgba(243,240,255,.96);border:3px solid var(--lavender);border-radius:30px 30px 30px 8px;padding:14px 22px;
    font-size:clamp(16px,2.9vw,24px);font-weight:700;line-height:1.35;
    box-shadow:0 5px 0 var(--lavender),0 10px 24px rgba(42,34,112,.18);
    min-height:2.6em;display:grid;place-items:center;
    /* Jawaban panjang dulu tumbuh sampai menimpa tombol di bawahnya. Sekarang
       tingginya dibatasi dan boleh digulir kalau isinya memang panjang. */
    max-height:min(46vh,340px);overflow-y:auto;
    /* Grid dipakai, bukan flex: isi grid boleh menyusut sampai muat, sedangkan
       isi flex menolak menyusut di bawah lebar kata terpanjang lalu meluber.
       overflow-wrap menjaga kalau ada satu kata yang memang lebih lebar dari
       gelembungnya. */
    overflow-wrap:anywhere}
  /* Teks anak & catatan diberi alas sendiri: tanpa itu keduanya hilang di atas
     langit biru dan awan putih pada gambar latar. */
  #teksAnak{margin-top:8px;font-size:clamp(14px,2.4vw,16px);font-weight:600;color:var(--ungu);min-height:1.4em}
  #teksAnak:not(:empty){background:rgba(255,255,255,.85);border-radius:999px;padding:4px 14px;display:inline-block}

  #dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 12px}
  #chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
  @media (max-width:819px){#chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;width:100%;max-width:100%;padding:2px 4px 6px;scrollbar-width:none}.chip{flex:none;white-space:nowrap}}
  .chip{border:0;background:var(--lav-muda);color:var(--ungu-tua);font:inherit;font-weight:700;font-size:15px;
    padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 var(--lavender);cursor:pointer}
  .chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lavender)}
  #baris{display:flex;align-items:center;gap:16px}
  /* Saklar nyala/mati, bukan lagi tombol yang harus ditahan. Bentuknya lonjong
     dan lebarnya ikut layar supaya seimbang dengan gelembung bicara di atasnya. */
  #mic{display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-width:min(58vw,250px);padding:14px 26px;border-radius:999px;border:0;
    background:var(--ungu);color:#fff;font:inherit;font-weight:800;
    font-size:clamp(15px,2.5vw,18px);line-height:1.15;cursor:pointer;
    box-shadow:0 6px 0 var(--ungu-tua);user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #mic .ikon{font-size:1.5em;line-height:1}
  #mic:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ungu-tua)}
  #mic.aktif{background:#ff6b8a;box-shadow:0 6px 0 #b83a58;animation:denyut 1.4s infinite}
  #mic:disabled{background:#a9a2e6;box-shadow:0 6px 0 #7f77c4;cursor:default;transform:none}
  @keyframes denyut{0%,100%{outline:0 solid rgba(255,107,138,.55)}50%{outline:12px solid rgba(255,107,138,0)}}
  #mic.aktif{outline:0 solid rgba(255,107,138,.55)}
  #tombolKetik{border:0;background:var(--lav-muda);border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;
    color:var(--ungu-tua);box-shadow:0 3px 0 var(--lavender);cursor:pointer}
  #formKetik{display:none;gap:8px;width:min(520px,92vw)}
  #formKetik.buka{display:flex}
  #formKetik input{flex:1;font:inherit;font-size:18px;padding:10px 16px;border-radius:999px;border:3px solid var(--lavender);outline:none}
  #formKetik input:focus{border-color:var(--ungu)}
  #formKetik button{border:0;background:var(--kuning);font:inherit;font-weight:800;padding:0 20px;border-radius:999px;cursor:pointer;color:var(--teks)}
  #catatan{font-size:13px;color:var(--ungu-tua);text-align:center;min-height:1em}
  #catatan:not(:empty){background:rgba(255,255,255,.85);border-radius:999px;padding:3px 12px}

  #mulai{position:fixed;inset:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  #mulai h1{margin:0;font-size:clamp(30px,7vw,52px);color:var(--ungu-tua);line-height:1.05}
  #mulai p{margin:0;font-size:18px;max-width:420px}
  #mulai button{border:0;background:var(--kuning);color:var(--teks);font:inherit;font-weight:800;font-size:24px;
    padding:14px 34px;border-radius:999px;box-shadow:0 6px 0 #d99f0d;cursor:pointer}
  #mulai button:active{transform:translateY(3px);box-shadow:0 3px 0 #d99f0d}
  #mulai.tutup{display:none}

  @media (min-width:820px) and (min-aspect-ratio:5/4){
    #bubble{left:auto;right:3vw;top:12vh;transform:none;width:min(36vw,480px)}
    #teksPixi{border-radius:30px 30px 8px 30px}
    #dock{left:auto;right:3vw;bottom:5vh;width:min(36vw,480px);padding:0}
  }
  @media (max-height:560px){ #chips{display:none} #mic{padding:10px 20px;min-width:0} #mic .ikon{font-size:1.3em} }
  @media (prefers-reduced-motion:reduce){ #mic.aktif{animation:none} }
</style>
</head>
<body>

<div class="merek"><i></i>Future Makers</div>
<button id="tombolSuara" aria-label="Suara Pixi nyala/mati">🔊</button>
<div id="stage"></div>

<div id="bubble" aria-live="polite">
  <div id="teksPixi">Halo! Aku Pixi.</div>
  <div id="teksAnak"></div>
</div>

<div id="dock">
  <div id="baris">
    <button id="mic" type="button" aria-pressed="false"><span class="ikon">🎤</span><span id="micLabel">Mulai ngobrol</span></button>
    <button id="tombolKetik">⌨️ Ketik</button>
  </div>
  <form id="formKetik" autocomplete="off">
    <input id="isiKetik" type="text" maxlength="200" placeholder="Tulis pertanyaanmu di sini...">
    <button type="submit">Kirim</button>
  </form>
  <div id="catatan"></div>
</div>

<div id="mulai">
  <h1>Kenalan sama Pixi yuk!</h1>
  <p>Pixi adalah robot bintang dari Future Makers. Tekan tombol ungu sekali, lalu ngobrol saja seperti biasa.</p>
  <button id="btnMulai">Mulai</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/DecalGeometry.js"></script>
<script>
/* =====================================================================
   PENGATURAN  (ubah di sini)
   ===================================================================== */
const CONFIG = {
  CHAT_URL: '/pixi/pixi-chat.php',          // alamat perantara otak Claude, contoh: '/pixi/pixi-chat.php'. Kosong = MODE DEMO.
  TTS_URL:  '/pixi/pixi-tts.php',   // suara tetap dari Gemini. Kosong = pakai suara bawaan browser.
  BAHASA:   'id-ID',
  // PITCH dan RATE HANYA berlaku untuk suara bawaan browser, yaitu saat TTS_URL
  // kosong atau saat servernya sedang gagal. Suara dari TTS_URL tidak
  // terpengaruh keduanya; nada dan gayanya diatur di pixi-tts.php.
  PITCH:    1.9,         // 0-2. Makin tinggi makin imut.
  RATE:     1.05,        // kecepatan bicara
  // IMUT: nada suara dari server dinaikkan saat diputar, karena suara Chirp 3 HD
  // tidak bisa diatur nadanya dari Google. Memutar lebih cepat sekaligus
  // menaikkan nada, dan perpaduan itulah yang terdengar seperti anak.
  //   1.00 apa adanya   1.08 sedikit ceria   1.14 imut   1.20 sangat imut
  IMUT:     1.14,
  // JEDA_SELESAI: berapa lama hening (milidetik) sebelum ucapan anak dianggap
  // selesai dan dikirim ke Pixi. Terlalu pendek, kalimat terpotong di tengah.
  // Terlalu panjang, Pixi terasa lambat menanggapi.
  JEDA_SELESAI: 900,
  MAX_PERTANYAAN: 25     // batas pertanyaan per kunjungan
};

/* =====================================================================
   1. PIXI 3D (dibangun dari bentuk dasar, tanpa file model)
   ===================================================================== */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();

// Lingkungan studio mini (softbox) supaya permukaan Pixi punya kilau lembut seperti mainan
(function(){
  const es = new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({color:0x5a4fc8, side:THREE.BackSide})));
  const kotak = (x, y, z, w, hh, s) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, hh), new THREE.MeshBasicMaterial({color:new THREE.Color(s, s, s), side:THREE.DoubleSide}));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m);
  };
  kotak(-8, 9, 9, 7, 5, 4); kotak(9, 4, 6, 3, 6, 2.2); kotak(0, 6, -10, 10, 3, 2);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(es, 0.03).texture;
  pm.dispose();
})();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9aeff, .75));
const kunci = new THREE.DirectionalLight(0xffffff, .55); kunci.position.set(3, 5, 6); scene.add(kunci);
const isi   = new THREE.DirectionalLight(0xe2dcff, .3); isi.position.set(-3, -2, 4); scene.add(isi);
const tepi  = new THREE.DirectionalLight(0xc8bfff, .6); tepi.position.set(-4, 3, -3); scene.add(tepi);

const mUngu  = new THREE.MeshPhysicalMaterial({color:0x6252ec, roughness:.42, clearcoat:.5, clearcoatRoughness:.35, envMapIntensity:.55});
const mUnguT = new THREE.MeshStandardMaterial({color:0x4438b8, roughness:.5});
const mPutih = new THREE.MeshStandardMaterial({color:0xffffff, roughness:.45, emissive:0x9a94b8, emissiveIntensity:.35, envMapIntensity:.15});
const mMata  = new THREE.MeshPhysicalMaterial({color:0x100c34, roughness:.08, clearcoat:1, clearcoatRoughness:.05, envMapIntensity:1});
const mEmas  = new THREE.MeshStandardMaterial({color:0xf9bd2a, roughness:.32, metalness:.1, emissive:0x6b4a00, emissiveIntensity:.25, envMapIntensity:.6});
const mPink  = new THREE.MeshStandardMaterial({color:0xff8fa3, roughness:.6});
const mMulut = new THREE.MeshStandardMaterial({color:0x7d1a3a, roughness:.5, side:THREE.DoubleSide});
const mLidah = new THREE.MeshStandardMaterial({color:0xff7d95, roughness:.5, side:THREE.DoubleSide});

function elips(sx, sy, sz, mat){
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 32), mat);
  m.scale.set(sx, sy, sz); return m;
}

const pixi = new THREE.Group(); scene.add(pixi);
const badan = new THREE.Group(); pixi.add(badan);

// Badan bulat + wajah putih (dengan bingkai ungu tipis di sekelilingnya)
badan.add(elips(1, .96, .96, mUngu));
const wajah = elips(.72, .53, .36, mPutih); wajah.position.set(0, -.06, .78); badan.add(wajah);

// Mata besar (2) + kilau besar di kanan-atas dan kilau kecil di kiri-bawah
const mata = new THREE.Group(); badan.add(mata);
const matas = [];
[-1, 1].forEach(s => {
  const g = new THREE.Group(); g.position.set(s * .3, .06, 1.09);
  g.add(elips(.125, .18, .06, mMata));
  const k1 = elips(.045, .058, .02, mPutih); k1.position.set(.035, .075, .05); g.add(k1);
  const k2 = elips(.02, .024, .015, mPutih);  k2.position.set(-.04, -.07, .05); g.add(k2);
  mata.add(g); matas.push(g);
});

// Pipi merona
[-1, 1].forEach(s => { const p = elips(.12, .065, .02, mPink); p.position.set(s * .5, -.15, 1.03); p.rotation.y = s * .5; badan.add(p); });

// Mulut: bentuk "D" senyum lebar + lidah. Membuka-menutup saat bicara.
const mulutG = new THREE.Group(); mulutG.position.set(0, -.15, 1.128); badan.add(mulutG);
const bentukMulut = new THREE.Shape();
bentukMulut.moveTo(-.15, 0); bentukMulut.lineTo(.15, 0); bentukMulut.absarc(0, 0, .15, 2 * Math.PI, Math.PI, true);
const dMulut = new THREE.Mesh(new THREE.ShapeGeometry(bentukMulut, 24), mMulut); mulutG.add(dMulut);
const lidah = elips(.08, .045, .01, mLidah); lidah.position.set(0, -.105, .004); mulutG.add(lidah);
mulutG.scale.set(1, .8, 1);

// Tangan: bulat gemuk menempel di samping badan (pivot di bahu supaya bisa melambai)
function buatTangan(sisi){
  const g = new THREE.Group(); g.position.set(sisi * .9, -.02, .12);
  const m = elips(.23, .4, .23, mUngu); m.position.set(0, -.26, 0); g.add(m);
  g.rotation.z = sisi * .45; badan.add(g); return g;
}
const tanganA = buatTangan(1), tanganB = buatTangan(-1);

// Kaki: pendek, gemuk, telapak besar
[-1, 1].forEach(s => {
  const kaki = new THREE.Mesh(new THREE.CylinderGeometry(.2, .22, .34, 24), mUngu); kaki.position.set(s * .4, -.94, .05); pixi.add(kaki);
  const telapak = elips(.34, .2, .4, mUngu); telapak.position.set(s * .4, -1.12, .13); pixi.add(telapak);
});

// Antena + bintang (bintang lebih besar dan membulat)
const antena = new THREE.Group(); antena.position.set(0, .94, 0); badan.add(antena);
const batang = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .4, 14), mUnguT); batang.position.y = .2; antena.add(batang);
const bentuk = new THREE.Shape();
for(let i = 0; i < 10; i++){
  const r = i % 2 ? .12 : .27, a = Math.PI / 2 + i * Math.PI / 5;
  const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? bentuk.lineTo(x, y) : bentuk.moveTo(x, y);
}
bentuk.closePath();
const geoBintang = new THREE.ExtrudeGeometry(bentuk, {depth:.08, bevelEnabled:true, bevelSize:.05, bevelThickness:.05, bevelSegments:6});
geoBintang.center();
const bintang = new THREE.Mesh(geoBintang, mEmas); bintang.position.y = .62; antena.add(bintang);

// Bayangan lembut di lantai
const cv = document.createElement('canvas'); cv.width = cv.height = 128;
const cx = cv.getContext('2d'); const gr = cx.createRadialGradient(64, 64, 4, 64, 64, 64);
gr.addColorStop(0, 'rgba(80,62,200,.30)'); gr.addColorStop(.55, 'rgba(80,62,200,.10)'); gr.addColorStop(1, 'rgba(80,62,200,0)');
cx.fillStyle = gr; cx.fillRect(0, 0, 128, 128);
const bayangan = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
bayangan.rotation.x = -Math.PI / 2; bayangan.position.y = -1.32; scene.add(bayangan);

// ---- Model 3D asli Pixi (GLB): badan + 2 tangan terpisah, mata & mulut digambar ulang dengan kode ----
let glbG = null, glbParts = null;
(function(){
  // Pixi versi sederhana (dirakit dari bentuk dasar di atas) langsung tampil dan
  // tombolnya langsung bisa ditekan. Model 3D yang detail menyusul di belakang
  // layar, lalu menggantikannya begitu siap.
  //
  // Sebelumnya Pixi disembunyikan dan tombol dimatikan sampai model selesai
  // diunduh. Model itu 2,5 MB, jadi di HP anak menatap layar kosong bertuliskan
  // "Pixi lagi bangun..." selama beberapa detik dan mengira halamannya rusak.
  // Sekarang tidak ada yang perlu ditunggu sebelum mulai mengobrol.
  const cadangan = () => { glbG = null; glbParts = null; };
  if(!THREE.GLTFLoader){ return; }

  const kanvas = (w, hh, gambar) => {
    const c = document.createElement('canvas'); c.width = w; c.height = hh; gambar(c.getContext('2d'), w, hh);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  };
  const bahanStiker = (map, urutan) => {
    const mt = new THREE.MeshStandardMaterial({map, transparent:true, roughness:.55, metalness:0, envMapIntensity:.3,
      depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4 - urutan * 2, polygonOffsetUnits:-4 - urutan * 2});
    return mt;
  };
  const tambalPutih = () => kanvas(128, 128, (x, w, hh) => {
    const g = x.createRadialGradient(w/2, hh/2, 0, w/2, hh/2, w/2);
    g.addColorStop(0, 'rgb(246,244,250)'); g.addColorStop(.7, 'rgb(246,244,250)'); g.addColorStop(1, 'rgba(246,244,250,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, hh);
  });
  const teksMata = () => kanvas(96, 136, (x, w, hh) => {
    const g = x.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#1d1655'); g.addColorStop(1, '#0a0726');
    x.fillStyle = g; x.beginPath(); x.ellipse(w/2, hh/2, w * .44, hh * .44, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.ellipse(w * .62, hh * .3, w * .15, hh * .11, -.3, 0, Math.PI * 2); x.fill();
    x.beginPath(); x.ellipse(w * .36, hh * .68, w * .06, hh * .045, 0, 0, Math.PI * 2); x.fill();
  });
  const teksMulut = () => kanvas(160, 90, (x, w, hh) => {
    x.save(); x.beginPath(); x.moveTo(w * .12, hh * .28); x.lineTo(w * .88, hh * .28);
    x.bezierCurveTo(w * .88, hh * .96, w * .12, hh * .96, w * .12, hh * .28); x.closePath(); x.clip();
    x.fillStyle = '#7d1a3a'; x.fillRect(0, 0, w, hh);
    x.fillStyle = '#ff7d95'; x.beginPath(); x.ellipse(w * .5, hh * .84, w * .19, hh * .16, 0, 0, Math.PI * 2); x.fill(); x.restore();
  });

  // Menutup bibir potongan tangan dengan kulit ungu polos, supaya tidak tampak "bolong" saat tangan bergerak
  const tutupPotongan = (mesh, bahan) => {
    const g = mesh.geometry, pos = g.attributes.position, idx = g.index.array;
    const dari = new Map(), hitung = new Map();
    const kunci = (a, b) => a < b ? a * 1e7 + b : b * 1e7 + a;
    for(let f = 0; f < idx.length; f += 3){
      for(let k = 0; k < 3; k++){
        const a = idx[f + k], b = idx[f + (k + 1) % 3], q = kunci(a, b);
        hitung.set(q, (hitung.get(q) || 0) + 1); dari.set(q, [a, b]);
      }
    }
    const tepi = new Map();                       // a -> b untuk sisi yang hanya dipakai satu segitiga
    hitung.forEach((n, q) => { if(n === 1){ const e = dari.get(q); tepi.set(e[0], e[1]); } });
    const dipakai = new Set(), titik = [], muka = [];
    tepi.forEach((_, mulai) => {
      if(dipakai.has(mulai)) return;
      const loop = []; let a = mulai, aman = 0;
      while(a !== undefined && !dipakai.has(a) && aman++ < 20000){ dipakai.add(a); loop.push(a); a = tepi.get(a); }
      if(loop.length < 12) return;
      const pusat = new THREE.Vector3();
      loop.forEach(v => pusat.add(new THREE.Vector3().fromBufferAttribute(pos, v)));
      pusat.multiplyScalar(1 / loop.length);
      const dasar = titik.length / 3;
      loop.forEach(v => titik.push(pos.getX(v), pos.getY(v), pos.getZ(v)));
      titik.push(pusat.x, pusat.y, pusat.z);
      const c = dasar + loop.length;
      for(let i = 0; i < loop.length; i++){ muka.push(dasar + (i + 1) % loop.length, dasar + i, c); }
    });
    if(!muka.length) return;
    const gt = new THREE.BufferGeometry();
    gt.setAttribute('position', new THREE.Float32BufferAttribute(titik, 3));
    gt.setIndex(muka); gt.computeVertexNormals();
    mesh.add(new THREE.Mesh(gt, bahan));
  };

  // Model dimuat sebagai file biner terpisah, TIDAK ditanam sebagai base64 di
  // halaman ini. Versi tertanam membuat halaman jadi 3,4 MB, dan LiteSpeed
  // kadang memotong respons brotli sebesar itu di tengah jalan: yang sampai ke
  // browser hanya sekitar 6 KB, seluruh skrip hilang, dan tombol Mulai mati.
  // Sebagai file terpisah halamannya tinggal ~40 KB, dan modelnya juga 25 persen
  // lebih kecil karena tidak lagi dibungkus base64.
  try{
    new THREE.GLTFLoader().load('pixi.glb', gltf => {
      const m = gltf.scene, node = {};
      m.traverse(o => { if(o.isMesh) node[o.name] = o; });
      m.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(m);
      const ukuran = box.getSize(new THREE.Vector3()), tengah = box.getCenter(new THREE.Vector3());

      // Tangan: dipasang pada "bahu" supaya bisa berayun
      const bahu = {L:[-.1405, .18, .07], R:[.1095, .18, .07]}, pivot = {};
      ['L', 'R'].forEach(s => {
        const a = node['arm' + s]; const p = bahu[s];
        const g = new THREE.Group(); g.position.set(p[0], p[1], p[2]);
        m.add(g); g.add(a); a.position.set(-p[0], -p[1], -p[2]);
        a.material = a.material.clone(); a.material.side = THREE.DoubleSide;
        tutupPotongan(a, new THREE.MeshStandardMaterial({color:0x6a58ee, roughness:.5, metalness:0, side:THREE.DoubleSide}));
        pivot[s] = g;
      });
      // Penambal di sisi badan (lubang di bawah tangan tampak saat tangan terangkat)
      const bahanIsi = node.body.material.clone(); bahanIsi.map = null; bahanIsi.color.set(0x5142d4);
      [[-.3, 1.05], [Math.PI - .75, 1.05]].forEach(([ph, pl]) => {
        const isi = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24, ph, pl, 1.15, 1.2), bahanIsi);
        isi.scale.setScalar(.1471 * .93); isi.position.set(-.0155, .1865, .008); m.add(isi);
      });

      // Wajah: tambalan putih menutup mata & mulut bawaan, lalu mata & mulut baru di atasnya
      let mataL = null, mataR = null, mulutM = null;
      if(THREE.DecalGeometry){
        const Z = .134;
        const stiker = (cx, cy, w, hh, tekstur, urutan) => {
          const geo = new THREE.DecalGeometry(node.body, new THREE.Vector3(cx, cy, Z), new THREE.Euler(0, 0, 0), new THREE.Vector3(w, hh, .06));
          geo.translate(-cx, -cy, -Z);
          const me = new THREE.Mesh(geo, bahanStiker(tekstur, urutan));
          me.position.set(cx, cy, Z); me.renderOrder = urutan; m.add(me); return me;
        };
        const tp = tambalPutih();
        stiker(-.0492, .1977, .054, .074, tp, 1); stiker(.0190, .1974, .054, .074, tp, 1); stiker(-.016, .158, .066, .038, tp, 1);
        const tm = teksMata();
        mataL = stiker(-.0492, .1977, .042, .06, tm, 2); mataR = stiker(.0190, .1974, .042, .06, tm, 2);
        mulutM = stiker(-.016, .159, .052, .029, teksMulut(), 2);
      }

      const s = 3.2 / ukuran.y;
      m.scale.setScalar(s);
      m.position.set(-tengah.x * s, -1.6 - box.min.y * s, -tengah.z * s);
      m.traverse(o => { if(o.isMesh && o.material && o.material.isMeshStandardMaterial && o.material.map){ o.material.envMapIntensity = .3; } });
      glbG = new THREE.Group(); glbG.position.y = .28; glbG.add(m);
      glbParts = {pivot, mataL, mataR, mulutM, dasar:{L:[-.0492, .1977], R:[.0190, .1974]}};
      pixi.children.slice().forEach(ch => { ch.visible = false; });   // sembunyikan Pixi buatan kode
      pixi.add(glbG); glbG.visible = true; pixi.visible = true;
    }, undefined, err => { console.error(err); cadangan(); });
  }catch(e){ console.error(e); cadangan(); }
})();

// Ukuran layar: Pixi ditaruh di ruang antara gelembung bicara (atas) dan tombol (bawah)
function ukur(){
  const bubble = document.getElementById('bubble'), dock = document.getElementById('dock');
  const lebar = matchMedia('(min-width:820px) and (min-aspect-ratio:5/4)').matches;
  let atas, bawah, kanan = 0;
  if(lebar){                       // laptop: Pixi besar di kiri, obrolan di kanan
    atas = 0; bawah = 0; kanan = Math.max(0, innerWidth - bubble.getBoundingClientRect().left + 12);
  } else {                         // HP: Pixi di antara gelembung dan tombol
    atas = bubble.getBoundingClientRect().bottom + 2;
    bawah = innerHeight - dock.getBoundingClientRect().top + 2;
  }
  stage.style.top = Math.max(0, atas) + 'px';
  stage.style.right = kanan + 'px';
  stage.style.bottom = Math.max(0, bawah) + 'px';
  const w = stage.clientWidth, h = Math.max(stage.clientHeight, 120);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const jarakTinggi = (3.9 / 2) / t;
  const jarakLebar  = (3.75 / 2) / (t * camera.aspect);
  camera.position.set(0, .3, Math.max(jarakTinggi, jarakLebar));
  camera.lookAt(0, .3, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', ukur); ukur();
if('ResizeObserver' in window){ const ro = new ResizeObserver(ukur); ro.observe(document.getElementById('bubble')); ro.observe(document.getElementById('dock')); }

/* =====================================================================
   2. ANIMASI  (idle, mendengar, berpikir, bicara, senang, melambai)
   ===================================================================== */
const jam = new THREE.Clock();
let keadaan = 'idle', mulaiKeadaan = 0;
let sedangBicara = false, tingkatSuara = 0, penganalisis = null;
let kedipBerikut = 2, kedipMulai = -1;
const kursor = {x:0, y:0};
addEventListener('pointermove', e => { kursor.x = e.clientX / innerWidth * 2 - 1; kursor.y = e.clientY / innerHeight * 2 - 1; });
function setKeadaan(k){ keadaan = k; mulaiKeadaan = jam.elapsedTime; }

// Pixi bisa diputar dan ditengokkan dengan menyeret badannya, lalu kembali
// sendiri menghadap depan saat dilepas.
//
// Sudutnya SENGAJA dibatasi. Model 3D-nya detail di bagian depan, sedangkan
// punggungnya polos dan sambungan tangannya terlihat dari belakang. Dengan batas
// ini anak tetap merasa Pixi benda tiga dimensi sungguhan, tanpa pernah
// terjebak menatap sisi yang kurang bagus.
const BATAS_PUTAR = 1.22;   // sekitar 70 derajat ke kiri dan ke kanan
const BATAS_TENGOK = 0.32;  // sekitar 18 derajat ke atas dan ke bawah
const jepit = (nilai, batas) => Math.max(-batas, Math.min(batas, nilai));

let seret = null, ekstra = 0, tengok = 0;
renderer.domElement.style.touchAction = 'none';   // seret tegak dipakai untuk menengok
renderer.domElement.addEventListener('pointerdown', e => {
  seret = {x:e.clientX, y:e.clientY, e0:ekstra, t0:tengok, jauh:0, mulai:performance.now()};
});
addEventListener('pointermove', e => {
  if(!seret) return;
  const dx = e.clientX - seret.x, dy = e.clientY - seret.y;
  seret.jauh = Math.max(seret.jauh, Math.abs(dx) + Math.abs(dy));
  ekstra = jepit(seret.e0 + dx * .012, BATAS_PUTAR);
  tengok = jepit(seret.t0 + dy * .006, BATAS_TENGOK);
});
addEventListener('pointerup', () => {
  // Sentuhan singkat tanpa menyeret dianggap colekan: Pixi melompat kegirangan.
  if(seret && seret.jauh < 8 && performance.now() - seret.mulai < 500 && !sibuk){
    setKeadaan('happy');
  }
  seret = null;
});

const v = {naik:0, miring:0, condong:0, tanganA:.35, tanganB:-.35, mataY:1, lirikX:0, lirikY:0, putar:.6, skala:1, putarBadan:0, mulut:0, mulutS:.8};
const halus = (k, target, laju, dt) => { v[k] += (target - v[k]) * (1 - Math.exp(-dt * laju)); };
const bufer = new Uint8Array(256);

function gerak(){
  requestAnimationFrame(gerak);
  const dt = Math.min(jam.getDelta(), .05), t = jam.elapsedTime, st = t - mulaiKeadaan;

  let naik = Math.sin(t * 2) * .04, miring = 0, condong = 0, tA = .35, tB = -.35, mataY = 1, lx = 0, ly = 0, putar = .6;

  if(keadaan === 'listening'){ condong = .14; mataY = 1.12; naik = Math.sin(t * 4) * .02; miring = Math.sin(t * 1.6) * .07; putar = 1.4; }
  else if(keadaan === 'thinking'){ miring = .2; lx = .06; ly = .05; putar = 7; tA = 1.1 + Math.sin(t * 6) * .1; }
  else if(keadaan === 'talking'){ naik = Math.abs(Math.sin(t * 6.5)) * .05; tA = .45 + Math.sin(t * 5) * .18; tB = -.45 - Math.sin(t * 4.2) * .18; putar = 1.2; }
  else if(keadaan === 'happy'){ naik = Math.abs(Math.sin(st * 7)) * .55 * Math.max(0, 1 - st / 2); tA = 2.35; tB = -2.35; mataY = .55; putar = 5; }
  else if(keadaan === 'wave'){ tA = 2.3 + Math.sin(st * 10) * .32; miring = .06; putar = 2.2; }

  halus('naik', naik, 14, dt); halus('miring', miring, 8, dt); halus('condong', condong, 8, dt);
  halus('tanganA', tA, 10, dt); halus('tanganB', tB, 10, dt); halus('mataY', mataY, 14, dt);
  halus('lirikX', lx, 8, dt); halus('lirikY', ly, 8, dt); halus('putar', putar, 4, dt);
  if(!seret){
    ekstra += (0 - ekstra) * (1 - Math.exp(-dt * 1.6));
    tengok += (0 - tengok) * (1 - Math.exp(-dt * 1.6));
  }
  halus('putarBadan', kursor.x * .3 + Math.sin(t * .7) * .1, 4, dt);

  // Tinggi mulut mengikuti suara (dari analyser kalau ada, kalau tidak: getaran tiruan)
  let level = 0;
  if(sedangBicara){
    if(penganalisis){
      penganalisis.getByteTimeDomainData(bufer);
      let s = 0; for(let i = 0; i < bufer.length; i++){ const d = (bufer[i] - 128) / 128; s += d * d; }
      level = Math.min(1, Math.sqrt(s / bufer.length) * 7);
    } else {
      level = (Math.sin(t * 13) * .5 + .5) * (.55 + .45 * Math.sin(t * 5.3));
    }
  }
  halus('mulut', level, 24, dt);

  pixi.position.y = v.naik;
  pixi.scale.set(1 + Math.sin(t * 2) * .01, 1 - Math.sin(t * 2) * .012, 1 + Math.sin(t * 2) * .01);
  bayangan.scale.setScalar(1 - v.naik * .35);
  badan.rotation.y = v.putarBadan + ekstra;
  badan.rotation.x = kursor.y * .12 + v.condong + tengok;
  badan.rotation.z = v.miring;
  tanganA.rotation.z = v.tanganA; tanganB.rotation.z = v.tanganB;
  antena.rotation.z = Math.sin(t * 3) * .07 - v.miring * .6;
  if(keadaan === 'thinking' || keadaan === 'happy') bintang.rotation.y += v.putar * dt;   // berputar saat berpikir/senang
  else { const sudut = Math.round(bintang.rotation.y / (2 * Math.PI)) * 2 * Math.PI; bintang.rotation.y += (sudut + Math.sin(t * 1.3) * .4 - bintang.rotation.y) * (1 - Math.exp(-dt * 4)); }

  // Kedip
  if(t > kedipBerikut){ kedipMulai = t; kedipBerikut = t + 2.5 + Math.random() * 3; }
  const k = (t - kedipMulai) / .16;
  const kedip = (k >= 0 && k < 1) ? 1 - .92 * Math.sin(k * Math.PI) : 1;
  matas.forEach(g => g.scale.y = v.mataY * kedip);
  mata.position.set(kursor.x * .035 + v.lirikX, -kursor.y * .025 + v.lirikY, 0);

  // Mulut: senyum "D" saat diam, membuka-menutup saat bicara
  const targetM = sedangBicara ? .3 + v.mulut * 1.5 : (keadaan === 'happy' ? 1.2 : .8);
  halus('mulutS', targetM, 22, dt);
  mulutG.scale.y = v.mulutS;
  mulutG.scale.x = 1 + (sedangBicara ? v.mulut * .1 : 0);

  if(glbG){   // badan condong/miring, tangan berayun, mata berkedip & melirik, mulut membuka
    glbG.rotation.set(kursor.y * .12 + v.condong + tengok,
                      v.putarBadan + ekstra + (keadaan === 'thinking' ? Math.sin(t * 3) * .12 : 0),
                      v.miring);
    const P = glbParts;
    if(P){
      P.pivot.R.rotation.z = v.tanganA - .35 + Math.sin(t * 1.8) * .04;
      P.pivot.L.rotation.z = v.tanganB + .35 - Math.sin(t * 1.8 + 1) * .04;
      if(keadaan === 'talking'){ P.pivot.R.rotation.x = Math.sin(t * 5) * .2; P.pivot.L.rotation.x = Math.sin(t * 4.3 + 1) * .2; }
      else { P.pivot.R.rotation.x *= .9; P.pivot.L.rotation.x *= .9; }
      if(P.mataL){
        [['mataL', 'L'], ['mataR', 'R']].forEach(([k, s]) => {
          const e = P[k], d = P.dasar[s];
          e.position.x = d[0] + kursor.x * .004 + v.lirikX * .07;
          e.position.y = d[1] - kursor.y * .003 + v.lirikY * .06;
          e.scale.y = Math.max(.06, v.mataY * kedip);
          e.scale.x = 1 + (v.mataY - 1) * .3;
        });
        P.mulutM.scale.y = v.mulutS / .8;
        P.mulutM.scale.x = 1 + (sedangBicara ? v.mulut * .12 : 0);
      }
    }
  }
  renderer.render(scene, camera);
}
gerak();

const el = id => document.getElementById(id);
const $teksPixi = el('teksPixi'), $teksAnak = el('teksAnak'), $mic = el('mic'), $catatan = el('catatan');
const tidur = ms => new Promise(r => setTimeout(r, ms));
const riwayat = [];
let jumlah = 0, sibuk = false, bisu = false, audioCtx = null, suaraId = null;

function tampilPixi(t){ $teksPixi.textContent = t; }
function tampilAnak(t){ $teksAnak.textContent = t ? 'Kamu: ' + t : ''; }

// ---- Otak ----
async function panggilOtak(teks){
  const r = await fetch(CONFIG.CHAT_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({messages:[...riwayat.slice(-12), {role:'user', content:teks}]})
  });
  const j = await r.json().catch(() => ({}));
  if(!r.ok || !j.reply) throw new Error(j.error || 'gagal');
  return j.reply;
}
// Jawaban Claude diambil MENGALIR, per kalimat, lalu tiap kalimat langsung
// disuarakan sambil kalimat berikutnya masih ditulis. Dulu keduanya berurutan:
// menunggu seluruh jawaban selesai (2,8 sampai 5,6 detik), baru membuat suara
// (sekitar 2 detik). Sekarang kalimat pertama tiba di sekitar 2 detik dan
// suaranya dibuat sementara sisanya menyusul, jadi dua tahap itu bertumpuk.
async function jawabMengalir(pertanyaan){
  const nomor = ++nomorUcapan;
  const r = await fetch(CONFIG.CHAT_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({alir:true, messages:[...riwayat.slice(-12), {role:'user', content:pertanyaan}]})
  });
  if(!r.ok || !r.body) throw new Error('alir');

  const pembaca = r.body.getReader(), pengurai = new TextDecoder();
  const antrean = [];
  let sisa = '', penuh = '', galat = '', habis = false, bangun = null;
  const tunggu = () => new Promise(res => { bangun = res; });
  const bangunkan = () => { const b = bangun; bangun = null; if(b) b(); };

  // Sisi pembaca: memecah aliran jadi baris, tiap baris satu kalimat.
  const membaca = (async () => {
    try{
      for(;;){
        const {done, value} = await pembaca.read();
        if(done) break;
        sisa += pengurai.decode(value, {stream:true});
        let pos;
        while((pos = sisa.indexOf('\n')) >= 0){
          const baris = sisa.slice(0, pos).trim(); sisa = sisa.slice(pos + 1);
          if(!baris) continue;
          let j; try{ j = JSON.parse(baris); }catch(e){ continue; }
          if(j.error){ galat = j.error; continue; }
          if(!j.k) continue;
          penuh = (penuh + ' ' + j.k).trim();
          tampilPixi(penuh);
          antrean.push(j.k);
          bangunkan();
        }
      }
    } finally { habis = true; bangunkan(); }
  })();

  // Sisi penyuara.
  //
  // Suara TIDAK diminta satu per satu menunggu giliran. Dulu begitu, dan
  // akibatnya tiap pergantian kalimat menyisakan jeda: pembuatan suara kalimat
  // berikutnya baru dimulai setelah kalimat sekarang selesai diputar.
  //
  // Sekarang permintaan suara dimulai begitu kalimatnya tiba dari aliran, sampai
  // beberapa kalimat di depan sekaligus. Karena seluruh kalimat tiba dalam dua
  // sampai tiga detik, suaranya dibuat berbarengan dan sudah siap saat gilirannya
  // datang. Batas MUKA menjaga agar tidak terlalu banyak permintaan sekaligus.
  const MUKA = 3;
  const suara = [];                       // janji suara, sejajar dengan antrean
  const siapkanSampai = (batas) => {
    for(let k = suara.length; k < Math.min(batas, antrean.length); k++){
      suara[k] = bisu ? Promise.resolve(null) : ambilSuara(antrean[k]).catch(() => null);
    }
  };

  const menyuarakan = (async () => {
    let i = 0;
    for(;;){
      siapkanSampai(i + MUKA);
      if(i >= antrean.length){
        if(habis) break;
        await tunggu(); continue;
      }
      if(nomor !== nomorUcapan) return;
      if(bisu){ i++; continue; }
      const blob = await suara[i];
      if(nomor !== nomorUcapan) return;
      if(blob){
        if(i === 0) setKeadaan('talking');
        await putarSuara(blob, nomor);
      } else {
        // Suara server gagal untuk kalimat ini: dibacakan suara browser saja,
        // supaya percakapan tidak berhenti di tengah.
        await new Promise(res => bicaraBrowser(antrean[i], res));
      }
      i++;
    }
  })();

  await membaca;
  if(!penuh) throw new Error(galat || 'kosong');
  await menyuarakan;
  return penuh;
}

// Jawaban contoh untuk MODE DEMO (belum tersambung ke Claude)
function jawabDemo(t){
  const s = t.toLowerCase();
  if(/nama|siapa (kamu|kau|dirimu)/.test(s)) return 'Halo! Namaku Pixi, robot bintang dari kelas Future Makers. Senang banget kenalan sama kamu! Kamu namanya siapa panggilannya?';
  if(/prompt/.test(s)) return 'Prompt itu kalimat perintah yang kamu tulis buat AI. Kayak resep masakan: makin jelas siapa, apa, gimana, dan di mana, makin enak hasilnya!';
  if(/\bai\b|kecerdasan|artificial/.test(s)) return 'AI itu kayak otak komputer yang belajar dari banyak sekali contoh, jadi dia bisa ngobrol dan bantu bikin game. Tapi kamu tetap bosnya ya!';
  if(/game|permainan/.test(s)) return 'Di kelas ini kamu bikin game sendiri lho! Kamu cuma perlu cerita ke AI, mau game yang kayak apa. Seru kan?';
  if(/lelucon|lucu|jokes?|tebak/.test(s)) return 'Kenapa komputer suka ke dokter? Karena dia kena virus! Hihihi.';
  if(/makasih|terima kasih|hebat|keren|suka/.test(s)) return 'Yeay, makasih ya! Kamu juga keren banget. Pixi senang ngobrol sama kamu!';
  if(/halo|hai|hi\b|hello/.test(s)) return 'Halo halo! Pixi siap ngobrol. Mau tanya soal apa hari ini?';
  return 'Hmm, Pixi belum ngerti nih. Coba tanya soal AI, prompt, atau game yang kamu buat ya!';
}

async function tanyaPixi(teks){
  teks = (teks || '').trim();
  if(!teks || sibuk) return;
  if(jumlah >= CONFIG.MAX_PERTANYAAN){
    // Saklar ikut dimatikan: kalau tidak, mikrofon tetap hidup dan menangkap
    // kalimat penutup Pixi dari speaker.
    dengarNyala = false; hentikanDengar(); jedaDengar = false; tampilTombolMic();
    await ucap('Wah, Pixi capek ngobrol banyak-banyak. Yuk istirahat dulu ya!', 'happy');
    return;
  }
  sibuk = true; hentikanDengar(); jumlah++;
  tampilAnak(teks); hentikanSuara();
  tampilPixi('Hmm, Pixi lagi mikir...'); setKeadaan('thinking');
  const senang = /makasih|terima kasih|hebat|keren|suka|sayang/i.test(teks);
  let jawab = '';

  // Jalur utama: jawaban mengalir per kalimat, langsung disuarakan.
  if(CONFIG.CHAT_URL && CONFIG.TTS_URL && window.ReadableStream){
    sedangBicara = true;
    try{ jawab = await jawabMengalir(teks); }
    catch(e){ jawab = ''; }
    finally{ sedangBicara = false; }
  }

  // Jalur cadangan: dipakai kalau aliran gagal, atau saat mode demo.
  if(!jawab){
    try{
      if(CONFIG.CHAT_URL){ jawab = await panggilOtak(teks); }
      else { await tidur(800); jawab = jawabDemo(teks); }
    }catch(e){
      jawab = 'Aduh, sinyal Pixi lagi putus-putus. Coba tanya lagi sebentar lagi ya!';
    }
    await ucap(jawab, senang ? 'happy' : 'talking');
  } else if(senang){
    setKeadaan('happy');
  }

  riwayat.push({role:'user', content:teks}, {role:'assistant', content:jawab});
  sibuk = false;
  if(dengarNyala) lanjutkanDengar(); else setKeadaan('idle');
}

// ---- Mulut (suara) ----
function pilihSuara(){
  const daftar = speechSynthesis.getVoices();
  suaraId = daftar.find(v => /^id/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pilihSuara(); speechSynthesis.onvoiceschanged = pilihSuara; }

function bicaraBrowser(teks, selesai){
  if(!('speechSynthesis' in window)){ setTimeout(selesai, Math.min(9000, 1200 + teks.length * 55)); return; }
  speechSynthesis.cancel();
  // Jawaban panjang dipecah per kalimat supaya Chrome tidak berhenti di tengah
  const kalimat = teks.match(/[^.!?]+[.!?]*/g).map(s => s.trim()).filter(Boolean);
  let i = 0;
  const lanjut = () => {
    if(i >= kalimat.length){ selesai(); return; }
    const u = new SpeechSynthesisUtterance(kalimat[i++]);
    u.lang = CONFIG.BAHASA; if(suaraId) u.voice = suaraId;
    u.pitch = CONFIG.PITCH; u.rate = CONFIG.RATE;
    u.onend = lanjut; u.onerror = selesai;
    speechSynthesis.speak(u);
  };
  lanjut();
}
// Meminta suara untuk SELURUH jawaban sekaligus membuat anak menunggu sekitar
// 8 detik sambil menatap teks yang sudah muncul. Lamanya pembuatan mengikuti
// panjang kalimat, jadi jawaban dipecah per kalimat: potongan pertama yang
// pendek selesai jauh lebih cepat, dan Pixi bisa mulai bicara duluan.
// Potongan berikutnya disiapkan sementara potongan sekarang masih diputar,
// sehingga tidak muncul jeda baru di tengah kalimat.
function potongKalimat(teks){
  // Jawaban pendek TIDAK dipecah. Dulu semua dipecah, sehingga potongan pertama
  // bisa sependek "Halo!" lalu berhenti sejenak menunggu potongan berikutnya -
  // terdengar seperti Pixi tersendat. Sejak memakai MP3 satu jawaban utuh pun
  // sudah ringan, jadi memecah hanya berguna untuk jawaban yang panjang.
  if(teks.length <= 220) return [teks];
  const kalimat = (teks.match(/[^.!?]+[.!?]*/g) || [teks]).map(k => k.trim()).filter(Boolean);
  const bagian = [];
  for(const k of kalimat){
    const akhir = bagian[bagian.length - 1];
    // Potongan dijaga tidak terlalu pendek supaya tidak terdengar terputus.
    if(akhir && akhir.length < 120) bagian[bagian.length - 1] = akhir + ' ' + k;
    else bagian.push(k);
  }
  return bagian;
}

async function ambilSuara(teks){
  const r = await fetch(CONFIG.TTS_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:teks})});
  // Server membalas JSON hanya kalau gagal; kalau berhasil isinya audio.
  if(!r.ok || !(r.headers.get('content-type') || '').includes('audio')) throw new Error('tts');
  return r.blob();
}

// Tiap kali Pixi mulai bicara, nomornya naik satu. Suara yang sedang berjalan
// memeriksa nomor ini dan berhenti kalau ternyata sudah ada ucapan yang lebih
// baru. Tanpa ini, menekan tombol saat Pixi masih bicara membuat dua suara
// berbunyi bersamaan.
let nomorUcapan = 0, audioBerjalan = null;
function hentikanSuara(){
  nomorUcapan++;
  if(audioBerjalan){ try{ audioBerjalan.pause(); }catch(e){} audioBerjalan = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  penganalisis = null;
}

async function putarSuara(blob, nomor){
  const url = URL.createObjectURL(blob);
  try{
    const a = new Audio(url);
    // Nada dinaikkan di sini. preservesPitch harus dimatikan lebih dulu, karena
    // browser secara bawaan menjaga nada tetap sama saat kecepatan diubah -
    // padahal naiknya nada itulah yang kita inginkan.
    a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
    a.playbackRate = CONFIG.IMUT || 1;
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    // Browser memulai AudioContext dalam keadaan tertidur sampai ada ketukan dari
    // pengguna. Tanpa dibangunkan, audionya jalan tapi tidak terdengar sama sekali.
    if(audioCtx.state === 'suspended'){ try{ await audioCtx.resume(); }catch(e){} }
    if(nomor !== nomorUcapan) return;
    const src = audioCtx.createMediaElementSource(a);
    penganalisis = audioCtx.createAnalyser(); penganalisis.fftSize = 256;
    src.connect(penganalisis); penganalisis.connect(audioCtx.destination);
    audioBerjalan = a;
    await a.play();
    await new Promise(res => { a.onended = res; a.onerror = res; });
  } finally {
    audioBerjalan = null;
    penganalisis = null; URL.revokeObjectURL(url);
  }
}

async function bicaraServer(teks){
  const nomor = ++nomorUcapan;
  const bagian = potongKalimat(teks);
  // Potongan kedua diminta bersamaan dengan yang pertama, bukan menunggu yang
  // pertama selesai diputar, supaya tidak ada jeda di tengah kalimat.
  const antre = [ambilSuara(bagian[0])];
  if(bagian.length > 1) antre.push(ambilSuara(bagian[1]).catch(() => null));
  for(let i = 0; i < bagian.length; i++){
    if(nomor !== nomorUcapan) return;
    let suara = null;
    try{ suara = await antre[i]; }
    catch(e){
      // Gagal di potongan pertama: seluruh jawaban dibacakan suara browser.
      // Gagal di tengah: berhenti saja, jangan mengulang dari awal.
      if(i === 0) throw e;
    }
    if(!suara) break;
    if(i + 2 < bagian.length) antre[i + 2] = ambilSuara(bagian[i + 2]).catch(() => null);
    await putarSuara(suara, nomor);
  }
}
function ucap(teks, gaya = 'talking'){
  return new Promise(res => {
    hentikanSuara();                 // apa pun yang sedang berbunyi, hentikan dulu
    tampilPixi(teks); setKeadaan(gaya); sedangBicara = true;
    const selesai = () => { sedangBicara = false; penganalisis = null; setKeadaan('idle'); res(); };
    if(bisu){ setTimeout(selesai, Math.min(7000, 1500 + teks.length * 45)); return; }
    if(CONFIG.TTS_URL){ bicaraServer(teks).then(selesai).catch(() => bicaraBrowser(teks, selesai)); }
    else bicaraBrowser(teks, selesai);
  });
}

// ---- Telinga (saklar nyala/mati; sekali tekan, Pixi mendengar terus) ----
// Anak tidak perlu menahan tombol sambil bicara. Tombol dinyalakan sekali, lalu
// percakapan berjalan bergantian seperti ngobrol biasa.
//
// Tiga keadaan yang dibedakan:
//   dengarNyala : anak ingin Pixi mendengar (posisi saklar).
//   mendengar   : objek pengenal suara benar-benar sedang berjalan.
//   jedaDengar  : dijeda sementara oleh kode, bukan oleh anak.
// Jeda dipakai selama Pixi berpikir dan bicara. Tanpa itu mikrofon menangkap
// suara Pixi sendiri dari speaker, lalu Pixi menjawab ucapannya sendiri.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, mendengar = false, dengarNyala = false, jedaDengar = false;

// Kalimat anak dikumpulkan di sini, BUKAN di dalam objek pengenal suara.
// Alasannya: di Android, pengenal suara menandai potongan pertama sebagai
// "final" hampir seketika, lalu sering berhenti sendiri dan dijalankan ulang.
// Kalau ucapan dikirim begitu potongan pertama final, "Halo nama saya Riki"
// terkirim sebagai "Halo" saja - sisanya hilang karena mikrofon keburu dijeda.
//
// Jadi potongan-potongan itu ditumpuk dulu, dan baru dikirim setelah anak
// benar-benar diam selama CONFIG.JEDA_SELESAI. Tiap suara baru menunda lagi
// pengirimannya, sehingga anak boleh berpikir sejenak di tengah kalimat.
// Dua penampung, dan pembagiannya penting:
//
//   sesiIni   kalimat lengkap menurut pengenal suara yang SEDANG berjalan.
//             Android mengirim ulang seluruh kalimat tiap kali, makin panjang,
//             jadi isinya DIGANTI, bukan ditambah. Menambahkannya membuat
//             "Saya lagi nonton TV" menumpuk jadi "Saya Saya lagi Saya lagi
//             nonton Saya lagi nonton TV".
//
//   sudahJadi kalimat dari pengenal suara SEBELUMNYA, yang sudah berhenti lalu
//             dijalankan ulang oleh Android di tengah anak bicara. Tanpa ini,
//             bagian yang sudah diucapkan hilang tiap kali Android menyalakan
//             ulang pengenalnya.
let sesiIni = '', sudahJadi = '', jamKirim = null;

// Menyambung dua bagian sambil membuang tumpang tindih di sambungannya.
// Perlu karena saat Android menyalakan ulang pengenal suara, kadang kalimat yang
// sudah terdengar diucapkan ulang dari awal. Tanpa ini, "Saya lagi" + "Saya lagi
// nonton TV" menjadi "Saya lagi Saya lagi nonton TV".
function sambung(awal, akhir){
  awal = awal.trim(); akhir = akhir.trim();
  if(!awal) return akhir;
  if(!akhir) return awal;
  const a = awal.split(/\s+/), b = akhir.split(/\s+/);
  const maks = Math.min(a.length, b.length, 12);
  for(let k = maks; k > 0; k--){
    const ekor = a.slice(a.length - k).join(' ').toLowerCase();
    const kepala = b.slice(0, k).join(' ').toLowerCase();
    if(ekor === kepala) return a.concat(b.slice(k)).join(' ');
  }
  return awal + ' ' + akhir;
}

function ucapanPenuh(){ return sambung(sudahJadi, sesiIni); }
function lupakanUcapan(){ sesiIni = ''; sudahJadi = ''; }
function batalkanKirim(){ clearTimeout(jamKirim); jamKirim = null; }

function jadwalkanKirim(){
  batalkanKirim();
  jamKirim = setTimeout(() => {
    const ucapan = ucapanPenuh();
    lupakanUcapan();
    if(ucapan) tanyaPixi(ucapan);
  }, CONFIG.JEDA_SELESAI);
}
const $micLabel = el('micLabel');

function tampilTombolMic(){
  $mic.classList.toggle('aktif', dengarNyala);
  $mic.setAttribute('aria-pressed', dengarNyala ? 'true' : 'false');
  $micLabel.textContent = dengarNyala ? 'Lagi dengerin' : 'Mulai ngobrol';
  $mic.setAttribute('aria-label', dengarNyala ? 'Matikan pendengaran Pixi' : 'Nyalakan pendengaran Pixi');
}

function jalankanDengar(){
  if(!dengarNyala || mendengar || jedaDengar || sibuk || !SR) return;
  rec = new SR();
  rec.lang = CONFIG.BAHASA; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e => {
    // Daftar dibaca ulang dari awal tiap kali, dan tiap bagian DILIPAT masuk
    // dengan membuang tumpang tindih, bukan sekadar disambung.
    //
    // Menyambung begitu saja masih menumpuk, karena Android kerap mengirim
    // potongan "final" yang isinya mengulang kalimat sebelumnya dalam bentuk
    // lebih panjang, dan mengirim tebakan sementara yang juga mengulang seluruh
    // kalimat. Melipat dengan pemotong tumpang tindih menutup kedua jalur itu.
    let pasti = '', tebakan = '';
    for(let i = 0; i < e.results.length; i++){
      const potongan = (e.results[i][0].transcript || '').trim();
      if(!potongan) continue;
      if(e.results[i].isFinal) pasti = sambung(pasti, potongan);
      else tebakan = potongan;              // hanya tebakan TERAKHIR yang dipakai
    }
    sesiIni = sambung(pasti, tebakan);
    tampilAnak(ucapanPenuh());
    // Setiap suara baru menunda pengiriman, jadi kalimat panjang tidak terpotong
    // di kata pertama dan anak boleh berpikir sejenak di tengah kalimat.
    jadwalkanKirim();
  };
  rec.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      dengarNyala = false; tampilTombolMic();
      catat('Izinkan mikrofon dulu di browser ya.');
    }
  };
  // Browser menghentikan sendiri pengenal suara setelah hening beberapa detik.
  // Selama saklar masih nyala, langsung dijalankan lagi supaya terasa menyambung.
  rec.onend = () => {
    mendengar = false;
    // Android sering menghentikan pengenal suara di tengah anak bicara. Bagian
    // yang sudah terdengar dipindahkan dulu, supaya tidak hilang saat pengenal
    // berikutnya mulai dari daftar kosong.
    if(sesiIni){ sudahJadi = ucapanPenuh(); sesiIni = ''; }
    setTimeout(jalankanDengar, 250);
  };
  try{ rec.start(); mendengar = true; }
  catch(e){ mendengar = false; }
}

function hentikanDengar(){
  jedaDengar = true;
  batalkanKirim(); lupakanUcapan();
  if(rec && mendengar){ try{ rec.abort(); }catch(e){} }
}
function lanjutkanDengar(){
  jedaDengar = false;
  setKeadaan(dengarNyala ? 'listening' : 'idle');
  jalankanDengar();
}

$mic.addEventListener('click', () => {
  if(!SR){ tampilPixi('Browser ini belum bisa mendengar. Ketik saja ya!'); el('formKetik').classList.add('buka'); return; }
  dengarNyala = !dengarNyala;
  tampilTombolMic();
  if(dengarNyala){
    if('speechSynthesis' in window) speechSynthesis.cancel();
    catat('');
    if(!sibuk){ tampilPixi('Pixi dengerin... ngomong aja!'); }
    lanjutkanDengar();
  } else {
    hentikanDengar(); jedaDengar = false; tampilAnak('');
    if(!sibuk) setKeadaan('idle');
  }
});
// Spasi menyalakan/mematikan saklar yang sama, bukan lagi ditahan.
addEventListener('keydown', e => {
  if(e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $mic.click(); }
});

// ---- Tombol lain ----
el('tombolKetik').addEventListener('click', () => { el('formKetik').classList.toggle('buka'); el('isiKetik').focus(); });
el('formKetik').addEventListener('submit', e => { e.preventDefault(); const i = el('isiKetik'); const t = i.value; i.value = ''; tanyaPixi(t); });
el('tombolSuara').addEventListener('click', () => {
  bisu = !bisu; el('tombolSuara').textContent = bisu ? '🔇' : '🔊';
  if(bisu && 'speechSynthesis' in window) speechSynthesis.cancel();
});

// ---- Layar pembuka (perlu 1 ketukan supaya browser mengizinkan suara) ----
el('btnMulai').addEventListener('click', async () => {
  el('mulai').classList.add('tutup');
  if(!CONFIG.CHAT_URL) catat('Mode demo: otak Claude belum tersambung.');
  await ucap('Halo! Aku Pixi, robot bintang dari Future Makers. Tekan tombol ungu sekali, lalu ngobrol sama aku ya!', 'wave');
});
</script>
