<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>StudyBuddy AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F2F5F6; --surface:#FFFFFF; --surface2:#E7EEF0; --raise:0 1px 2px rgba(11,42,50,.06), 0 8px 24px rgba(11,42,50,.06);
    --ink:#10262E; --ink2:#4B6670; --line:#D3DFE3;
    --teal:#0E7C86; --teal-ink:#0A5A63; --teal-soft:#DCEFF1;
    --orange:#D0640F; --orange-ink:#8F4409; --orange-soft:#FBEBDB;
    --ok:#146C36; --ok-soft:#DFF1E4; --err:#B23325; --err-soft:#FAE5E2;
    --bubble-me:#0E7C86; --bubble-me-ink:#FFFFFF;
    --r:14px;
    --f-dis:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --f-mono:"IBM Plex Mono", ui-monospace, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#091518; --surface:#102229; --surface2:#173037; --raise:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --ink:#E8F1F3; --ink2:#A0B7BE; --line:#254149;
      --teal:#4CC2CD; --teal-ink:#8FE2E8; --teal-soft:#123339;
      --orange:#F09244; --orange-ink:#F7B87C; --orange-soft:#33200F;
      --ok:#63C78A; --ok-soft:#12301D; --err:#F08C7F; --err-soft:#3A1B16;
      --bubble-me:#155863; --bubble-me-ink:#EAFBFD;
    }
  }
  :root[data-theme="dark"]{
    --ground:#091518; --surface:#102229; --surface2:#173037; --raise:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --ink:#E8F1F3; --ink2:#A0B7BE; --line:#254149;
    --teal:#4CC2CD; --teal-ink:#8FE2E8; --teal-soft:#123339;
    --orange:#F09244; --orange-ink:#F7B87C; --orange-soft:#33200F;
    --ok:#63C78A; --ok-soft:#12301D; --err:#F08C7F; --err-soft:#3A1B16;
    --bubble-me:#155863; --bubble-me-ink:#EAFBFD;
  }

  *{box-sizing:border-box}
  body{background:var(--ground); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--f-dis); line-height:1.2; text-wrap:balance; margin:0}
  p{margin:0}
  button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
  input,textarea,select{font:inherit; color:inherit}
  :focus-visible{outline:3px solid var(--orange); outline-offset:2px; border-radius:6px}

  /* ---------- shell ---------- */
  .top{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
  .top-in{max-width:1000px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:9px; font-family:var(--f-dis); font-weight:800; letter-spacing:-.02em; font-size:17px}
  .mark{width:30px; height:30px; border-radius:9px; background:linear-gradient(145deg, var(--teal), var(--teal-ink)); display:grid; place-items:center; color:#fff; font-size:15px; flex:none}
  nav{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin-left:auto}
  nav::-webkit-scrollbar{display:none}
  .navb{padding:8px 13px; border-radius:999px; font-size:14.5px; font-weight:500; color:var(--ink2); white-space:nowrap}
  .navb:hover{background:var(--surface2); color:var(--ink)}
  .navb[aria-current="page"]{background:var(--teal-soft); color:var(--teal-ink); font-weight:600}
  main{max-width:1000px; margin:0 auto; padding:22px 16px 60px}
  .wrap{max-width:760px; margin:0 auto}

  /* ---------- bits ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:12px 22px; border-radius:12px; font-family:var(--f-dis); font-weight:700; font-size:16px; background:var(--orange); color:#fff; box-shadow:0 2px 0 color-mix(in srgb, var(--orange) 60%, #000); transition:transform .12s ease, filter .12s ease}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px); box-shadow:none}
  .btn.big{min-height:58px; font-size:18px; padding:14px 30px}
  .btn.sec{background:var(--surface); color:var(--teal-ink); border:1.5px solid var(--teal); box-shadow:none; font-weight:600}
  .btn.sec:hover{background:var(--teal-soft)}
  .btn.ghost{background:transparent; color:var(--ink2); border:1.5px solid var(--line); box-shadow:none; font-weight:600}
  .btn.ghost:hover{background:var(--surface2); color:var(--ink)}
  .btn[disabled]{opacity:.45; cursor:not-allowed; filter:none; transform:none}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px}
  .lbl{font-family:var(--f-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); font-weight:500}
  .tag{display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:5px 10px; border-radius:999px; background:var(--orange-soft); color:var(--orange-ink); font-weight:600}
  .tag.t{background:var(--teal-soft); color:var(--teal-ink)}
  .muted{color:var(--ink2)}
  .stack{display:flex; flex-direction:column; gap:16px}
  .stack.s{gap:10px}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  hr.sep{border:0; border-top:1px solid var(--line); margin:0}

  /* ---------- landing ---------- */
  .hero{display:grid; grid-template-columns:1.15fr .85fr; gap:28px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:30px; box-shadow:var(--raise); position:relative; overflow:hidden}
  .hero::before{content:""; position:absolute; inset:0; background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% 28px; opacity:.5; mask-image:linear-gradient(to bottom, transparent, #000 60%, transparent)}
  .hero>*{position:relative}
  .hero h1{font-size:clamp(30px, 6vw, 44px); letter-spacing:-.03em}
  .hero .tagline{font-size:18px; color:var(--ink2); max-width:34ch; margin-top:12px}
  .desk{aspect-ratio:1/.86; border-radius:16px; background:linear-gradient(160deg, var(--teal-soft), var(--surface2)); border:1px solid var(--line); display:grid; place-items:center; position:relative; overflow:hidden}
  .desk .bulb{font-size:52px; filter:saturate(1.05)}
  .desk .bk{position:absolute; bottom:0; left:0; right:0; height:38%; display:flex; align-items:flex-end; justify-content:center; gap:7px; padding-bottom:14px}
  .desk .bk i{display:block; width:16px; border-radius:3px 3px 0 0; background:var(--teal); opacity:.9}
  .desk .bk i:nth-child(2){background:var(--orange); height:56%}
  .desk .bk i:nth-child(1){height:38%} .desk .bk i:nth-child(3){height:72%} .desk .bk i:nth-child(4){height:46%; background:var(--teal-ink)}
  .steps{counter-reset:s; display:grid; gap:12px}
  .step{display:grid; grid-template-columns:30px 1fr; gap:12px; align-items:start}
  .step b{counter-increment:s; width:30px; height:30px; border-radius:9px; background:var(--teal-soft); color:var(--teal-ink); display:grid; place-items:center; font-family:var(--f-mono); font-size:13px; font-weight:600}
  .step b::before{content:counter(s)}

  /* ---------- form ---------- */
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
  .pick{text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:14px 16px; display:flex; gap:12px; align-items:center; min-height:64px; transition:border-color .12s, background .12s}
  .pick:hover{border-color:var(--teal)}
  .pick[aria-pressed="true"]{border-color:var(--teal); background:var(--teal-soft); box-shadow:inset 0 0 0 1px var(--teal)}
  .pick .em{font-size:22px; flex:none}
  .pick .nm{font-family:var(--f-dis); font-weight:700; font-size:15.5px}
  .pick .ds{font-size:13px; color:var(--ink2); line-height:1.4}
  .fld label{display:block; font-family:var(--f-dis); font-weight:700; font-size:15px; margin-bottom:6px}
  .fld .hint{font-size:13px; color:var(--ink2); margin-bottom:8px}
  .in{width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); min-height:50px}
  .in:focus{border-color:var(--teal); outline:none; box-shadow:0 0 0 3px var(--teal-soft)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
  .chip{font-size:13.5px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink2)}
  .chip:hover{border-color:var(--teal); color:var(--teal-ink); background:var(--teal-soft)}
  .alert{border-radius:12px; padding:12px 14px; font-size:14.5px; display:flex; gap:9px; align-items:flex-start}
  .alert.warn{background:var(--orange-soft); color:var(--orange-ink)}
  .alert.err{background:var(--err-soft); color:var(--err)}
  .alert.ok{background:var(--ok-soft); color:var(--ok)}

  /* ---------- chat ---------- */
  .chead{background:var(--surface); border:1px solid var(--line); border-radius:var(--r) var(--r) 0 0; padding:13px 16px; display:flex; align-items:center; gap:12px}
  .avat{width:40px; height:40px; border-radius:12px; background:linear-gradient(145deg, var(--teal), var(--teal-ink)); color:#fff; display:grid; place-items:center; font-size:19px; flex:none}
  .chead .ttl{font-family:var(--f-dis); font-weight:700; font-size:16px; line-height:1.25}
  .chead .sub{font-size:12.5px; color:var(--ink2); line-height:1.35}
  .icobtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); display:grid; place-items:center; font-size:15px; flex:none}
  .icobtn:hover{background:var(--surface2)}
  #msgs{background:var(--surface); border:1px solid var(--line); border-top:0; padding:16px; display:flex; flex-direction:column; gap:14px; min-height:260px; max-height:min(52vh, 520px); overflow-y:auto}
  .msg{display:flex; flex-direction:column; gap:5px; max-width:88%}
  .msg.me{align-self:flex-end; align-items:flex-end}
  .bub{padding:12px 15px; border-radius:16px; font-size:15.5px; line-height:1.62; white-space:pre-wrap; overflow-wrap:anywhere}
  .msg.ai .bub{background:var(--surface2); border:1px solid var(--line); border-left:3px solid var(--teal); border-radius:6px 16px 16px 16px}
  .msg.me .bub{background:var(--bubble-me); color:var(--bubble-me-ink); border-radius:16px 6px 16px 16px}
  .who{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2)}
  .rep{font-size:12.5px; color:var(--ink2); text-decoration:underline; text-underline-offset:3px; padding:2px 0; align-self:flex-start}
  .rep:hover{color:var(--err)}
  .repd{font-size:12.5px; color:var(--ok)}
  .typing{display:flex; gap:5px; padding:14px 16px; background:var(--surface2); border:1px solid var(--line); border-left:3px solid var(--teal); border-radius:6px 16px 16px 16px; width:fit-content}
  .typing i{width:7px; height:7px; border-radius:50%; background:var(--ink2); animation:bl 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,60%,100%{opacity:.28; transform:translateY(0)} 30%{opacity:1; transform:translateY(-3px)}}
  .cfoot{background:var(--surface); border:1px solid var(--line); border-top:0; border-radius:0 0 var(--r) var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:12px}
  .warnbar{background:var(--orange-soft); color:var(--orange-ink); border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.5}
  .askform{display:flex; gap:9px}
  .askform .in{min-height:48px}
  .askform .btn{min-height:48px; padding:12px 18px}
  .modal{position:fixed; inset:0; z-index:60; background:rgba(6,20,25,.55); display:grid; place-items:center; padding:18px}
  .modal .box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); max-width:560px; width:100%; padding:22px; box-shadow:var(--raise); max-height:86vh; overflow:auto}
  .prompt{font-family:var(--f-mono); font-size:14px; line-height:1.65; background:var(--surface2); border:1px dashed var(--line); border-radius:10px; padding:14px; white-space:pre-wrap}

  /* ---------- kuis ---------- */
  .qcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:12px}
  .opt{display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:11px; background:var(--surface); min-height:52px; font-size:15px; line-height:1.5}
  .opt:hover:not([disabled]){border-color:var(--teal)}
  .opt .k{font-family:var(--f-mono); font-weight:600; color:var(--ink2); flex:none}
  .opt[aria-pressed="true"]{border-color:var(--teal); background:var(--teal-soft)}
  .opt.right{border-color:var(--ok); background:var(--ok-soft)} .opt.right .k{color:var(--ok)}
  .opt.wrong{border-color:var(--err); background:var(--err-soft)} .opt.wrong .k{color:var(--err)}
  .opt[disabled]{cursor:default}
  .bahas{font-size:14.5px; line-height:1.6; border-left:3px solid var(--teal); padding:2px 0 2px 12px; color:var(--ink2)}
  .score{display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px}
  .score .num{font-family:var(--f-dis); font-weight:800; font-size:clamp(28px,7vw,40px); letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--teal-ink)}
  .bar{height:9px; border-radius:99px; background:var(--surface2); overflow:hidden; flex:1; min-width:130px}
  .bar>i{display:block; height:100%; background:var(--teal); border-radius:99px; transition:width .5s ease}

  /* ---------- konten statis ---------- */
  .prose h2{font-size:23px; letter-spacing:-.02em; margin-top:4px}
  .prose h3{font-size:17px; margin-top:2px}
  .prose p, .prose li{font-size:15.5px; line-height:1.7}
  .prose ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:7px}
  .dl{display:grid; grid-template-columns:150px 1fr; gap:8px 18px; font-size:15.5px}
  .dl dt{font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); padding-top:4px}
  .dl dd{margin:0}
  .safe{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:start}
  .safe .ic{width:44px; height:44px; border-radius:12px; background:var(--teal-soft); display:grid; place-items:center; font-size:20px}
  .empty{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:38px 20px}
  .empty .em{font-size:44px}
  .lnk{padding:0; color:var(--teal-ink); font-weight:600; text-decoration:underline; text-underline-offset:3px}

  @media (max-width:720px){
    .hero{grid-template-columns:1fr; padding:22px; gap:20px}
    .desk{max-width:250px; margin:0 auto; width:100%}
    .dl{grid-template-columns:1fr; gap:2px 0}
    .dl dd{margin-bottom:10px}
    .msg{max-width:94%}
    main{padding:16px 12px 50px}
    .askform{flex-wrap:wrap}
    .askform .in{flex:1 1 100%}
    .askform .btn{flex:1}
    .btn{width:100%}
    .row .btn{flex:1 1 100%}
    .top-in{padding:10px 12px}
    nav{margin-left:0; width:100%; order:3}
  }
  @media (max-width:430px){
    .cfoot .row{flex-direction:column}
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
  @media print{ .top,.cfoot{display:none} }
</style>

<div class="top">
  <div class="top-in">
    <div class="brand"><span class="mark">🎓</span> StudyBuddy AI</div>
    <nav id="nav"></nav>
  </div>
</div>
<main id="app"></main>
<div id="modalHost"></div>

<script>
(function(){
  "use strict";

  /* =========================================================
     SYSTEM PROMPT (acuan gaya bahasa seluruh respons simulasi)
     ========================================================= */
  var SYSTEM_PROMPT = "Kamu adalah tutor yang ramah untuk siswa SMP. Jelaskan materi secara bertahap, gunakan contoh sehari-hari, jangan langsung memberikan jawaban tugas, dan selalu ingatkan pengguna untuk memeriksa informasi penting.";

  var MAPEL = [
    {id:"Matematika",   em:"📐", ds:"Angka, pola, dan cara menghitung"},
    {id:"IPA",          em:"🌱", ds:"Alam, tubuh, energi, dan zat"},
    {id:"Bahasa Inggris", em:"🗣️", ds:"Kosakata, tata bahasa, percakapan"},
    {id:"IPS",          em:"🗺️", ds:"Sejarah, masyarakat, dan wilayah"}
  ];

  var TINGKAT = [
    {id:"singkat", nm:"Singkat", em:"⚡", ds:"Inti materi dalam 1–2 kalimat"},
    {id:"lengkap", nm:"Lengkap", em:"📖", ds:"Penjelasan bertahap dan lebih detail"},
    {id:"analogi", nm:"Menggunakan analogi", em:"🍕", ds:"Dijelaskan lewat perumpamaan sehari-hari"}
  ];

  /* =========================================================
     DATABASE TOPIK CONTOH
     ========================================================= */
  var TOPIK = {
    pecahan: {
      nama:"Pecahan", mapel:"Matematika",
      kata:["pecahan","pembilang","penyebut","fraction","fraksi"],
      penjelasan:{
        singkat:"Pecahan adalah cara menuliskan bagian dari sesuatu yang utuh. Misalnya, 1/2 artinya satu dari dua bagian yang sama besar.",
        lengkap:"Pecahan terdiri dari pembilang (angka atas) dan penyebut (angka bawah). Penyebut menunjukkan menjadi berapa bagian sama besar sesuatu itu dibagi, sedangkan pembilang menunjukkan berapa bagian yang kita maksud. Untuk membandingkan dua pecahan, kita bisa menyamakan penyebutnya terlebih dahulu.",
        analogi:"Bayangkan kamu punya satu pizza yang dipotong menjadi 4 bagian sama besar. Kalau kamu makan 1 potong, berarti kamu makan 1/4 pizza. Kalau temanmu makan 2 potong, dia makan 2/4 atau sama saja dengan 1/2 pizza!"
      },
      contoh:[
        "Contoh soal:\nAni punya 8 permen dan ingin memberikan 1/4 bagian ke adiknya. Berapa permen yang diberikan?\n\nJawab: 8 ÷ 4 = 2 permen.\n\nCoba perhatikan langkahnya: penyebut 4 artinya permen dibagi menjadi 4 kelompok sama banyak, lalu pembilang 1 artinya kita ambil 1 kelompok.",
        "Contoh lain di kehidupan sehari-hari:\nSatu botol air 600 ml diminum 3/4 bagiannya saat istirahat.\n\nLangkahnya: 600 ÷ 4 = 150 ml untuk satu bagian, lalu 150 × 3 = 450 ml yang diminum.\n\nCoba kamu hitung sendiri: berapa ml yang masih tersisa di botol? Kalau sudah dapat jawabannya, cocokkan dengan buku catatanmu ya."
      ],
      soal:[
        {q:"Pecahan 1/2 sama besar dengan pecahan berikut, kecuali…",
         opsi:["2/4","3/6","4/8","2/5"], kunci:3,
         bahas:"2/4, 3/6, dan 4/8 semuanya bisa disederhanakan menjadi 1/2. Sedangkan 2/5 nilainya 0,4 — lebih kecil dari 1/2 (0,5), jadi 2/5 tidak sama dengan 1/2."},
        {q:"Ibu membagi kue menjadi beberapa bagian sama besar untuk 3 orang. Setiap orang mendapat berapa bagian dari keseluruhan kue?",
         opsi:["1/2","1/3","1/4","2/3"], kunci:1,
         bahas:"Keseluruhan kue dibagi rata untuk 3 orang, jadi penyebutnya 3 dan setiap orang menerima 1 bagian dari 3 bagian itu, yaitu 1/3 dari keseluruhan kue."},
        {q:"Manakah pecahan yang nilainya paling besar?",

      ]
    },

    fotosintesis: {
      nama:"Fotosintesis", mapel:"IPA",
      kata:["fotosintesis","photosynthesis","klorofil","daun hijau"],

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function el(id){ return document.getElementById(id); }
  function cariTopik(teks){
    var t = String(teks||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
    if(!t) return null;
    for(var k in TOPIK){
      if(!Object.prototype.hasOwnProperty.call(TOPIK,k)) continue;
      var d = TOPIK[k];
      var kunci = [k, d.nama.toLowerCase()].concat(d.kata);
      for(var i=0;i<kunci.length;i++){
        var kk = kunci[i].toLowerCase();
        if(t.indexOf(kk) !== -1 || kk.indexOf(t) !== -1 && t.length >= 4) return k;
      }
    }
    return null;
  }
  function judulTopik(){
    if(S.topikKey && TOPIK[S.topikKey]) return TOPIK[S.topikKey].nama;
    return S.topikInput || "topik pilihanmu";
  }
  function sapa(){ return S.panggilan ? S.panggilan : "teman belajar"; }

    var isi, penutup;
    if(S.topikKey && TOPIK[S.topikKey]){
      isi = TOPIK[S.topikKey].penjelasan[S.tingkat] || TOPIK[S.topikKey].penjelasan.lengkap;
    }else{
      var topik = judulTopik(), mp = S.mapel || "pelajaran ini";
      if(S.tingkat === "singkat"){
        isi = "Secara singkat, " + topik + " adalah bagian dari materi " + mp + " yang penting untuk dipahami. Coba baca dulu bagian ini di bukumu, ya!";
      }else if(S.tingkat === "analogi"){
        isi = "Coba bayangkan " + topik + " seperti menyusun puzzle: ada beberapa bagian kecil (konsep dasar) yang perlu digabungkan supaya membentuk gambaran besar yang utuh.";
      }else{
        isi = topik + " biasanya melibatkan beberapa konsep dasar yang saling berhubungan dalam " + mp + ". Coba pahami satu per satu, lalu tanyakan bagian mana yang masih membingungkan supaya StudyBuddy bisa bantu lebih detail.";

    return pembuka + isi + penutup;

    var out = v[S.tanyaIdx % v.length] + jujur;
    S.tanyaIdx++;
    return out;

  function pushAI(text){
    if(timer){ clearTimeout(timer); timer = null; }
    S.typing = true;
    renderChat(); updateControls();
    timer = setTimeout(function(){
      S.typing = false; timer = null;
      S.chat.push({from:"ai", text:text, reported:false});
      renderChat(); updateControls();
    }, 950);
  }
  function pushSiswa(text){
    S.chat.push({from:"me", text:text, reported:false});
    renderChat();
  }

    if(timer){ clearTimeout(timer); timer = null; }
    S.chat = [];
    S.typing = false;
    S.contohIdx = 0; S.tanyaIdx = 0;
    S.quizAns = [null,null,null]; S.quizChecked = false; S.quizErr = "";
    S.refleksi = ["",""]; S.refleksiSaved = false;
    S.sesiAktif = true;
    go("chat");
    pushAI(penjelasanAwal());
  }

    if(timer){ clearTimeout(timer); timer = null; }
    S.chat = []; S.typing = false; S.sesiAktif = false;
    S.topikKey = null; S.topikInput = ""; S.mapel = null; S.panggilan = "";

    S.quizAns = [null,null,null]; S.quizChecked = false; S.quizErr = "";
    S.refleksi = ["",""]; S.refleksiSaved = false;
    go("form");
  }

  function namaTingkat(id){

  function renderChat(){
    var box = el("msgs");
    if(!box) return;
    var html = S.chat.map(function(m, i){
      if(m.from === "me"){
        return '<div class="msg me"><span class="who">Kamu</span><div class="bub">'+esc(m.text)+'</div></div>';
      }
      var aksi = m.reported
        ? '<span class="repd">✅ Terima kasih, laporanmu dicatat.</span>'
        : '<button class="rep" data-act="lapor" data-i="'+i+'">🚩 Laporkan jawaban ini</button>';
      return '<div class="msg ai"><span class="who">StudyBuddy AI</span><div class="bub">'+esc(m.text)+'</div>'+aksi+'</div>';
    }).join("");
    if(S.typing){
      html += '<div class="msg ai"><span class="who">StudyBuddy AI</span><div class="typing" aria-label="StudyBuddy sedang mengetik"><i></i><i></i><i></i></div></div>';
    }
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;

  function pageLatihan(){
    if(!S.sesiAktif){
      return '<div class="wrap"><div class="card empty"><span class="em">🧩</span>' +
        '<h2 style="font-size:22px">Belum ada latihan</h2>' +
        '<p class="muted">Pilih topik dulu, lalu StudyBuddy menyiapkan latihannya.</p>' +
        '<button class="btn" data-act="mulai">Mulai Belajar</button></div></div>';
    }
    var tombol = '<div class="row" style="margin-top:4px">' +
      '<button class="btn sec" data-act="riwayat" style="flex:1">💬 Lihat Riwayat Percakapan</button>' +
      '<button class="btn ghost" data-act="topiklain" style="flex:1">🔄 Tanya Topik Lain</button>' +
    '</div>';

    /* --- topik bebas: refleksi terbuka --- */
    if(!S.topikKey){
      return '<div class="wrap stack">' +
        '<div><span class="tag t">Latihan &amp; Evaluasi</span>' +
        '<h2 style="font-size:25px; margin-top:12px">Refleksi: '+esc(judulTopik())+'</h2></div>' +
        '<div class="alert warn">💡 <span>Topik ini di luar database contoh StudyBuddy, jadi aku <strong>tidak membuat soal pilihan ganda</strong> — kuncinya belum tentu benar. Sebagai gantinya, jawab dua pertanyaan refleksi ini dengan kata-katamu sendiri, lalu cocokkan dengan buku atau gurumu.</span></div>' +
        '<div class="qcard">' +
          '<h3>1. Coba jelaskan kembali topik ini dengan kata-katamu sendiri.</h3>' +
          '<textarea class="in" id="ref0" rows="4" maxlength="600" placeholder="Tulis penjelasan versimu di sini…">'+esc(S.refleksi[0])+'</textarea>' +
        '</div>' +
        '<div class="qcard">' +
          '<h3>2. Tulis satu pertanyaan yang masih ingin kamu tanyakan tentang topik ini.</h3>' +
          '<textarea class="in" id="ref1" rows="3" maxlength="300" placeholder="Contoh: bagian mana yang paling sering keluar di ulangan?">'+esc(S.refleksi[1])+'</textarea>' +
        '</div>' +
        (S.refleksiSaved
          ? '<div class="alert ok">✅ <span>Bagus, ' + esc(sapa()) + '! Menjelaskan ulang dengan kalimat sendiri adalah cara paling ampuh mengecek pemahaman. Bawa pertanyaanmu ke guru atau bahas bersama temanmu ya — refleksi ini tidak dinilai dan tidak disimpan.</span></div>'
          : '<button class="btn" data-act="simpanref">Simpan Refleksi</button>') +
        tombol +
      '</div>';
    }

    /* --- topik database: kuis pilihan ganda --- */
    var d = TOPIK[S.topikKey];
    var soal = d && d.soal;
    if(!soal || !soal.length){
      return '<div class="wrap"><div class="card empty"><span class="em">🧰</span>' +
        '<h2 style="font-size:22px">Latihannya belum bisa dimuat</h2>' +
        '<p class="muted" style="max-width:46ch">Maaf, soal untuk topik ini belum siap. Tenang, riwayat percakapanmu tetap aman.</p>' +
        '<div class="row" style="justify-content:center"><button class="btn" data-act="latihanulang">Coba Lagi</button>' +
        '<button class="btn sec" data-act="riwayat">Kembali ke Percakapan</button></div></div></div>';
    }

    var skor = 0;
    for(var i=0;i<soal.length;i++){ if(S.quizAns[i] === soal[i].kunci) skor++; }
    skor = isNaN(skor) ? 0 : skor;
    var persen = Math.round(skor / soal.length * 100);

    var soalHtml = soal.map(function(s, qi){
      var opsi = s.opsi.map(function(o, oi){
        var cls = "opt", on = (S.quizAns[qi] === oi) ? "true" : "false";
        if(S.quizChecked){
          if(oi === s.kunci) cls += " right";
          else if(S.quizAns[qi] === oi) cls += " wrong";
        }
        return '<button class="'+cls+'" data-act="jawab" data-q="'+qi+'" data-o="'+oi+'" aria-pressed="'+on+'"'+(S.quizChecked?' disabled':'')+'>' +
          '<span class="k">'+"ABCD".charAt(oi)+'</span><span>'+esc(o)+'</span></button>';
      }).join("");
      var status = "";
      if(S.quizChecked){
        var benar = S.quizAns[qi] === s.kunci;
        status = '<p class="bahas"><strong style="color:'+(benar?'var(--ok)':'var(--err)')+'">'+(benar?'✅ Benar. ':'❌ Belum tepat. ')+'</strong>'+esc(s.bahas)+'</p>';
      }
      return '<div class="qcard"><span class="lbl">Soal '+(qi+1)+' dari '+soal.length+'</span>' +
        '<h3>'+esc(s.q)+'</h3><div class="stack s">'+opsi+'</div>'+status+'</div>';
    }).join("");

    var terjawab = S.quizAns.slice(0, soal.length).filter(function(a){ return a !== null; }).length;

    var hasil = "";
    if(S.quizChecked){
      var pesan = skor === soal.length ? "Keren! Pemahamanmu sudah mantap. Coba jelaskan ulang ke temanmu supaya makin melekat."
                : skor >= Math.ceil(soal.length/2) ? "Bagus! Sebagian besar sudah kamu kuasai. Baca lagi pembahasan soal yang belum tepat, ya."
                : "Tidak apa-apa, ini justru tandanya kita perlu mengulang bareng. Baca lagi penjelasannya, lalu coba latihan sekali lagi.";
      hasil = '<div class="score">' +
        '<div><div class="num">'+skor+' dari '+soal.length+'</div><span class="lbl">Jawaban benar</span></div>' +
        '<div style="flex:1; min-width:150px"><div class="bar"><i style="width:'+persen+'%"></i></div>' +
        '<p class="muted" style="font-size:13.5px; margin-top:8px">'+persen+'% tepat</p></div>' +
        '<p style="flex:1 1 100%; font-size:15.5px">'+pesan+' 📌 Kalau ada pembahasan yang berbeda dengan bukumu, percayai bukumu dan tanyakan ke gurumu.</p>' +
      '</div>' +
      '<button class="btn sec" data-act="latihanulang">🔁 Ulangi Latihan</button>';
    }

    return '<div class="wrap stack">' +
      '<div><span class="tag t">Latihan &amp; Evaluasi</span>' +
      '<h2 style="font-size:25px; margin-top:12px">Latihan: '+esc(d.nama)+'</h2>' +
      '<p class="muted" style="margin-top:6px">'+soal.length+' soal pilihan ganda. Jawab semuanya, lalu periksa hasilnya.</p></div>' +
      (S.quizErr ? '<div class="alert err">⚠️ <span>'+esc(S.quizErr)+'</span></div>' : '') +
      soalHtml +
      (S.quizChecked ? hasil :
        '<button class="btn big" data-act="periksa">Periksa Jawaban ('+terjawab+'/'+soal.length+' terisi)</button>') +
      tombol +
    '</div>';
  }

     ========================================================= */
  function render(){
    try{
      renderNav();
      var html;
      switch(S.page){
        case "form": html = pageForm(); break;
        case "chat": html = pageChat(); break;
        case "latihan": html = pageLatihan(); break;
        case "keamanan": html = pageKeamanan(); break;
        case "tentang": html = pageTentang(); break;
        default: html = pageBeranda();
      }
      el("app").innerHTML = html;
      if(S.page === "chat" && S.sesiAktif){ renderChat(); updateControls(); }
      renderModal();
    }catch(err){
      el("app").innerHTML = '<div class="wrap"><div class="card empty"><span class="em">🛠️</span>' +
        '<h2 style="font-size:22px">Ups, ada yang tersendat</h2>' +
        '<p class="muted" style="max-width:44ch">Halaman ini gagal ditampilkan. Coba kembali ke beranda, ya.</p>' +
        '<button class="btn" data-act="kehome">Kembali ke Beranda</button></div></div>';
    }
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  document.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("[data-go],[data-act]") : null;
    if(!t) return;

    var goTo = t.getAttribute("data-go");
    if(goTo){ simpanForm(); go(goTo); return; }

    var act = t.getAttribute("data-act");
    switch(act){
      case "kehome": S.modal=null; go("beranda"); break;
      case "mulai": go("form"); break;

      case "mapel":
        simpanForm(); S.mapel = t.getAttribute("data-v"); S.formErr=""; render(); break;
      case "tingkat":
        simpanForm(); S.tingkat = t.getAttribute("data-v"); render(); break;
      case "saran":
        simpanForm(); S.topikInput = t.getAttribute("data-v"); S.mapel = t.getAttribute("data-m"); S.formErr=""; render(); break;

      case "tanya":
        simpanForm();
        if(!S.mapel){ S.formErr = "Pilih dulu satu mata pelajaran ya."; render(); return; }
        if(!S.topikInput.trim()){ S.formErr = "Tuliskan dulu topik yang belum kamu pahami."; render(); return; }
        S.formErr = "";
        S.topikKey = cariTopik(S.topikInput);
        if(S.topikKey && !S.mapel) S.mapel = TOPIK[S.topikKey].mapel;
        mulaiSesi();
        break;

      case "contoh":
        if(S.typing) return;
        pushSiswa("Buatkan contoh untuk topik ini dong.");
        pushAI(pesanContoh());
        break;

      case "latihan":
        if(S.typing) return;
        go("latihan");
        break;

      case "lapor": {
        var i = parseInt(t.getAttribute("data-i"), 10);
        if(!isNaN(i) && S.chat[i]){ S.chat[i].reported = true; renderChat(); }
        break;
      }

      case "info": S.modal = "prompt"; renderModal(); break;
      case "tutup":
        if(t.classList.contains("modal") && e.target !== t) return;
        S.modal = null; renderModal(); break;

      case "jawab": {
        if(S.quizChecked) return;
        var qi = parseInt(t.getAttribute("data-q"), 10);
        var oi = parseInt(t.getAttribute("data-o"), 10);
        if(isNaN(qi) || isNaN(oi)) return;
        S.quizAns[qi] = oi; S.quizErr = ""; render();
        break;
      }
      case "periksa": {
        var d = TOPIK[S.topikKey];
        var n = (d && d.soal) ? d.soal.length : 0;
        var isi = S.quizAns.slice(0,n).filter(function(a){ return a !== null; }).length;
        if(isi < n){ S.quizErr = "Masih ada soal yang belum dijawab. Jawab dulu semuanya ya — tidak apa-apa kalau belum yakin."; render(); return; }
        S.quizChecked = true; S.quizErr = ""; render();
        break;
      }
      case "latihanulang":
        S.quizAns = [null,null,null]; S.quizChecked = false; S.quizErr = ""; render(); break;

      case "simpanref":
        simpanRefleksi(); S.refleksiSaved = true; render(); break;

      case "riwayat": go("chat"); break;
      case "topiklain": resetSesi(); break;
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target && e.target.id === "askform"){
      e.preventDefault();
      var inp = el("ask");
      if(!inp) return;
      var v = inp.value.trim();
      if(!v || S.typing) return;
      inp.value = "";
      pushSiswa(v);
      pushAI(balasTanya(v));
    }
  });

  function simpanForm(){
    var a = el("topik"); if(a) S.topikInput = a.value;
    var b = el("panggil"); if(b) S.panggilan = b.value.trim();
    simpanRefleksi();
  }
  function simpanRefleksi(){
    var r0 = el("ref0"); if(r0) S.refleksi[0] = r0.value;
    var r1 = el("ref1"); if(r1) S.refleksi[1] = r1.value;
  }

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && S.modal){ S.modal = null; renderModal(); }
  });

  render();
})();
</script>

</body></html>
