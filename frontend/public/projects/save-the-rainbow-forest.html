<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Save the Rainbow Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#EDF5EE;
    --bg-2:#E2EFE4;
    --surface:#FFFFFF;
    --surface-2:#F5FAF5;
    --ink:#1E3328;
    --ink-2:#4C6357;
    --ink-3:#7A9184;
    --line:#D2E4D6;
    --hijau:#2E9E5B;
    --hijau-lembut:#DCF2E3;
    --biru:#2C9CD6;
    --biru-lembut:#DAEEFA;
    --kuning:#E8A50C;
    --kuning-lembut:#FCEFCF;
    --ungu:#7C5CF0;
    --ungu-lembut:#E8E2FE;
    --pink:#E0619B;
    --pink-lembut:#FBE1EE;
    --emas:#F2A81C;
    --jingga:#E07A3F;
    --shadow:0 6px 0 rgba(30,51,40,.08);
    --shadow-lift:0 10px 24px rgba(30,51,40,.12);
    --r-lg:26px;
    --r-md:18px;
    --r-sm:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#122019;
      --bg-2:#0D1913;
      --surface:#1C2F26;
      --surface-2:#24392F;
      --ink:#EAF7EE;
      --ink-2:#AECBBB;
      --ink-3:#7E9C8B;
      --line:#31503F;
      --hijau:#54D48D;
      --hijau-lembut:#1E4130;
      --biru:#63C6F2;
      --biru-lembut:#173C4E;
      --kuning:#FFC64A;
      --kuning-lembut:#453416;
      --ungu:#B7A0FF;
      --ungu-lembut:#2E2551;
      --pink:#FF9CC8;
      --pink-lembut:#48213A;
      --emas:#FFC64A;
      --jingga:#F0996A;
      --shadow:0 6px 0 rgba(0,0,0,.28);
      --shadow-lift:0 10px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#122019;
    --bg-2:#0D1913;
    --surface:#1C2F26;
    --surface-2:#24392F;
    --ink:#EAF7EE;
    --ink-2:#AECBBB;
    --ink-3:#7E9C8B;
    --line:#31503F;
    --hijau:#54D48D;
    --hijau-lembut:#1E4130;
    --biru:#63C6F2;
    --biru-lembut:#173C4E;
    --kuning:#FFC64A;
    --kuning-lembut:#453416;
    --ungu:#B7A0FF;
    --ungu-lembut:#2E2551;
    --pink:#FF9CC8;
    --pink-lembut:#48213A;
    --emas:#FFC64A;
    --jingga:#F0996A;
    --shadow:0 6px 0 rgba(0,0,0,.28);
    --shadow-lift:0 10px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Nunito","Segoe UI",system-ui,sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,h4,.font-display{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
  h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.1;margin:0}
  h2{font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;margin:0}
  h3{font-size:1.18rem;margin:0}
  p{margin:0}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--ungu);outline-offset:3px;border-radius:8px}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(8px);
    border-bottom:2px solid var(--line);
  }
  .topbar-in{
    max-width:1000px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:9px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.02rem;color:var(--ink);white-space:nowrap}
  .brand .dots{display:flex;gap:3px}
  .brand .dots i{width:9px;height:9px;border-radius:50%;display:block}
  .navwrap{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  nav.menu{display:flex;gap:4px;background:var(--surface-2);border:2px solid var(--line);border-radius:999px;padding:4px}
  nav.menu button{
    border:0;background:transparent;color:var(--ink-2);
    font-family:"Fredoka",sans-serif;font-weight:500;font-size:.93rem;
    padding:7px 13px;border-radius:999px;line-height:1.1;
  }
  nav.menu button:hover{background:var(--bg-2);color:var(--ink)}
  nav.menu button[aria-current="page"]{background:var(--hijau);color:#fff}
  :root[data-theme="dark"] nav.menu button[aria-current="page"],
  :root:not([data-theme="light"]) nav.menu button[aria-current="page"]{color:#0D1913}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]) nav.menu button[aria-current="page"]{color:#fff}}

  .starbar{
    display:flex;align-items:center;gap:7px;
    background:var(--kuning-lembut);border:2px solid var(--kuning);
    border-radius:999px;padding:5px 13px 5px 10px;
    font-family:"Fredoka",sans-serif;font-weight:600;color:var(--ink);white-space:nowrap;
  }
  .starbar .slots{display:flex;gap:2px}
  .starbar .slots span{font-size:1rem;line-height:1;filter:grayscale(1);opacity:.35}
  .starbar .slots span.on{filter:none;opacity:1;animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(.4) rotate(-25deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}

  /* ---------- Layout ---------- */
  main{max-width:1000px;margin:0 auto;padding:22px 16px 70px}
  .card{
    background:var(--surface);border:2px solid var(--line);
    border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);
  }
  .stack{display:flex;flex-direction:column;gap:18px}
  .lead{color:var(--ink-2);font-size:1.05rem}
  .eyebrow{
    font-family:"Fredoka",sans-serif;font-weight:500;font-size:.78rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    font-family:"Fredoka",sans-serif;font-weight:600;
    border-radius:999px;border:2px solid transparent;
    padding:14px 24px;min-height:52px;text-align:center;line-height:1.15;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(2px)}
  .btn-primary{background:var(--hijau);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.16)}
  :root[data-theme="dark"] .btn-primary{color:#0D1913}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#0D1913}}
  .btn-big{font-size:1.2rem;padding:18px 34px;min-height:62px}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
  .btn-ghost:hover{border-color:var(--hijau)}
  .btn-ungu{background:var(--ungu);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.16)}
  :root[data-theme="dark"] .btn-ungu{color:#160F32}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-ungu{color:#160F32}}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px}
  .btn-link{background:none;border:0;color:var(--ink-3);text-decoration:underline;padding:8px 2px;font-family:"Nunito",sans-serif;font-weight:600;font-size:.95rem}
  .btn-link:hover{color:var(--ink)}

  /* ---------- Beranda ---------- */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(170deg,var(--surface) 0%,var(--surface-2) 100%);
    border:2px solid var(--line);border-radius:var(--r-lg);
    padding:26px;box-shadow:var(--shadow-lift);
  }
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:center}
  @media (max-width:760px){.hero-grid{grid-template-columns:1fr;gap:20px}}
  .tag{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--ungu-lembut);color:var(--ungu);
    border-radius:999px;padding:6px 14px;
    font-family:"Fredoka",sans-serif;font-weight:600;font-size:.83rem;letter-spacing:.02em;
  }
  .rainbow-rule{height:7px;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--jingga),var(--kuning),var(--hijau),var(--biru),var(--ungu));}
  .cast{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .cast-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--surface-2);border:2px solid var(--line);border-radius:999px;
    padding:5px 13px 5px 6px;font-weight:700;font-size:.9rem;color:var(--ink-2);
  }
  .cast-chip svg{width:30px;height:30px;flex:none}
  .maker-note{
    display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:.9rem;font-weight:600;
  }

  /* ---------- Peta ---------- */
  .peta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:760px){.peta{grid-template-columns:repeat(2,1fr)}}
  .lokasi{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
    background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);
    padding:14px 10px;text-align:center;
    filter:grayscale(.9);opacity:.72;transition:filter .6s ease,opacity .6s ease,transform .2s ease,border-color .3s ease;
  }
  .lokasi.hidup{filter:none;opacity:1;border-color:var(--hijau);background:var(--hijau-lembut)}
  .lokasi.aktif{filter:none;opacity:1;border-color:var(--ungu);border-style:dashed;background:var(--ungu-lembut)}
  .lokasi svg{width:100%;height:auto;max-width:110px}
  .lokasi .nama{font-family:"Fredoka",sans-serif;font-weight:600;font-size:.95rem;line-height:1.15}
  .lokasi .status{font-size:.76rem;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
  .lokasi .no{
    position:absolute;top:-11px;left:-11px;width:30px;height:30px;border-radius:50%;
    background:var(--surface);border:2px solid var(--line);
    display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:600;font-size:.85rem;
  }
  .lokasi.hidup .no{background:var(--hijau);color:#fff;border-color:var(--hijau)}
  :root[data-theme="dark"] .lokasi.hidup .no{color:#0D1913}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lokasi.hidup .no{color:#0D1913}}

  /* ---------- Misi ---------- */
  .misi-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .misi-head .karakter{width:64px;height:64px;flex:none}
  .progress{height:14px;background:var(--bg-2);border:2px solid var(--line);border-radius:99px;overflow:hidden}
  .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--hijau),var(--biru),var(--ungu));transition:width .5s ease}
  .benda{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--surface-2);border:2px dashed var(--line);border-radius:var(--r-md);
    padding:20px;text-align:center;
  }
  .benda .emoji{font-size:3.4rem;line-height:1;animation:goyang 3s ease-in-out infinite}
  @keyframes goyang{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .pilihan{display:grid;gap:12px}
  .pilihan.tiga{grid-template-columns:repeat(3,1fr)}
  @media (max-width:700px){.pilihan.tiga{grid-template-columns:1fr}}
  .opsi{
    display:flex;align-items:center;gap:12px;text-align:left;width:100%;
    background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
    padding:16px;min-height:64px;color:var(--ink);font-weight:700;line-height:1.35;
    box-shadow:var(--shadow);transition:transform .12s ease,border-color .15s ease,background .15s ease;
  }
  .opsi:hover:not(:disabled){border-color:var(--ungu);background:var(--surface-2)}
  .opsi:active:not(:disabled){transform:translateY(2px)}
  .opsi:disabled{opacity:.5;cursor:not-allowed}
  .opsi .ikon{font-size:1.9rem;line-height:1;flex:none}
  .opsi.kategori{flex-direction:column;text-align:center;justify-content:center;gap:8px;min-height:112px}
  .opsi.kategori .ikon{font-size:2.3rem}
  .opsi.benar{border-color:var(--hijau);background:var(--hijau-lembut)}
  .opsi.kurang{border-color:var(--kuning);background:var(--kuning-lembut)}

  .umpan{
    border-radius:var(--r-md);padding:18px;border:2px solid var(--line);background:var(--surface-2);
    display:flex;flex-direction:column;gap:10px;animation:masuk .35s ease;
  }
  @keyframes masuk{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .umpan.baik{border-color:var(--hijau);background:var(--hijau-lembut)}
  .umpan.belajar{border-color:var(--kuning);background:var(--kuning-lembut)}
  .umpan h3{display:flex;align-items:center;gap:9px}
  .catatan{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--biru-lembut);border:2px solid var(--biru);border-radius:var(--r-md);
    padding:14px;font-size:.94rem;color:var(--ink);
  }
  .catatan b{color:var(--ink)}

  /* ---------- Bintang & koleksi ---------- */
  .bintang-besar{font-size:2.6rem;line-height:1;letter-spacing:4px}
  .bintang-besar span{display:inline-block;filter:grayscale(1);opacity:.3}
  .bintang-besar span.on{filter:none;opacity:1;animation:kelip 2.4s ease-in-out infinite}
  .bintang-besar span.on:nth-child(2){animation-delay:.3s}
  .bintang-besar span.on:nth-child(3){animation-delay:.6s}
  .bintang-besar span.on:nth-child(4){animation-delay:.9s}
  @keyframes kelip{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .koleksi-list{display:grid;gap:14px}
  .koleksi-item{
    display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;
    background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);padding:14px;
  }
  @media (max-width:520px){.koleksi-item{grid-template-columns:56px 1fr;gap:10px}}
  .koleksi-item svg{width:100%;height:auto;filter:grayscale(.9);opacity:.7}
  .koleksi-item.selesai{border-color:var(--hijau)}
  .koleksi-item.selesai svg{filter:none;opacity:1}
  .chip{
    display:inline-block;border-radius:999px;padding:3px 11px;
    font-size:.78rem;font-weight:800;letter-spacing:.02em;
    background:var(--bg-2);color:var(--ink-2);border:2px solid var(--line);
  }
  .chip.selesai{background:var(--hijau-lembut);color:var(--hijau);border-color:var(--hijau)}
  .chip.proses{background:var(--ungu-lembut);color:var(--ungu);border-color:var(--ungu)}
  .fakta{font-size:.94rem;color:var(--ink-2)}

  /* ---------- Ending ---------- */
  .ending-hero{
    text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;
    background:linear-gradient(175deg,var(--surface),var(--surface-2));
  }
  .pesan-moral{
    font-family:"Fredoka",sans-serif;font-weight:500;font-size:1.15rem;line-height:1.4;
    background:var(--ungu-lembut);color:var(--ink);border:2px solid var(--ungu);
    border-radius:var(--r-md);padding:16px 20px;max-width:34rem;
  }

  /* ---------- Sertifikat ---------- */
  .sertifikat{
    background:var(--surface);
    border:4px double var(--emas);
    border-radius:var(--r-lg);
    padding:30px 24px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    position:relative;overflow:hidden;
  }
  .sertifikat::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 12% 10%,color-mix(in srgb,var(--kuning) 18%,transparent),transparent 42%),
               radial-gradient(circle at 88% 88%,color-mix(in srgb,var(--ungu) 16%,transparent),transparent 42%);
  }
  .sertifikat > *{position:relative}
  .sertifikat .judul{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.5rem,5vw,2.2rem);color:var(--ink)}
  .sertifikat .isi{max-width:36rem;color:var(--ink-2);font-size:1.02rem}
  .sertifikat .meta{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;font-size:.9rem;color:var(--ink-3);font-weight:700}
  .penerima{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);color:var(--hijau)}

  /* ---------- Tentang ---------- */
  .dua-kolom{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:760px){.dua-kolom{grid-template-columns:1fr}}
  .info-blok{background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);padding:18px}
  .info-blok h3{margin-bottom:8px}
  ul.rapi{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
  .prompt-box{
    background:var(--bg-2);border-left:5px solid var(--ungu);border-radius:var(--r-sm);
    padding:13px 15px;font-style:italic;color:var(--ink-2);
  }
  .dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.97rem}
  .dl dt{font-weight:800;color:var(--ink-3)}
  .dl dd{margin:0;color:var(--ink-2)}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }

  /* ---------- Cetak ---------- */
  @media print{
    body{background:#fff;color:#111}
    .topbar,.no-print{display:none!important}
    main{padding:0;max-width:none}
    .sertifikat{border:4px double #C58A0B;box-shadow:none;page-break-inside:avoid}
    .sertifikat .judul,.sertifikat .isi,.sertifikat .meta,.penerima{color:#111!important}
    .penerima{color:#1B7A45!important}
  }
</style>

<header class="topbar no-print">
  <div class="topbar-in">
    <div class="brand">
      <span class="dots" aria-hidden="true">
        <i style="background:var(--pink)"></i><i style="background:var(--kuning)"></i><i style="background:var(--hijau)"></i><i style="background:var(--biru)"></i>
      </span>
      Hutan Pelangi
    </div>
    <div class="navwrap">
      <div class="starbar" title="Bintang Penjaga Hutan">
        <span aria-hidden="true">⭐</span>
        <span id="star-teks">0/4</span>
        <span class="slots" id="star-slots" aria-hidden="true"></span>
      </div>
      <nav class="menu" id="menu" aria-label="Menu utama">
        <button data-act="nav" data-val="beranda">Beranda</button>
        <button data-act="nav" data-val="main">Bermain</button>
        <button data-act="nav" data-val="koleksi">Koleksi Bintang</button>
        <button data-act="nav" data-val="tentang">Tentang Proyek</button>
      </nav>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
(function(){
  "use strict";

  /* =========================================================
     ILUSTRASI ORISINAL (SVG sederhana, dibuat sendiri)
     ========================================================= */

      '<ellipse cx="74" cy="56" rx="18" ry="26" fill="#7FD8F5" opacity=".55" transform="rotate(18 74 56)"/>'+
      '<path d="M50 58 L34 104 h32 Z" fill="#54C98D"/>'+
      '<path d="M50 58 L42 104 h16 Z" fill="#8CE0B4" opacity=".8"/>'+
      '<circle cx="50" cy="38" r="21" fill="#FFE0BC"/>'+
      '<path d="M29 34 a21 21 0 0 1 42 0 q-21 -12 -42 0 Z" fill="#F2A81C"/>'+
      '<circle cx="43" cy="39" r="2.8" fill="#2B3A31"/>'+
      '<circle cx="57" cy="39" r="2.8" fill="#2B3A31"/>'+
      '<path d="M44 47 q6 6 12 0" stroke="#2B3A31" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
      '<circle cx="36" cy="45" r="3.4" fill="#F79BC0" opacity=".7"/>'+

  var SIMPAN = 'hutanpelangi_v1';
  var state;

  function stateBaru(){
    return {
      halaman:'beranda',
      adegan:'pembuka',
      misiAktif:0,
      tahap:'main',          /* 'main' | 'selesai' */
      indeksBenda:0,
      umpan:null,            /* {jenis:'baik'|'belajar', judul, teks} */
      pilihanTerpilih:null,
      endingDilihat:null,
      misi:[0,1,2,3].map(function(){ return {status:'belum', sempurna:true, salah:0}; })
    };
  }

  function muat(){
    state = stateBaru();
    try{
      var mentah = localStorage.getItem(SIMPAN);
      if(mentah){
        var d = JSON.parse(mentah);
        if(d && Array.isArray(d.misi) && d.misi.length === 4){
          for(var i=0;i<4;i++){
            var m = d.misi[i] || {};
            state.misi[i] = {
              status: (m.status==='selesai'||m.status==='proses') ? m.status : 'belum',
              sempurna: m.sempurna !== false,
              salah: typeof m.salah === 'number' ? m.salah : 0
            };
          }
        }
      }
    }catch(e){ /* penyimpanan tidak tersedia, permainan tetap jalan */ }
  }

  function simpan(){
    try{ localStorage.setItem(SIMPAN, JSON.stringify({misi:state.misi})); }catch(e){}
  }

  function jumlahBintang(){
    var n = 0;
    for(var i=0;i<4;i++){ if(state.misi[i].status === 'selesai') n++; }
    return n;
  }
  function semuaSelesai(){ return jumlahBintang() === 4; }
  function adaSalah(){
    for(var i=0;i<4;i++){ if(state.misi[i].salah > 0) return true; }
    return false;
  }
  function misiBerikutBelumSelesai(){
    for(var i=0;i<4;i++){ if(state.misi[i].status !== 'selesai') return i; }
    return -1;
  }

  /* =========================================================
     UTIL
     ========================================================= */
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function tanggalHariIni(){
    try{
      return new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    }catch(e){ return new Date().toDateString(); }
  }
  function statusLabel(s){
    if(s==='selesai') return 'Selesai';
    if(s==='proses') return 'Sedang dikerjakan';
    return 'Belum dimulai';
  }

  /* =========================================================
     KOMPONEN
     ========================================================= */
  function petaHTML(){
    var h = '<div class="peta">';
    for(var i=0;i<MISI.length;i++){
      var m = MISI[i], st = state.misi[i];
      var kelas = st.status === 'selesai' ? 'lokasi hidup'
                : (state.halaman==='main' && state.adegan==='misi' && state.misiAktif===i) ? 'lokasi aktif'
                : (st.status === 'proses' ? 'lokasi aktif' : 'lokasi');
      h += '<div class="'+kelas+'">'+
             '<span class="no">'+(i+1)+'</span>'+
             m.gambar+
             '<span class="nama">'+esc(m.nama)+'</span>'+
             '<span class="status">'+(st.status==='selesai' ? '⭐ Berwarna lagi' : statusLabel(st.status))+'</span>'+
           '</div>';
    }
    return h + '</div>';
  }

  function bintangBesarHTML(){
    var n = jumlahBintang(), h = '<div class="bintang-besar" aria-hidden="true">';
    for(var i=0;i<4;i++){ h += '<span class="'+(i<n?'on':'')+'">⭐</span>'; }
    return h+'</div><p class="sr-only">'+n+' dari 4 Bintang Penjaga Hutan.</p>';
  }

  function perbaruiBintangBar(){
    var n = jumlahBintang();
    var teks = document.getElementById('star-teks');
    var slots = document.getElementById('star-slots');
    if(teks) teks.textContent = n + '/4';
    if(slots){
      var h = '';
      for(var i=0;i<4;i++){ h += '<span class="'+(i<n?'on':'')+'">⭐</span>'; }
      slots.innerHTML = h;
    }
    var tombol = document.querySelectorAll('#menu button');
    for(var j=0;j<tombol.length;j++){
      if(tombol[j].getAttribute('data-val') === state.halaman){ tombol[j].setAttribute('aria-current','page'); }
      else { tombol[j].removeAttribute('aria-current'); }
    }
  }

          '<li>Menguji dan memperbaiki permainan</li>'+
          '<li>Mengenal kebiasaan menjaga lingkungan</li>'+
        '</ul>'+
      '</section>'+

      '<section class="card">'+
        '<h3>🔒 Catatan keamanan dan keterbatasan</h3>'+
        '<ul class="rapi" style="margin-top:10px">'+
          '<li><b>Tidak ada AI yang berjalan saat permainan dimainkan.</b> Semua cerita, pilihan, dan feedback sudah ditulis lebih dulu. Claude AI hanya membantu pada proses pembuatan.</li>'+
          '<li>Tidak ada API key di aplikasi ini dan tidak ada data yang dikirim ke mana pun.</li>'+
          '<li>Permainan tidak meminta nama lengkap, alamat, nama sekolah, atau foto. Identitas yang dipakai adalah "Siswa Future Makers".</li>'+
          '<li>Kemajuan permainan disimpan di peramban perangkat ini saja, dan bisa dihapus dengan tombol "Main Lagi dari Awal".</li>'+
          '<li>Aturan pemilahan sampah berbeda di setiap daerah. Tidak semua plastik dapat didaur ulang di semua tempat, jadi ikuti aturan di daerahmu.</li>'+
          '<li>Anak tidak boleh menyentuh pecahan kaca, baterai, jarum, atau bahan kimia. Kegiatan bersih-bersih perlu ditemani orang dewasa.</li>'+
          '<li>Semua tempat dan tokoh dalam permainan ini adalah cerita rekaan, bukan lokasi nyata.</li>'+
        '</ul>'+
      '</section>'+

      '<section class="card">'+
        '<h3>🚀 Rencana pengembangan berikutnya</h3>'+
        '<ul class="rapi" style="margin-top:10px">'+
          '<li>Menambah misi kelima tentang menanam pohon dan merawat tanaman</li>'+
          '<li>Menambahkan suara narasi agar anak yang belum lancar membaca tetap bisa bermain</li>'+
          '<li>Menambah mode dua bahasa (Indonesia dan Inggris)</li>'+
          '<li>Membuat versi cetak lembar kegiatan untuk dikerjakan di rumah</li>'+
          '<li>Menguji permainan bersama lebih banyak teman untuk mencari bagian yang masih membingungkan</li>'+
        '</ul>'+
      '</section>'+

      '<section class="card">'+
        '<h3>🤝 Catatan penggunaan AI</h3>'+
        '<p class="lead" style="margin-top:8px">"Claude AI membantu memberikan ide dan mengembangkan permainan, tetapi siswa tetap menentukan karakter, misi, pilihan, pesan moral, dan hasil akhirnya. Informasi dari AI harus diperiksa sebelum digunakan."</p>'+
        '<div class="btn-row" style="margin-top:18px">'+
          '<button class="btn btn-primary" data-act="mulai">🌈 Coba Mainkan</button>'+
          '<button class="btn btn-ghost" data-act="nav" data-val="beranda">🏠 Kembali ke Beranda</button>'+
        '</div>'+
      '</section>'+
    '</div>';
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function render(){
    var app = document.getElementById('app');
    if(!app) return;
    var html;
    try{
      if(state.halaman === 'beranda')      html = viewBeranda();
      else if(state.halaman === 'cara')    html = viewCara();
      else if(state.halaman === 'main')    html = viewMain();
      else if(state.halaman === 'koleksi') html = viewKoleksi();
      else if(state.halaman === 'tentang') html = viewTentang();
      else { state.halaman = 'beranda'; html = viewBeranda(); }
    }catch(err){
      html = viewMisiHilang();
    }
    app.innerHTML = html;
    perbaruiBintangBar();
    window.scrollTo({top:0,behavior:'auto'});
  }

  /* =========================================================
     AKSI
     ========================================================= */
  function bukaMisi(i){
    if(i < 0 || i >= MISI.length) i = 0;
    state.misiAktif = i;
    state.adegan = 'misi';
    state.halaman = 'main';
    state.tahap = 'main';
    state.indeksBenda = 0;
    state.umpan = null;
    if(state.misi[i].status === 'belum') state.misi[i].status = 'proses';
    simpan();
  }

  function selesaikanMisi(i){
    state.misi[i].status = 'selesai';
    state.tahap = 'selesai';
    state.umpan = null;
    simpan();
  }

  var AKSI = {
    nav: function(val){
      if(val === 'main'){
        state.halaman = 'main';
        if(state.adegan !== 'misi' && state.adegan !== 'ending' && state.adegan !== 'sertifikat'){
          state.adegan = 'pembuka';
        }
        if(state.adegan === 'misi'){
          var i = state.misiAktif;
          if(typeof i !== 'number' || i < 0 || i >= MISI.length){ state.adegan = 'pembuka'; }
        }
      } else {
        state.halaman = val;
      }
    },
    mulai: function(){
      state.halaman = 'main';
      state.adegan = 'pembuka';
      state.umpan = null;
      state.tahap = 'main';
    },
    'mulai-misi': function(){
      var i = misiBerikutBelumSelesai();
      if(i < 0){ state.adegan = 'ending'; state.halaman='main'; return; }
      bukaMisi(i);
    },
    pilah: function(val){
      var m = MISI[state.misiAktif];
      if(!m || m.tipe !== 'pilah') return;
      var b = m.benda[state.indeksBenda];
      if(!b) return;
      if(val === b.jawab){
        state.umpan = {jenis:'baik', judul:'👏 Bagus sekali!', teks:b.benar};
      } else {
        state.misi[state.misiAktif].salah++;
        state.misi[state.misiAktif].sempurna = false;
        state.umpan = {jenis:'belajar', judul:'😊 Hampir, ayo kita lihat lagi', teks:b.salah};
        simpan();
      }
    },
    'benda-lanjut': function(){
      var m = MISI[state.misiAktif];
      if(!m) return;
      state.umpan = null;
      if(state.indeksBenda + 1 < m.benda.length){
        state.indeksBenda++;
      } else {
        selesaikanMisi(state.misiAktif);
      }
    },
    pilih: function(val){
      var m = MISI[state.misiAktif];
      if(!m || !m.opsi) return;
      var o = m.opsi[parseInt(val,10)];
      if(!o) return;
      if(o.benar){
        state.umpan = {jenis:'baik', judul:'🌟 Pilihan yang tepat!', teks:o.umpan};
      } else {
        state.misi[state.misiAktif].salah++;
        state.misi[state.misiAktif].sempurna = false;
        state.umpan = {jenis:'belajar', judul:'😊 Terima kasih sudah mencoba', teks:o.umpan};
        simpan();
      }
    },
    'terima-bintang': function(){ selesaikanMisi(state.misiAktif); },
    'coba-lagi': function(){ state.umpan = null; },
    lanjut: function(){
      var i = misiBerikutBelumSelesai();
      if(i < 0){ state.adegan = 'ending'; return; }
      bukaMisi(i);
    },
    peta: function(){ state.adegan = 'pembuka'; state.tahap='main'; state.umpan=null; },
    'lihat-hasil': function(){ state.halaman='main'; state.adegan = 'ending'; state.tahap='main'; state.umpan=null; },
    'lanjutkan-misi': function(){
      var i = misiBerikutBelumSelesai();
      if(i < 0){ state.halaman='main'; state.adegan='ending'; return; }
      bukaMisi(i);
    },
    sertifikat: function(){ state.halaman='main'; state.adegan = 'sertifikat'; },
    cetak: function(){ try{ window.print(); }catch(e){} },
    'main-lagi': function(){
      state = stateBaru();
      state.halaman = 'main';
      state.adegan = 'pembuka';
      try{ localStorage.removeItem(SIMPAN); }catch(e){}
    },
    'mulai-ulang-lembut': function(){
      state = stateBaru();
      try{ localStorage.removeItem(SIMPAN); }catch(e){}
    }
  };

  document.addEventListener('click', function(ev){
    var t = ev.target;
    while(t && t !== document && !(t.getAttribute && t.getAttribute('data-act'))){ t = t.parentNode; }
    if(!t || t === document) return;
    var act = t.getAttribute('data-act');
    var val = t.getAttribute('data-val');
    var fn = AKSI[act];
    if(!fn) return;
    try{ fn(val); }catch(e){ /* jaga-jaga: jangan sampai layar kosong */ }
    if(act !== 'cetak') render();
  });

  muat();
  render();
})();
</script>

</body></html>
