<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Eco Detective Mission</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --kertas:#EAEEE2;
    --kartu:#FAFAF3;
    --kartu2:#F1F3E7;
    --garis:#C7CEBA;
    --garis-tebal:#A9B49B;
    --tinta:#182219;
    --tinta2:#4C5C4E;
    --hutan:#14532D;
    --lumut:#2E7D4F;
    --kunyit:#C9770F;
    --kunyit-lembut:#F7E6C8;
    --stempel:#A93C29;
    --stempel-lembut:#F4DED7;
    --atas:#F7FAF3;
    --bayang:0 2px 0 rgba(24,34,25,.06), 0 10px 24px -14px rgba(24,34,25,.35);
    --r:14px;
    --maks-lebar:920px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --kertas:#0A120E;
      --kartu:#14201A;
      --kartu2:#1B2A22;
      --garis:#2C4034;
      --garis-tebal:#3C5647;
      --tinta:#E9EFE6;
      --tinta2:#A0B5A5;
      --hutan:#7FCB99;
      --lumut:#58AC77;
      --kunyit:#F0A93F;
      --kunyit-lembut:#38290F;
      --stempel:#EE8A72;
      --stempel-lembut:#3A1E17;
      --atas:#08120C;
      --bayang:0 2px 0 rgba(0,0,0,.25), 0 12px 28px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --kertas:#0A120E;
    --kartu:#14201A;
    --kartu2:#1B2A22;
    --garis:#2C4034;
    --garis-tebal:#3C5647;
    --tinta:#E9EFE6;
    --tinta2:#A0B5A5;
    --hutan:#7FCB99;
    --lumut:#58AC77;
    --kunyit:#F0A93F;
    --kunyit-lembut:#38290F;
    --stempel:#EE8A72;
    --stempel-lembut:#3A1E17;
    --atas:#08120C;
    --bayang:0 2px 0 rgba(0,0,0,.25), 0 12px 28px -16px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--kertas);
    background-image:radial-gradient(rgba(46,125,79,.10) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--tinta);
    font-family:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,h4{
    font-family:"Bricolage Grotesque","Nunito Sans",system-ui,sans-serif;
    font-weight:800;
    line-height:1.1;
    margin:0;
    text-wrap:balance;
  }
  p{margin:0}
  a{color:var(--lumut)}
  .mono{font-family:"Space Mono","SFMono-Regular",ui-monospace,monospace;font-variant-numeric:tabular-nums}

  /* ---------- kerangka ---------- */
  .bungkus{max-width:var(--maks-lebar);margin:0 auto;padding:0 18px}
  .layar{display:flex;flex-direction:column;gap:20px;padding:22px 0 70px}

  /* ---------- kepala ---------- */
  .kepala{
    position:sticky;top:0;z-index:30;
    background:color-mix(in srgb, var(--kertas) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:2px solid var(--garis);
  }
  .kepala-isi{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;max-width:var(--maks-lebar);margin:0 auto}
  .merek{display:flex;align-items:center;gap:10px;margin-right:auto}
  .merek b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;letter-spacing:-.01em;display:block;line-height:1.1}
  .merek span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2)}
  .nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    font:inherit;font-size:.88rem;font-weight:700;white-space:nowrap;
    background:transparent;color:var(--tinta2);
    border:2px solid transparent;border-radius:999px;
    padding:8px 12px;min-height:42px;cursor:pointer;
  }
  .nav button:hover{color:var(--tinta);background:var(--kartu2)}
  .nav button[aria-current="page"]{background:var(--hutan);color:var(--atas);border-color:var(--hutan)}
  .suara{
    font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;
    background:var(--kartu);color:var(--tinta2);
    border:2px solid var(--garis);border-radius:999px;padding:6px 12px;min-height:40px;
    display:flex;align-items:center;gap:6px;
  }
  .suara:hover{border-color:var(--garis-tebal);color:var(--tinta)}

  /* ---------- lencana logo ---------- */
  .logo{width:40px;height:40px;flex:0 0 auto}

  /* ---------- kartu umum ---------- */
  .panel{
    background:var(--kartu);border:2px solid var(--garis);border-radius:var(--r);
    box-shadow:var(--bayang);padding:22px;
  }
  .panel.rapat{padding:16px}
  .label{
    font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--tinta2);
  }
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
    border:2px solid var(--garis);border-radius:999px;padding:4px 10px;background:var(--kartu2);color:var(--tinta2);
  }
  .chip.hijau{background:color-mix(in srgb, var(--lumut) 16%, transparent);border-color:var(--lumut);color:var(--hutan)}
  .chip.kuning{background:var(--kunyit-lembut);border-color:var(--kunyit);color:var(--kunyit)}
  .chip.merah{background:var(--stempel-lembut);border-color:var(--stempel);color:var(--stempel)}

  /* ---------- tombol ---------- */
  .tbl{
    font:inherit;font-weight:700;cursor:pointer;text-align:center;
    border-radius:12px;border:2px solid var(--hutan);
    background:var(--hutan);color:var(--atas);
    padding:14px 22px;min-height:54px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 3px 0 color-mix(in srgb, var(--hutan) 70%, #000);
  }
  .tbl:hover{transform:translateY(-2px)}
  .tbl:active{transform:translateY(1px);box-shadow:0 1px 0 color-mix(in srgb, var(--hutan) 70%, #000)}
  .tbl.besar{font-size:1.12rem;padding:18px 30px;min-height:64px}
  .tbl.kedua{background:var(--kartu);color:var(--tinta);border-color:var(--garis-tebal);box-shadow:0 3px 0 var(--garis)}
  .tbl.kuning{background:var(--kunyit);border-color:var(--kunyit);color:var(--atas);box-shadow:0 3px 0 color-mix(in srgb, var(--kunyit) 70%, #000)}
  .tbl:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .baris-tbl{display:flex;flex-wrap:wrap;gap:12px}
  :focus-visible{outline:3px solid var(--kunyit);outline-offset:3px}

  /* ---------- beranda ---------- */
  .hero{
    display:grid;grid-template-columns:1.25fr .9fr;gap:26px;align-items:center;
    background:var(--kartu);border:2px solid var(--garis);border-radius:var(--r);
    box-shadow:var(--bayang);padding:28px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(115deg, transparent 0 26px, color-mix(in srgb, var(--lumut) 5%, transparent) 26px 28px);
  }
  .hero > *{position:relative}
  .hero h1{font-size:clamp(2.1rem,6.4vw,3.5rem);letter-spacing:-.02em}
  .hero h1 em{font-style:normal;color:var(--lumut);display:block}
  .hero p.utama{margin-top:14px;font-size:1.05rem;color:var(--tinta2);max-width:44ch}
  .stempel{
    position:absolute;top:16px;right:18px;transform:rotate(7deg);
    font-family:"Space Mono",monospace;font-size:.66rem;letter-spacing:.14em;
    border:2px dashed var(--stempel);color:var(--stempel);border-radius:8px;padding:5px 9px;
  }
  .alat{display:grid;place-items:center}
  .fakta-baris{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .fakta{background:var(--kartu2);border:2px solid var(--garis);border-radius:12px;padding:14px}
  .fakta b{font-family:"Space Mono",monospace;font-size:1.5rem;display:block;color:var(--hutan);line-height:1.1}
  .fakta span{font-size:.86rem;color:var(--tinta2)}

  /* ---------- meter ---------- */
  .strip{
    position:sticky;top:calc(var(--th, 64px) + 8px);z-index:20;
    background:var(--kartu);border:2px solid var(--garis-tebal);border-radius:var(--r);
    padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--bayang);
  }
  .strip-atas{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .strip-atas strong{font-family:"Space Mono",monospace;font-size:.95rem}
  .meter{
    height:16px;border-radius:999px;background:var(--kartu2);
    border:2px solid var(--garis);overflow:hidden;
  }
  .meter i{
    display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg, var(--lumut), var(--kunyit));
    transition:width .5s cubic-bezier(.2,.7,.3,1);
  }
  .titik-kasus{display:flex;gap:5px;flex-wrap:wrap}
  .titik{
    width:22px;height:22px;border-radius:7px;border:2px solid var(--garis);
    background:var(--kartu2);font-family:"Space Mono",monospace;font-size:.62rem;
    display:grid;place-items:center;color:var(--tinta2);
  }
  .titik.selesai{background:var(--lumut);border-color:var(--lumut);color:var(--atas)}
  .titik.kini{border-color:var(--kunyit);background:var(--kunyit-lembut);color:var(--kunyit);font-weight:700}

  /* ---------- kartu kasus ---------- */
  .berkas{position:relative;margin-top:26px}
  .tab{
    position:absolute;top:-24px;left:14px;
    background:var(--kunyit);color:var(--atas);
    font-family:"Space Mono",monospace;font-size:.74rem;letter-spacing:.12em;font-weight:700;
    padding:5px 14px;border-radius:10px 10px 0 0;border:2px solid var(--kunyit);border-bottom:none;
  }
  .kasus-kepala{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .ikon-kasus{
    width:58px;height:58px;flex:0 0 auto;border-radius:14px;
    background:var(--kartu2);border:2px solid var(--garis);
    display:grid;place-items:center;font-size:1.7rem;
  }
  .kasus-kepala h2{font-size:1.5rem}
  .situasi{
    margin-top:16px;padding:16px 18px;border-radius:12px;
    background:var(--kartu2);
    background-image:repeating-linear-gradient(to bottom, transparent 0 30px, var(--garis) 30px 31px);
    border:2px solid var(--garis);border-left:6px solid var(--lumut);
    font-size:1.05rem;
  }
  .pilihan-list{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .pilihan{
    display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
    font:inherit;color:var(--tinta);cursor:pointer;
    background:var(--kartu);border:2px solid var(--garis);border-radius:12px;
    padding:14px 16px;min-height:60px;
    transition:border-color .15s ease, transform .12s ease, background .15s ease;
  }
  .pilihan:hover:not(:disabled){border-color:var(--lumut);transform:translateX(3px);background:color-mix(in srgb, var(--lumut) 7%, var(--kartu))}
  .pilihan:disabled{cursor:default}
  .pilihan .kode{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    border:2px solid var(--garis-tebal);background:var(--kartu2);
    font-family:"Space Mono",monospace;font-weight:700;
    display:grid;place-items:center;
  }
  .pilihan.dipilih{border-color:var(--kunyit);background:var(--kunyit-lembut)}
  .pilihan.dipilih .kode{background:var(--kunyit);border-color:var(--kunyit);color:var(--atas)}
  .pilihan.pudar{opacity:.62}

  .balik{
    margin-top:18px;padding:18px;border-radius:12px;border:2px solid var(--lumut);
    background:color-mix(in srgb, var(--lumut) 10%, var(--kartu));
    display:flex;flex-direction:column;gap:10px;
    animation:masuk .35s ease both;
  }
  .balik.belum{border-color:var(--kunyit);background:var(--kunyit-lembut)}
  .balik-kepala{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .poin-dapat{
    font-family:"Space Mono",monospace;font-weight:700;font-size:1rem;
    background:var(--kartu);border:2px solid var(--garis-tebal);border-radius:999px;padding:5px 13px;white-space:nowrap;
  }
  @keyframes masuk{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ---------- hasil ---------- */
  .skor-kotak{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .skor-besar{font-family:"Space Mono",monospace;font-size:3rem;line-height:1;color:var(--hutan)}
  .tingkat{
    text-align:center;padding:26px 20px;border-radius:var(--r);
    border:2px solid var(--hutan);background:color-mix(in srgb, var(--lumut) 12%, var(--kartu));
  }
  .tingkat .nama{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.6rem,5vw,2.4rem);color:var(--hutan)}
  .saran{display:flex;flex-direction:column;gap:10px;counter-reset:s}
  .saran li{
    list-style:none;display:flex;gap:12px;align-items:flex-start;
    background:var(--kartu2);border:2px solid var(--garis);border-radius:12px;padding:12px 14px;
  }
  .saran li::before{
    counter-increment:s;content:counter(s);
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    background:var(--kunyit);color:var(--atas);font-family:"Space Mono",monospace;font-weight:700;font-size:.85rem;
    display:grid;place-items:center;
  }
  ul.saran{padding:0;margin:0}

  /* ---------- sertifikat ---------- */
  .sertifikat{
    border:3px double var(--hutan);border-radius:var(--r);
    background:var(--kartu);padding:28px 22px;text-align:center;
    position:relative;overflow:hidden;
  }
  .sertifikat::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--garis);border-radius:8px;pointer-events:none;
  }
  .sertifikat > *{position:relative}
  .sertifikat h3{font-size:clamp(1.3rem,4.4vw,1.9rem);color:var(--hutan);letter-spacing:.01em}
  .sertifikat .gelar{
    font-family:"Space Mono",monospace;font-weight:700;font-size:1.05rem;
    border-top:2px solid var(--garis);border-bottom:2px solid var(--garis);
    padding:10px 0;margin:14px auto;max-width:22ch;
  }
  .sertifikat .lencana{width:96px;height:96px;margin:6px auto 0;display:block}
  .sertifikat .apresiasi{max-width:46ch;margin:12px auto 0;color:var(--tinta2)}
  .sertifikat .kaki{
    margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);
  }

  /* ---------- rekap ---------- */
  .rekap-baris{
    border:2px solid var(--garis);border-radius:12px;background:var(--kartu);
    padding:16px;display:flex;flex-direction:column;gap:10px;
  }
  .rekap-baris.terbaik{border-left:6px solid var(--lumut)}
  .rekap-baris.biasa{border-left:6px solid var(--kunyit)}
  .rekap-kepala{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .rekap-kepala .no{font-family:"Space Mono",monospace;font-weight:700;color:var(--tinta2)}
  .kotak-kecil{background:var(--kartu2);border:2px solid var(--garis);border-radius:10px;padding:10px 12px}
  .kotak-kecil .label{display:block;margin-bottom:3px}

  /* ---------- teks & tabel ---------- */
  .isi{display:flex;flex-direction:column;gap:14px;max-width:68ch}
  .isi h2{font-size:1.6rem}
  .isi h3{font-size:1.15rem;color:var(--hutan);margin-top:6px}
  .isi ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
  .isi p{color:var(--tinta2)}
  .kutip{
    border-left:5px solid var(--kunyit);background:var(--kunyit-lembut);
    border-radius:0 12px 12px 0;padding:14px 16px;font-style:italic;
  }
  .gulir{overflow-x:auto;border:2px solid var(--garis);border-radius:12px;background:var(--kartu)}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--garis);vertical-align:top}
  th{background:var(--kartu2);font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2)}
  tr:last-child td{border-bottom:none}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}

  .catatan{
    display:flex;gap:12px;align-items:flex-start;
    border:2px dashed var(--garis-tebal);border-radius:12px;padding:14px;background:var(--kartu2);
    font-size:.94rem;color:var(--tinta2);
  }
  .kaki-hal{text-align:center;font-size:.82rem;color:var(--tinta2);padding:10px 0 0;border-top:2px solid var(--garis)}
  .jejak{display:flex;justify-content:center;gap:14px;opacity:.5;padding:4px 0}

  @media (max-width:1140px){
    #teksSuara{display:none}
    .suara{padding:6px 10px}
  }
  @media (max-width:760px){
    body{font-size:16px}
    .hero{grid-template-columns:1fr;padding:22px;gap:18px}
    .alat{order:-1}
    .fakta-baris{grid-template-columns:1fr}
    .strip{top:auto;position:static}
    .baris-tbl .tbl{width:100%}
    .tbl.besar{width:100%}
    .stempel{position:static;transform:none;display:inline-block;margin-bottom:10px}
    .kepala-isi{padding:8px 14px;gap:8px}
    .merek span{display:none}
    .panel{padding:18px}
  }
  @media print{
    .kepala,.nav,.baris-tbl,.strip,.catatan,.kaki-hal,.no-cetak{display:none!important}
    body{background:#fff;color:#000}
    .sertifikat{border-color:#000;box-shadow:none}
  }
</style>

<header class="kepala">
  <div class="kepala-isi">
    <div class="merek">
      <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="Lencana Eco Detective">
        <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"></circle>
        <circle cx="21" cy="21" r="11" fill="none" stroke="var(--lumut)" stroke-width="3.4"></circle>
        <path d="M29 29 L40 40" stroke="var(--kunyit)" stroke-width="4.6" stroke-linecap="round"></path>
        <path d="M21 27c-5-1-7-5-6-10 5-1 9 2 9 7 2-4 6-5 9-3-1 5-5 7-9 6z" fill="var(--hutan)"></path>
      </svg>
      <div>
        <b>Eco Detective Mission</b>
        <span>Markas Investigasi Lingkungan</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Menu utama">
      <button type="button" data-aksi="nav:beranda">Beranda</button>
      <button type="button" data-aksi="nav:bermain">Bermain</button>
      <button type="button" data-aksi="nav:cara">Cara Bermain</button>
      <button type="button" data-aksi="nav:tentang">Tentang Proyek</button>
    </nav>
    <button type="button" class="suara" id="tblSuara" data-aksi="suara" aria-pressed="true">
      <span id="ikonSuara">🔊</span> <span id="teksSuara">Suara: Hidup</span>
    </button>
  </div>
</header>

<main class="bungkus" id="app" tabindex="-1"></main>

<script>
(function(){
  "use strict";

  /* =======================================================
     DATA 9 KASUS — ditentukan siswa, diperiksa ulang faktanya
     ======================================================= */
  var KASUS = [
    {
      no:1, tema:"Sampah Plastik", tempat:"Sekolah", ikon:"🧴",
      situasi:"Tempat sampah di kantin sekolah penuh dengan botol plastik. Setiap hari tumpukannya makin tinggi sampai petugas kebersihan kewalahan.",
      pilihan:[

  function pilihanDari(i){
    var k = KASUS[i]; if (!k) return null;
    var kode = state.jawaban[i]; if (!kode) return null;

  }
  function skor(){

  }
  function terjawab(){

  var ac = null;
  function nada(freq, dur, jenis){
    if (!state.suara) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ac) ac = new AC();
      if (ac.state === "suspended" && ac.resume) ac.resume();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = jenis || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.09, ac.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur + 0.02);
    }catch(e){ /* suara diabaikan kalau tidak didukung */ }
  }

  /* =======================================================

     ======================================================= */
  function layarKasus(){
    var k = KASUS[state.idx];
    if (!k) return layarGagal();

    var dipilih = state.jawaban[state.idx];
    var pil = "";
    for (var i=0;i<k.pilihan.length;i++){
      var p = k.pilihan[i];
      var aktif = dipilih === p.kode;
      var cls = "pilihan" + (aktif ? " dipilih" : (dipilih ? " pudar" : ""));
      pil += '<button type="button" class="'+cls+'" data-aksi="pilih:'+p.kode+'"'+(dipilih ? " disabled" : "")+'>'+
        '<span class="kode" aria-hidden="true">'+p.kode+'</span>'+
        '<span>'+esc(p.teks)+(aktif ? ' <strong class="mono" style="white-space:nowrap">(+'+p.poin+')</strong>' : '')+'</span>'+
      '</button>';
    }

    var balik = "";
    var tombol = "";
    if (dipilih){
      var p2 = pilihanDari(state.idx);
      if (p2){
        var terbaik = !!p2.terbaik;
        balik = '<div class="balik'+(terbaik ? "" : " belum")+'" id="balik" tabindex="-1">'+
          '<div class="balik-kepala">'+
            '<span class="chip '+(terbaik ? "hijau" : "kuning")+'">'+(terbaik ? "✓ Pilihan Terbaik" : "◐ Bisa Lebih Baik")+'</span>'+
            '<span class="poin-dapat">+'+p2.poin+' Eco Energy</span>'+
          '</div>'+
          '<div><span class="label">Akibat pilihanmu</span><p style="margin-top:4px">'+esc(p2.akibat)+'</p></div>'+
          (terbaik ? "" :
            '<div class="kotak-kecil"><span class="label">Catatan detektif</span>'+esc(k.mengapa)+'</div>')+
        '</div>';
        var akhir = state.idx >= KASUS.length - 1;
        tombol = '<div class="baris-tbl" style="margin-top:18px">'+
          '<button type="button" class="tbl '+(akhir ? "kuning" : "")+'" data-aksi="lanjut">'+
            (akhir ? "📋 Lihat Hasil Investigasi" : "Kasus Berikutnya →")+
          '</button>'+
        '</div>';
      }
    } else {
      tombol = '<p style="margin-top:16px;font-size:.9rem;color:var(--tinta2)">Pilih salah satu solusi di atas untuk melihat akibatnya dan melanjutkan ke kasus berikutnya.</p>';
    }

    return '<div class="layar">'+
      strip()+
      '<section class="panel berkas">'+
        '<span class="tab">KASUS '+(k.no < 10 ? "0"+k.no : k.no)+' / 0'+KASUS.length+'</span>'+
        '<div class="kasus-kepala">'+
          '<div class="ikon-kasus" aria-hidden="true">'+k.ikon+'</div>'+
          '<div style="flex:1 1 220px">'+
            '<span class="label">Tema kasus</span>'+
            '<h2>'+esc(k.tema)+'</h2>'+
            '<span class="chip" style="margin-top:8px">📍 '+esc(k.tempat)+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="situasi">'+esc(k.situasi)+'</div>'+
        '<div style="margin-top:20px"><span class="label">Pilih satu solusi</span></div>'+
        '<div class="pilihan-list">'+pil+'</div>'+
        balik+
        tombol+
      '</section>'+
      '<div class="baris-tbl no-cetak">'+
        '<button type="button" class="tbl kedua" data-aksi="nav:beranda">← Beranda</button>'+
        '<button type="button" class="tbl kedua" data-aksi="nav:cara">Cara Bermain</button>'+

  function layarRekap(){
    var baris = "";

      var p = pilihanDari(i);
      var best = null;
      for (var j=0;j<k.pilihan.length;j++) if (k.pilihan[j].terbaik) best = k.pilihan[j];
      var terbaik = !!(p && p.terbaik);

      var isiPilihan = p ?
        '<div class="kotak-kecil"><span class="label">Pilihanmu · '+p.kode+' · +'+p.poin+' poin</span>'+esc(p.teks)+'</div>' :
        '<div class="kotak-kecil"><span class="label">Pilihanmu</span>Kasus ini belum kamu selidiki.</div>';

      baris += '<article class="rekap-baris '+(terbaik ? "terbaik" : "biasa")+'">'+
        '<div class="rekap-kepala">'+
          '<span class="no">KASUS '+(k.no < 10 ? "0"+k.no : k.no)+'</span>'+
          '<span aria-hidden="true">'+k.ikon+'</span>'+
          '<strong>'+esc(k.tema)+'</strong>'+
          '<span class="chip">'+esc(k.tempat)+'</span>'+

        '</div>'+
        '<p style="font-size:.95rem;color:var(--tinta2)">'+esc(k.situasi)+'</p>'+
        isiPilihan+
        '<div class="kotak-kecil" style="border-color:var(--lumut)"><span class="label">Jawaban terbaik · '+(best ? best.kode : "-")+' · +'+(best ? best.poin : 0)+' poin</span>'+

      '</div></section>'+

      '<section class="panel">'+
        '<span class="label">Pemeriksaan Fakta</span>'+
        '<h3 style="margin-top:6px;color:var(--hutan)">Klaim yang diperiksa siswa</h3>'+
        '<p style="margin:8px 0 14px;color:var(--tinta2);max-width:68ch">Setiap fakta lingkungan dicek ke sumber resmi. Klaim yang tidak bisa dipastikan tidak dipakai sebagai angka di dalam soal, dan ditandai di bawah ini.</p>'+
        '<div class="gulir"><table>'+
          '<thead><tr><th>Klaim</th><th>Status</th><th>Catatan siswa</th><th>Sumber</th></tr></thead>'+
          '<tbody>'+fakta+'</tbody>'+
        '</table></div>'+
      '</section>'+

      '<section class="panel">'+
        '<span class="label">User testing · Simulasi Portofolio</span>'+
        '<h3 style="margin-top:6px;color:var(--hutan)">Hasil uji coba ke teman</h3>'+
        '<p style="margin:8px 0 14px;color:var(--tinta2)">Data di bawah adalah <strong>contoh simulasi</strong> untuk kebutuhan portofolio, bukan data pengujian nyata. Nama pemain memakai sebutan detektif, bukan nama asli.</p>'+
        '<div class="gulir"><table>'+
          '<thead><tr><th>Penguji</th><th>Masukan</th><th>Perbaikan yang dilakukan</th></tr></thead>'+
          '<tbody>'+uji+'</tbody>'+
        '</table></div>'+
      '</section>'+

      '<section class="panel"><div class="isi">'+
        '<h3>Catatan keamanan dan keterbatasan</h3>'+
        '<ul>'+
          '<li><strong>Tidak ada AI yang dipanggil saat bermain.</strong> Seluruh isi kasus, akibat pilihan, dan pesan hasil adalah teks statis yang sudah diperiksa lebih dulu. Kalau nanti dibuat versi produksi dengan respons AI langsung, API harus dipanggil lewat backend yang aman — tidak pernah menyimpan API key di halaman depan.</li>'+
          '<li><strong>Tidak ada data pribadi.</strong> Permainan tidak meminta nama, umur, sekolah, nomor telepon, atau foto. Sertifikat memakai sebutan “Detektif Lingkungan Cilik”.</li>'+
          '<li><strong>Skor tidak disimpan.</strong> Jika halaman ditutup atau dimuat ulang, permainan mulai dari awal lagi.</li>'+
          '<li><strong>Bukan sumber ilmiah.</strong> Permainan ini alat belajar. Angka dan fakta rinci tetap perlu dicek ke sumber resmi seperti EPA, UNEP, atau NOAA yang dicantumkan di tabel Pemeriksaan Fakta.</li>'+
          '<li><strong>Ilustrasi orisinal.</strong> Semua gambar dibuat dari bentuk SVG dan CSS sederhana serta emoji standar — tidak ada karakter, foto, atau musik berhak cipta.</li>'+
        '</ul>'+
        '<h3>Rencana pengembangan berikutnya</h3>'+
        '<ul>'+
          '<li>Menambah mode “Kasus Harian” berisi satu kasus baru setiap hari.</li>'+
          '<li>Menambahkan data komposisi sampah Indonesia kalau sumber resminya sudah bisa diakses.</li>'+
          '<li>Menambah mode dua pemain untuk membandingkan Eco Energy bersama teman.</li>'+
          '<li>Menyimpan progres secara lokal agar permainan bisa dilanjutkan lain hari.</li>'+
          '<li>Menghubungkan respons AI sungguhan lewat backend aman supaya detektif bisa bertanya bebas soal kasusnya.</li>'+
        '</ul>'+
      '</div></section>'+

      '<div class="baris-tbl">'+
        '<button type="button" class="tbl" data-aksi="briefing">🔎 Mulai Investigasi</button>'+
        '<button type="button" class="tbl kedua" data-aksi="nav:beranda">← Beranda</button>'+
      '</div>'+
    '</div>';
  }

  /* =======================================================
     LAYAR: GAGAL (pengaman, bukan halaman kosong)
     ======================================================= */
  function layarGagal(){
    return '<div class="layar">'+
      '<section class="panel" style="text-align:center">'+
        '<div style="font-size:2.6rem" aria-hidden="true">🧭</div>'+
        '<h2 style="margin-top:10px">Berkas kasus ini tidak ditemukan</h2>'+
        '<p style="margin:12px auto 0;max-width:44ch;color:var(--tinta2)">Sepertinya ada berkas yang terselip di markas. Tidak masalah, Detektif — kita bisa memulai investigasi dari kasus pertama lagi.</p>'+
        '<div class="baris-tbl" style="margin-top:20px;justify-content:center">'+
          '<button type="button" class="tbl besar" data-aksi="mulai">🔄 Mulai Ulang</button>'+
          '<button type="button" class="tbl kedua" data-aksi="nav:beranda">🏠 Beranda</button>'+
        '</div>'+
      '</section>'+
    '</div>';
  }

  /* =======================================================
     RENDER
     ======================================================= */
  var LAYAR = {
    beranda: layarBeranda,
    cara: layarCara,
    briefing: layarBriefing,
    kasus: layarKasus,
    hasil: layarHasil,
    rekap: layarRekap,
    tentang: layarTentang,
    gagal: layarGagal
  };
  var NAV_UNTUK = { beranda:"nav:beranda", kasus:"nav:bermain", briefing:"nav:bermain", hasil:"nav:bermain", rekap:"nav:bermain", cara:"nav:cara", tentang:"nav:tentang" };

  function render(){
    var app = document.getElementById("app");
    var fn = LAYAR[state.layar] || layarGagal;
    try{
      app.innerHTML = fn();
    }catch(e){
      app.innerHTML = layarGagal();
    }
    /* status menu aktif */
    var tombolNav = document.querySelectorAll("#nav button");
    for (var i=0;i<tombolNav.length;i++){
      var a = tombolNav[i].getAttribute("data-aksi");
      if (a === NAV_UNTUK[state.layar]) tombolNav[i].setAttribute("aria-current","page");
      else tombolNav[i].removeAttribute("aria-current");
    }
    /* fokus & posisi gulir */
    if (state.fokusBalik){
      state.fokusBalik = false;
      var b = document.getElementById("balik");
      if (b && b.scrollIntoView) b.scrollIntoView({behavior:"smooth", block:"center"});
    } else {
      window.scrollTo({top:0, behavior:"auto"});
    }
  }

  function keLayar(nama){
    state.layar = LAYAR[nama] ? nama : "gagal";
    render();
  }

  /* =======================================================
     AKSI
     ======================================================= */
  document.addEventListener("click", function(ev){
    var el = ev.target.closest ? ev.target.closest("[data-aksi]") : null;
    if (!el) return;
    var aksi = el.getAttribute("data-aksi");

    if (aksi === "suara"){
      state.suara = !state.suara;
      var tbl = document.getElementById("tblSuara");
      document.getElementById("ikonSuara").textContent = state.suara ? "🔊" : "🔈";
      document.getElementById("teksSuara").textContent = state.suara ? "Suara: Hidup" : "Suara: Mati";
      tbl.setAttribute("aria-pressed", state.suara ? "true" : "false");
      if (state.suara) bunyiKlik();
      return;
    }

    if (aksi.indexOf("nav:") === 0){
      var tujuan = aksi.slice(4);
      bunyiKlik();
      if (tujuan === "bermain"){
        var i = kasusPertamaBelum();
        if (i === -1){ keLayar("hasil"); }
        else { state.idx = i; keLayar("kasus"); }
        return;
      }
      if (tujuan === "hasil"){ keLayar("hasil"); return; }
      if (tujuan === "rekap"){ keLayar("rekap"); return; }
      keLayar(tujuan);
      return;
    }

    if (aksi === "briefing"){ bunyiKlik(); keLayar("briefing"); return; }

    if (aksi === "mulai"){
      reset();
      bunyiKlik();
      keLayar("kasus");
      return;
    }

    if (aksi === "lanjutkan"){
      var j = kasusPertamaBelum();
      state.idx = j === -1 ? 0 : j;
      bunyiKlik();
      keLayar(j === -1 ? "hasil" : "kasus");
      return;
    }

    if (aksi.indexOf("pilih:") === 0){
      if (state.layar !== "kasus") return;
      var k = KASUS[state.idx];
      if (!k) { keLayar("gagal"); return; }
      if (state.jawaban[state.idx]) return; /* jawaban dikunci */
      var kode = aksi.slice(6);
      var ada = null;
      for (var m=0;m<k.pilihan.length;m++) if (k.pilihan[m].kode === kode) ada = k.pilihan[m];
      if (!ada) return;
      state.jawaban[state.idx] = kode;
      state.fokusBalik = true;
      if (ada.terbaik) bunyiBagus(); else bunyiBiasa();
      render();
      return;
    }

    if (aksi === "lanjut"){
      if (!state.jawaban[state.idx]) return;
      bunyiKlik();
      if (state.idx >= KASUS.length - 1){ keLayar("hasil"); }
      else { state.idx = state.idx + 1; keLayar("kasus"); }
      return;
    }

    if (aksi === "coba-lagi"){
      reset();
      bunyiKlik();
      keLayar("kasus");
      return;
    }

    if (aksi === "cetak"){
      try{ window.print(); }catch(e){}
      return;
    }
  });

  /* alat bantu pengujian (tidak terlihat pemain) */
  window.__eco = {
    isi: function(kodeList){
      reset();
      for (var i=0;i<KASUS.length && i<kodeList.length;i++) state.jawaban[i] = kodeList[i];
      state.idx = KASUS.length - 1;
      keLayar("hasil");
      return {skor:skor(), persen:persen(), tingkat:tingkat().nama};
    },
    state: state, KASUS: KASUS, MAKS: MAKS, skor: skor, persen: persen,
    tingkat: function(){ return tingkat().nama; },
    ke: keLayar,
    setIdx: function(i){ state.idx = i; }
  };

  /* tinggi kepala dipakai agar Eco Energy Meter tidak tertutup menu */
  function ukurKepala(){
    try{
      var h = document.querySelector(".kepala");
      if (h) document.documentElement.style.setProperty("--th", h.offsetHeight + "px");
    }catch(e){}
  }
  window.addEventListener("resize", ukurKepala);
  ukurKepala();

  render();
  ukurKepala();
})();
</script>

</body></html>
