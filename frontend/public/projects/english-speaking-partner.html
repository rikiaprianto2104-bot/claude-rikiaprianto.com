<style>

    --ink:#e6f3f0; --ink-soft:#9ebab5; --line:#23433f;
    --accent:#39b8a9; --accent-ink:#04211f; --accent-wash:#12332f;
    --gold:#e5b455; --gold-wash:#2c2412;
    --amber-bg:#33280f; --amber-line:#7d6127; --amber-ink:#f2d09a;
    --me-bg:#177f76; --me-ink:#f2fffd;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#08201f; --surface:#0f2b29; --surface-2:#143430; --surface-3:#1b423d;
  --ink:#e6f3f0; --ink-soft:#9ebab5; --line:#23433f;
  --accent:#39b8a9; --accent-ink:#04211f; --accent-wash:#12332f;
  --gold:#e5b455; --gold-wash:#2c2412;
  --amber-bg:#33280f; --amber-line:#7d6127; --amber-ink:#f2d09a;
  --me-bg:#177f76; --me-ink:#f2fffd;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-weight:600; line-height:1.15; text-wrap:balance; margin:0}
p{margin:0}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}

/* ---------- layout ---------- */
.wrap{width:min(1080px,100%); margin:0 auto; padding:0 18px}
.topbar{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.topbar-in{display:flex; align-items:center; gap:14px; min-height:62px; flex-wrap:wrap; padding:8px 0}
.brand{display:flex; align-items:center; gap:9px; font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.06rem; letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--teal-500),var(--teal-700));display:grid;place-items:center;color:#fff;font-size:.95rem;flex:none}
nav{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
nav button{padding:8px 13px; border-radius:999px; font-size:.9rem; font-weight:600; color:var(--ink-soft)}

nav button[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
main{padding:26px 0 60px}
.stack{display:flex; flex-direction:column; gap:22px}

/* ---------- generic bits ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.eyebrow{font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:12px; font-weight:700; background:var(--accent); color:var(--accent-ink); border:1px solid transparent; transition:transform .12s ease, filter .12s ease}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.gold{background:var(--gold); color:#231802}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.big{padding:16px 30px; font-size:1.05rem; border-radius:14px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:.8rem; font-weight:600; color:var(--ink-soft)}
.pill.sim{background:var(--gold-wash); border-color:var(--gold); color:var(--gold)}
.divider{height:1px; background:var(--line); border:0; margin:0}

/* ---------- hero ---------- */
.hero{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:34px; display:grid; grid-template-columns:1.15fr .85fr; gap:30px; align-items:center; box-shadow:var(--shadow)}
.hero h1{font-size:clamp(2rem,5.2vw,3.05rem); letter-spacing:-.02em}
.hero .tag{font-size:1.06rem; color:var(--ink-soft); margin-top:12px; max-width:46ch}
.hero-actions{margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.hero-meta{margin-top:18px; display:flex; gap:8px; flex-wrap:wrap}
.demo-chat{background:var(--surface-2); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px}
.demo-chat .b{max-width:88%; padding:10px 14px; border-radius:16px; font-size:.9rem; line-height:1.5}
.demo-chat .b.ai{background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px}
.demo-chat .b.me{background:var(--me-bg); color:var(--me-ink); align-self:flex-end; border-bottom-right-radius:5px}

/* ---------- steps / how to ---------- */
.howto{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}

.pick{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:6px; transition:border-color .15s, transform .12s, background .15s; width:100%}
.pick:hover{border-color:var(--teal-300); transform:translateY(-2px)}
.pick[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-wash); box-shadow:inset 0 0 0 1px var(--accent)}
.pick .em{font-size:1.5rem; line-height:1}
.pick .t{font-weight:700; font-size:1rem}
.pick .d{font-size:.87rem; color:var(--ink-soft)}
.pick .lvl-bars{display:flex; gap:3px; margin-top:2px}
.pick .lvl-bars i{width:16px;height:5px;border-radius:3px;background:var(--surface-3)}
.pick .lvl-bars i.on{background:var(--accent)}
.preview{border:1px dashed var(--teal-300); background:var(--accent-wash); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:12px}
.vocab-chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:.86rem}
.chip b{font-weight:700}
.chip span{color:var(--ink-soft)}

/* ---------- chat ---------- */
.chat-shell{width:min(780px,100%); margin:0 auto; display:flex; flex-direction:column; gap:12px}
.chat-head{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:11px}
.chat-head .line1{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.chat-head h2{font-size:1.08rem}
.progress{height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--teal-500),var(--teal-300)); border-radius:99px; transition:width .4s ease}
.vocab-panel{border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px}
.vocab-panel[hidden]{display:none!important}
.vocab-list{display:flex; flex-direction:column; gap:6px}

.msgs{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:12px; min-height:320px; max-height:min(58vh,560px); overflow-y:auto; scroll-behavior:smooth}
.msg{display:flex; flex-direction:column; gap:6px; max-width:86%}
.msg.ai{align-self:flex-start; align-items:flex-start}
.msg.me{align-self:flex-end; align-items:flex-end}
.msg .who{font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.bubble{padding:11px 15px; border-radius:18px; line-height:1.55; white-space:pre-line}
.msg.ai .bubble{background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:6px}
.msg.me .bubble{background:var(--me-bg); color:var(--me-ink); border-bottom-right-radius:6px}
.fixcard{align-self:stretch; max-width:100%; background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:9px}
.fixcard .hd{font-weight:700; font-size:.88rem; color:var(--amber-ink); display:flex; align-items:center; gap:7px}
.fixcard .rowline{font-size:.9rem; display:flex; gap:8px; align-items:flex-start}
.fixcard .rowline{display:grid; grid-template-columns:96px 1fr; gap:10px; align-items:start}
.fixcard .lbl{font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--amber-ink); padding-top:3px}
.fixcard .val{color:var(--ink)}
.fixcard .val.strike{text-decoration:line-through; text-decoration-color:var(--amber-line); color:var(--ink-soft)}
.fixcard .val.good{font-weight:700}
.fixcard .tip{font-size:.85rem; color:var(--amber-ink)}
.btn-fix{align-self:flex-start; background:var(--surface); border:1px solid var(--amber-line); color:var(--amber-ink); padding:8px 13px; border-radius:10px; font-size:.85rem; font-weight:700}
.btn-fix:hover{background:var(--gold-wash)}
.better{background:var(--surface); border:1px solid var(--amber-line); border-radius:10px; padding:10px 12px; font-size:.9rem}
.better b{display:block; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--amber-ink); margin-bottom:3px}
.typing{display:flex; gap:4px; padding:14px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:18px; border-bottom-left-radius:6px; width:fit-content}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.composer{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px; display:flex; flex-direction:column; gap:10px}
.composer .in{display:flex; gap:10px; align-items:flex-end}
textarea, input[type=text]{font:inherit; width:100%; resize:none; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px 14px; line-height:1.5}
textarea::placeholder{color:var(--ink-soft)}
.sysnote{background:var(--surface-2); border:1px dashed var(--line); border-radius:12px; padding:10px 13px; font-size:.85rem; color:var(--ink-soft); align-self:center; max-width:100%; text-align:center}
/* ---------- mode suara ---------- */
.speak-btn{font-size:.76rem; font-weight:700; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 10px}
.speak-btn:hover{border-color:var(--teal-300); color:var(--accent)}
.speak-btn.mini{padding:1px 7px; font-size:.72rem; line-height:1.5}
.in-btns{display:flex; gap:8px; flex:none}
.btn.mic{background:var(--surface); border:1px solid var(--line); color:var(--ink); padding:13px 16px}
.btn.mic:hover{border-color:var(--accent); color:var(--accent)}
.btn.mic[aria-pressed="true"]{background:var(--gold); color:#231802; border-color:var(--gold); animation:pulse 1.3s ease-in-out infinite}
.btn.mic[disabled]{opacity:.45}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,133,16,.45)}50%{box-shadow:0 0 0 8px rgba(201,133,16,0)}}
.voice-note{font-size:.82rem; color:var(--ink-soft); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.voice-note.warn-line{color:var(--amber-ink)}

/* ---------- summary ---------- */
.score-wrap{display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center}
.ring{--p:0; width:150px; height:150px; border-radius:50%; background:conic-gradient(var(--gold) calc(var(--p)*1%), var(--surface-3) 0); display:grid; place-items:center; flex:none}
.ring .in{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring .num{font-family:"Fraunces",Georgia,serif; font-size:2.5rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.ring .of{font-size:.75rem; color:var(--ink-soft); letter-spacing:.08em}
.breakdown{display:flex; flex-direction:column; gap:10px}
.bd-row{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; font-size:.92rem}
.bd-bar{grid-column:1/-1; height:7px; background:var(--surface-3); border-radius:99px; overflow:hidden}
.bd-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bd-row .v{font-weight:700; font-variant-numeric:tabular-nums}
.hist{display:flex; flex-direction:column; gap:10px}
.hist-item{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 16px}
.hist-item .em{font-size:1.4rem}
.hist-item .sc{font-family:"Fraunces",Georgia,serif; font-size:1.4rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums}

/* ---------- about ---------- */
.about-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}
.kv{display:grid; grid-template-columns:150px 1fr; gap:8px 16px; font-size:.95rem}
.kv dt{font-weight:700; color:var(--ink-soft)}
.kv dd{margin:0}
ul.clean{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:.95rem}
.quote{background:var(--accent-wash); border-left:4px solid var(--accent); border-radius:0 12px 12px 0; padding:14px 16px; font-size:.94rem; font-style:italic}
.flow{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; overflow-x:auto; padding-bottom:4px}
.flow .node{background:var(--surface-2); border:1px solid var(--teal-300); border-radius:12px; padding:11px 14px; font-size:.86rem; font-weight:600; min-width:132px; text-align:center; display:grid; place-items:center}
.flow .arr{display:grid; place-items:center; color:var(--accent); font-weight:700}
.check{display:flex; flex-direction:column; gap:8px}
.check label{display:flex; gap:10px; align-items:flex-start; font-size:.93rem; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.check input{margin-top:4px; accent-color:var(--accent); width:16px; height:16px}
.warn{background:var(--amber-bg); border:1px solid var(--amber-line); color:var(--amber-ink); border-radius:12px; padding:14px 16px; font-size:.92rem}
footer{border-top:1px solid var(--line); padding:20px 0 34px; font-size:.85rem; color:var(--ink-soft); text-align:center}

@media (max-width:860px){
  .hero{grid-template-columns:1fr; padding:24px}
  .howto{grid-template-columns:1fr}
  .grid-lvl{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr; gap:2px 0}
  .kv dd{margin-bottom:8px}
}
@media (max-width:620px){
  body{font-size:15px}
  .topbar-in{min-height:54px}
  nav{width:100%; margin-left:0; justify-content:space-between; gap:2px}
  nav button{padding:7px 6px; font-size:.73rem; flex:1; white-space:nowrap}
  .msg{max-width:94%}
  .msgs{max-height:none; min-height:46vh; padding:12px}
  .score-wrap{grid-template-columns:1fr; justify-items:center; text-align:center}
  .breakdown{width:100%}
  .fixcard .rowline{grid-template-columns:1fr; gap:2px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}
</style>

<script>
"use strict";
/* =========================================================
   English Speaking Partner — simulasi teman latihan bicara
   Semua "AI" di sini adalah simulasi berbasis pengenalan
   kata kunci & pola kalimat di sisi browser. Tidak ada API
   key, tidak ada panggilan endpoint AI sungguhan.
   ========================================================= */

/* ---------- util ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const words = s => String(s || "").trim().split(/\s+/).filter(Boolean).length;
const cap = s => { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; };
const clean = s => String(s || "").trim().replace(/[.!?,;:]+$/, "");
const norm = s => " " + String(s || "").toLowerCase().replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim() + " ";

function gerund(v){
  const irr = { run:"running", swim:"swimming", ride:"riding", dance:"dancing", write:"writing",
    sing:"singing", shop:"shopping", travel:"traveling", cook:"cooking", jog:"jogging", sit:"sitting" };
  if (irr[v]) return irr[v];
  if (/e$/.test(v)) return v.slice(0, -1) + "ing";
  return v + "ing";
}

/* ---------- mode suara (Web Speech API bawaan browser) ----------
   Text-to-speech: AI membacakan kalimatnya dalam bahasa Inggris.
   Speech-to-text: siswa menjawab dengan mikrofon (Chrome/Edge).
   Keduanya memakai mesin bawaan browser — bukan model AI, tanpa API key. */
const TTS_OK = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const ASR_OK = !!SR;
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
let rec = null, heard = "";

/* Izin mikrofon diminta lewat getUserMedia dulu supaya pesan errornya akurat:
   di dalam bingkai pratinjau (iframe) browser memblokir mikrofon walaupun
   izin di sistem operasi sudah diberikan. */
async function askMicPermission(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { ok:false, why:"nodevice" };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    stream.getTracks().forEach(t => t.stop());
    return { ok:true };
  } catch (e) {
    return { ok:false, why:(e && e.name) ? e.name : "UnknownError" };
  }
}
async function micPermState(){
  try {
    if (navigator.permissions && navigator.permissions.query){
      const p = await navigator.permissions.query({ name:"microphone" });
      return p.state;
    }
  } catch (e) {}
  return "tidak diketahui";
}

function speak(text, force, slow){
  if (!TTS_OK) return;
  if (!force && !state.voice.ttsOn) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, " ").trim());
    u.lang = "en-US"; u.rate = slow ? 0.6 : 0.92; u.pitch = 1;
    const v = (window.speechSynthesis.getVoices() || []).find(x => /^en([-_]|$)/i.test(x.lang));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) { /* browser menolak — abaikan, teks tetap terbaca */ }
}
function hush(){ if (TTS_OK) { try { window.speechSynthesis.cancel(); } catch (e) {} } }

function ensureRec(){
  if (rec) return rec;
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    let fin = "", int = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) fin += r[0].transcript; else int += r[0].transcript;
    }
    if (fin) heard = (heard ? heard + " " : "") + fin.trim();
    const ta = $("#answer");
    if (ta) ta.value = (heard + (int ? " " + int.trim() : "")).trim();
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") state.voice.needTab = IN_FRAME;
    const map = {
      "not-allowed": IN_FRAME
        ? "Mesin pengenalan suara diblokir di dalam bingkai pratinjau. Buka aplikasi di tab penuh, lalu tekan 🎤 lagi."
        : "Akses mikrofon belum diizinkan untuk halaman ini. Klik ikon gembok di sebelah alamat web → Microphone → Allow, lalu muat ulang.",
      "service-not-allowed": IN_FRAME
        ? "Layanan pengenalan suara tidak diizinkan di bingkai pratinjau. Buka aplikasi di tab penuh, atau ketik jawabanmu."
        : "Layanan pengenalan suara tidak tersedia di browser ini. Coba Chrome atau Edge, atau ketik jawabanmu.",
      "no-speech": "Belum ada suara yang terdengar. Tekan 🎤 lagi lalu bicara sedikit lebih dekat ke mikrofon.",
      "audio-capture": "Mikrofon tidak ditemukan di perangkat ini. Kamu tetap bisa mengetik jawabanmu.",
      "aborted": ""
    };
    state.voice.msg = map[e.error] !== undefined ? map[e.error] : "Mikrofon bermasalah (" + e.error + "). Kamu tetap bisa mengetik jawabanmu.";
  };
  rec.onend = () => { state.voice.listening = false; renderChat(true); };
  return rec;
}

async function micToggle(){
  if (!ASR_OK){
    state.voice.msg = "Browser ini belum mendukung input suara. Coba Chrome atau Edge — atau ketik jawabanmu seperti biasa.";
    state.voice.needTab = false;
    return renderChat();
  }
  if (state.voice.listening){ try { rec.stop(); } catch (e) { state.voice.listening = false; renderChat(); } return; }

  hush();
  state.voice.needTab = false;
  state.voice.msg = "Meminta izin mikrofon…";
  renderChat();

  const izin = await askMicPermission();
  if (!izin.ok){
    const perm = await micPermState();
    if (izin.why === "NotAllowedError" || izin.why === "SecurityError"){
      if (IN_FRAME){
        state.voice.needTab = false;
        state.voice.blocked = true;
        state.voice.msg = "Mikrofon tidak bisa dipakai di tampilan ini. Aplikasi berjalan di dalam kotak aman (sandbox) yang memblokir mikrofon — bukan kesalahan laptop, HP, atau izin yang kamu berikan. Latihan tetap jalan penuh dengan mengetik, dan semua tombol 🔊 tetap bisa dipakai untuk mendengar pelafalan.";
      } else {
        state.voice.msg = "Izin mikrofon ditolak untuk halaman ini. Klik ikon gembok/⚙️ di sebelah alamat web → Site settings → Microphone → Allow, lalu muat ulang halaman. (Status izin: " + perm + ")";
      }
    } else if (izin.why === "NotFoundError" || izin.why === "nodevice"){
      state.voice.msg = "Tidak ada mikrofon yang terdeteksi di perangkat ini. Cek pengaturan suara laptopmu, atau ketik jawabanmu.";
    } else if (izin.why === "NotReadableError" || izin.why === "AbortError"){
      state.voice.msg = "Mikrofon sedang dipakai aplikasi lain (misalnya Zoom, Meet, atau perekam suara). Tutup aplikasi itu dulu, lalu tekan 🎤 lagi.";
    } else {
      state.voice.blocked = IN_FRAME;
      state.voice.msg = "Mikrofon tidak bisa dibuka (" + izin.why + "). Status izin: " + perm + ". Kamu tetap bisa mengetik jawabanmu.";
    }
    return renderChat();
  }

  ensureRec();
  const ta = $("#answer");
  heard = ta ? ta.value.trim() : "";
  state.voice.msg = "";
  try {
    rec.start();
    state.voice.listening = true;
    renderChat();
  } catch (e) {
    state.voice.listening = false;
    state.voice.msg = "Mikrofon belum siap. Tunggu sebentar lalu tekan 🎤 lagi.";
    renderChat();
  }
}

/* ---------- mesin koreksi (pola kesalahan umum) ---------- */
const BASE_VERBS = "play|read|watch|sing|draw|swim|cook|dance|run|study|listen|write|eat|travel|sleep|ride|paint|jog|shop";
const PLACES = "museum|station|hospital|library|market|bank|park|mall|beach|airport|school|hotel|stadium|post office";

const RULES = {
  missingMy: {
    test: t => /\bname is\b/.test(t) && !/\bmy name is\b/.test(t),
    sugg: "Try saying 'My name is Budi' — don't forget 'My' before 'name'!",
    tip: "Perkenalan diri dalam bahasa Inggris dimulai dengan 'My name is ...'.",
    fix: raw => cap(raw.replace(/\bname is\b/i, "my name is"))
  },
  missingAmFrom: {
    test: t => /\bi (from|come from)\b/.test(t),
    sugg: "Good try! Remember to add 'am': 'I am from Jakarta.'",
    tip: "Setelah 'I', gunakan 'am' sebelum kata 'from'.",
    fix: raw => cap(raw.replace(/\bi come from\b/i, "I am from").replace(/\bi from\b/i, "I am from"))
  },
  likeBaseVerb: {
    test: t => new RegExp("\\bi (like|love|enjoy) (" + BASE_VERBS + ")\\b").test(t),
    sugg: "Almost! Try: 'I like playing football' or 'I like to play football.'",
    tip: "Setelah 'I like', kata kerja memakai bentuk -ing atau didahului 'to'.",
    fix: raw => {
      const m = raw.match(new RegExp("\\bi (like|love|enjoy) (" + BASE_VERBS + ")\\b", "i"));
      if (!m) return null;
      return cap(raw.replace(m[0], "I " + m[1].toLowerCase() + " " + gerund(m[2].toLowerCase())));
    }
  },
  noBecause: {
    test: t => !/\b(because|since|so that|that is why|thats why)\b/.test(t) && words(t) >= 1,
    sugg: "Try: 'I like it because it's fun.'",
    tip: "Gunakan 'because' untuk menjelaskan alasanmu — jawabanmu jadi lebih kuat.",
    fix: raw => cap(clean(raw)) + " because it makes me happy."
  },
  noExample: {
    test: t => !/\b(for example|such as|for instance|like when)\b/.test(t),
    sugg: "Try adding an example: 'For example, I practice every weekend.'",
    tip: "Menambahkan 'For example' membuat penjelasanmu lebih meyakinkan.",
    fix: raw => cap(clean(raw)) + ". For example, I do it every weekend."
  },
  tooShort: {
    test: () => false,
    sugg: "Nice start! Try answering with a full sentence — a few more words help a lot.",
    tip: "Jawaban satu-dua kata masih terlalu singkat. Coba kalimat lengkap.",
    fix: raw => cap(clean(raw)) + ", and I would like to tell you more about it."
  },
  shortYes: {
    test: (t, raw) => /^(yes|yeah|yep|ok|okay|sure|yes i do|i do)$/.test(raw),
    sugg: "Try a full sentence: 'Yes, thank you so much!'",
    tip: "Jawaban 'yes' saja terdengar singkat. Tambahkan ucapan terima kasih atau alasan.",
    fix: () => "Yes, I understand. Thank you so much!"
  },
  shortNo: {
    test: (t, raw) => /^(no|nope|no thanks|nothing)$/.test(raw),
    sugg: "Try asking one question: 'Yes, could you tell me more about the schedule?'",
    tip: "Dalam wawancara, bertanya balik menunjukkan kamu tertarik.",
    fix: () => "Yes, could you tell me more about the working schedule?"
  },
  iWant: {
    test: t => /\bi want\b/.test(t),
    sugg: "A little more polite: 'I would like a pizza, please.'",
    tip: "'I want' terdengar terlalu langsung. 'I would like ... , please' lebih sopan.",
    fix: raw => {
      let s = raw.replace(/\bi want\b/i, "I would like");
      if (!/please/i.test(s)) s = clean(s) + ", please";
      return cap(s) + ".";
    }
  },
  noPlease: {
    test: t => !/\b(please|thank you|thanks)\b/.test(t),
    sugg: "Add 'please' to sound friendly: 'Can I have an orange juice, please?'",
    tip: "Di restoran, 'please' membuat permintaanmu terdengar sopan.",
    fix: raw => cap(clean(raw)) + ", please."
  },
  commandForm: {
    test: (t, raw) => /^(give me|make it|bring me|i need)\b/.test(raw),
    sugg: "Softer version: 'Could you make it less spicy, please?'",
    tip: "Awali permintaan dengan 'Could you ...' agar tidak terdengar memerintah.",
    fix: raw => {
      const rest = clean(raw).replace(/^(give me|make it|bring me|i need)\s*/i, "").trim() || "it";
      return /^make it/i.test(clean(raw))
        ? "Could you make it " + rest.toLowerCase() + ", please?"
        : "Could I have " + rest.toLowerCase() + ", please?";
    }
  },
  missingThe: {
    test: t => new RegExp("\\b(where is|how do i get to|how to get to|where's) (" + PLACES + ")\\b").test(t),
    sugg: "Add 'the': 'Where is the museum?'",
    tip: "Tempat umum tertentu memakai 'the' — 'the museum', 'the station'.",
    fix: raw => cap(raw.replace(new RegExp("\\b(where is|how do i get to|how to get to|where's) (" + PLACES + ")\\b", "i"), (m, a, b) => a + " the " + b))
  },
  missingPolite: {
    test: t => !/\b(excuse me|could you|can you|would you|may i|sorry)\b/.test(t),
    sugg: "Try a polite opener: 'Excuse me, could you tell me how to get to the museum?'",
    tip: "Saat bertanya arah, awali dengan 'Excuse me' atau 'Could you ...'.",
    fix: raw => {
      const place = (clean(raw).toLowerCase().replace(/^(where is|where's|how do i get to|i want to go to|go to)\s*/i, "").trim() || "the museum");
      return "Excuse me, could you tell me how to get to " + (/^the\b/.test(place) ? place : "the " + place) + ", please?";
    }
  },
  missingWill: {
    test: t => /\b(today|now) i (talk|tell|explain|present) about\b/.test(t) || /\bi talk about\b/.test(t),
    sugg: "Try: 'Today I will talk about my hobby.'",
    tip: "Presentasi yang baru akan dimulai memakai 'will' — 'Today I will talk about ...'.",
    fix: raw => cap(raw.replace(/\bi (talk|tell|explain|present)\b/i, (m, v) => "I will " + v.toLowerCase()))
  },
  missingFirst: {
    test: t => !/\b(first|firstly|to begin|to start)\b/.test(t),
    sugg: "Signal your structure: 'First, I will explain why I started this hobby.'",
    tip: "Kata penanda seperti 'First' membantu pendengar mengikuti alur presentasimu.",
    fix: raw => "First, " + clean(raw).replace(/^./, c => c.toLowerCase()) + "."
  },
  missingNext: {
    test: t => !/\b(next|then|second|secondly|after that|another)\b/.test(t),
    sugg: "Link your points: 'Next, I want to show how I practice at home.'",
    tip: "Gunakan 'Next' atau 'Then' untuk menyambung poin berikutnya.",
    fix: raw => "Next, " + clean(raw).replace(/^./, c => c.toLowerCase()) + "."
  },
  missingConclusion: {
    test: t => !/\b(in conclusion|to conclude|to sum up|that is all|thats all|thank you for listening)\b/.test(t),
    sugg: "Close it strongly: 'In conclusion, that is my hobby. Thank you for listening!'",
    tip: "Penutup presentasi memakai 'In conclusion ...' lalu ucapan terima kasih.",
    fix: raw => "In conclusion, " + clean(raw).replace(/^./, c => c.toLowerCase()) + ". Thank you for listening!"
  },
  strengthAgree: {
    test: t => /\bmy strength are\b/.test(t) || /\bmy strengths is\b/.test(t) || /\bmy strength is are\b/.test(t),
    sugg: "Use 'My strengths are ...' for more than one, or 'My strength is ...' for just one.",
    tip: "Subjek jamak ('strengths') dipasangkan dengan 'are'; tunggal ('strength') dengan 'is'.",
    fix: raw => cap(raw.replace(/\bmy strength are\b/i, "My strengths are").replace(/\bmy strengths is\b/i, "My strengths are"))
  },
  missingAmAvail: {
    test: t => /\bi available\b/.test(t) || /\bi ready\b/.test(t),
    sugg: "Add 'am': 'I am available on weekends.'",
    tip: "Kata sifat setelah 'I' butuh 'am' — 'I am available'.",
    fix: raw => cap(raw.replace(/\bi (available|ready)\b/i, (m, w) => "I am " + w.toLowerCase()))
  },
  doubleModal: {
    test: t => /\bwill to \w+/.test(t) || /\b(hope|want|plan) to will\b/.test(t) || /\bi will can\b/.test(t),
    sugg: "Try: 'I hope to improve' or 'I will improve' — no need to combine both.",
    tip: "'will' dan 'to' tidak dipakai bersamaan sebelum kata kerja.",
    fix: raw => cap(raw
      .replace(/\bi (hope|think|know|believe) i will to\b/i, (m, v) => "I " + v.toLowerCase() + " to")
      .replace(/\bwill to\b/i, "will")
      .replace(/\b(hope|want|plan) to will\b/i, (m, v) => v.toLowerCase() + " to")
      .replace(/\bi will can\b/i, "I can"))
  },
  pastWork: {
    test: t => /\bi (work|join|help|make|do) (with|in|on|at|a|my|the)\b/.test(t),
    sugg: "Use past tense: 'I worked with my classmates on a school project.'",
    tip: "Menceritakan pengalaman yang sudah lewat memakai bentuk lampau: work → worked.",
    fix: raw => cap(raw.replace(/\bi work\b/i, "I worked").replace(/\bi join\b/i, "I joined").replace(/\bi help\b/i, "I helped").replace(/\bi make\b/i, "I made").replace(/\bi do\b/i, "I did"))
  },
  pastWas: {
    test: t => /\b(it is|it's|the food is|everything is) (good|nice|great|delicious|okay|ok)\b/.test(t),
    sugg: "Talking about last time? Use 'It was really good, thank you.'",
    tip: "Pengalaman di masa lalu memakai 'was', bukan 'is'.",
    fix: raw => cap(raw.replace(/\bit is\b/i, "It was").replace(/\bit's\b/i, "It was").replace(/\bthe food is\b/i, "The food was").replace(/\beverything is\b/i, "Everything was"))
  },
  missingWould: {
    test: t => /\bi say\b/.test(t) && !/\bi would say\b/.test(t),
    sugg: "Try: 'I would say hello and ask for their name.'",
    tip: "Untuk situasi pengandaian, gunakan 'I would ...'.",
    fix: raw => cap(raw.replace(/\bi say\b/i, "I would say"))
  },
  noFuturePlan: {
    test: t => !/\b(hope|will|plan|want|would like|going to|dream)\b/.test(t),
    sugg: "Try a future sentence: 'In five years, I hope to study abroad.'",
    tip: "Rencana masa depan memakai 'hope to', 'plan to', atau 'will'.",
    fix: raw => "In five years, I hope to " + clean(raw).replace(/^./, c => c.toLowerCase()) + "."
  },
  needFullOrder: {
    test: t => !/\b(i would like|can i have|could i have|i'll have|may i have)\b/.test(t),
    sugg: "Use an ordering phrase: 'Can I have a bowl of soup, please?'",
    tip: "Frasa 'I would like' atau 'Can I have' adalah cara standar memesan makanan.",
    fix: raw => "I would like " + clean(raw).replace(/^./, c => c.toLowerCase()) + ", please."
  }
};

/* ---------- sesi percakapan ---------- */
function startSession(scenarioId, level){
  const scen = byId(scenarioId);
  const steps = scen.levels[level].steps;
  state.session = {
    scenarioId, level,
    idx: 0,                 // giliran yang sedang ditanyakan
    total: steps.length,
    messages: [],
    corrections: [],
    vocabUsed: [],
    spoken: [],
    answered: 0,
    errorCount: 0,
    finished: false,
    vocabOpen: false,
    startedAt: Date.now()
  };
  state.page = "chat";
  render();
  aiSay(steps[0].ai, true);
}

function aiSay(text, withTyping){
  const s = state.session;
  if (!s) return;
  if (!withTyping){
    s.messages.push({ role:"ai", text });
    renderChat();
    speak(text);
    return;
  }
  state.busy = true;
  renderChat(true);
  setTimeout(() => {
    state.busy = false;
    if (state.session !== s || s.finished){ renderChat(); return; }
    s.messages.push({ role:"ai", text });
    renderChat(true);
    speak(text);
  }, 950);
}

function trackVocab(text){
  const s = state.session, scen = byId(s.scenarioId), t = norm(text);
  scen.vocab.forEach(v => {
    const forms = [v.en].concat(v.alt || []);
    if (forms.some(f => t.indexOf(norm(f).trim()) !== -1) && s.vocabUsed.indexOf(v.en) === -1){
      s.vocabUsed.push(v.en);
    }
  });
}

function evaluate(raw, step){
  const t = norm(raw);
  const flat = raw.toLowerCase().replace(/[^a-z' ]/g, "").replace(/\s+/g, " ").trim();
  for (const e of (step.errors || [])){
    const rule = RULES[e.r];
    if (!rule) continue;
    let hit;
    if (e.r === "tooShort") hit = words(raw) > 0 && words(raw) < (e.n || 4);
    else hit = !!rule.test(t, flat);
    if (hit){
      let better = null;
      try { better = e.better || (rule.fix ? rule.fix(raw) : null); } catch (_) { better = null; }
      if (better && !/[.!?]$/.test(better)) better += ".";
      return {
        kind: "fix",
        original: raw,
        sugg: e.sugg || rule.sugg,
        tip: e.tip || rule.tip,
        better: better || null
      };
    }
  }
  const matched = (step.expect || []).some(k => t.indexOf(" " + norm(k).trim()) !== -1 || t.indexOf(norm(k).trim()) !== -1);
  return { kind: matched ? "praise" : "fallback" };
}

function sendAnswer(raw){
  const s = state.session;
  if (!s || s.finished || state.busy) return;
  const text = String(raw || "").trim();
  if (!text) return;
  const scen = byId(s.scenarioId);
  const steps = scen.levels[s.level].steps;
  const step = steps[Math.min(s.idx, steps.length - 1)];

  const msg = { role:"me", text };
  s.messages.push(msg);
  s.answered++;
  trackVocab(text);

  const res = evaluate(text, step);
  if (res.kind === "fix"){
    s.errorCount++;
    const fix = { original: res.original, sugg: res.sugg, tip: res.tip, better: res.better, revealed: false, id: "fx" + Date.now() + Math.random().toString(36).slice(2, 6) };
    s.messages.push({ role:"fix", fix });
    s.corrections.push(fix);
  }
  s.idx++;

  const lead = res.kind === "fix"
    ? "Thanks for trying! Small fix above — you're doing great."
    : res.kind === "praise"
      ? PRAISE[Math.floor(Math.random() * PRAISE.length)]
      : (step.fallback || "Thanks for sharing! Let's keep going.");

  const next = steps[s.idx];
  if (next){
    aiSay(lead + "\n\n" + next.ai, true);
  } else {
    aiSay(lead + "\n\n" + scen.levels[s.level].closing, true);
    setTimeout(() => {
      if (state.session === s && !s.finished){
        s.messages.push({ role:"note", text:"Percakapan selesai 🎉 Lihat skor dan ringkasan latihanmu." });
        renderChat();
      }
    }, 1150);
  }
  renderChat(true);
}

function finishSession(){
  const s = state.session;
  if (!s) return;
  const scen = byId(s.scenarioId);
  const vocabTotal = scen.vocab.length;
  const completion = s.total > 0 ? 45 * (Math.min(s.answered, s.total) / s.total) : 0;
  const vocabPart = vocabTotal > 0 ? 25 * (s.vocabUsed.length / vocabTotal) : 0;
  const accuracy = Math.max(10, 30 - s.errorCount * 6);
  let score = s.answered === 0 ? 0 : Math.round(completion + vocabPart + accuracy);
  if (!isFinite(score) || isNaN(score)) score = 0;
  score = Math.max(0, Math.min(100, score));

  const record = {
    scenarioId: s.scenarioId, level: s.level, score,
    answered: s.answered, total: s.total,
    parts: {
      completion: Math.round(completion), completionMax: 45,
      vocab: Math.round(vocabPart), vocabMax: 25,
      accuracy: Math.round(accuracy), accuracyMax: 30
    },
    corrections: s.corrections.slice(),
    spoken: s.spoken.length,
    vocabUsed: s.vocabUsed.slice(),
    vocabMissed: scen.vocab.filter(v => s.vocabUsed.indexOf(v.en) === -1),
    at: new Date()
  };
  s.finished = true;
  state.voice.msg = "";
  state.summary = record;
  state.history.unshift(record);
  state.session = null;
  state.busy = false;
  go("summary");
}

function viewChat(){
  const s = state.session;
  if (!s) return `<div class="card">Belum ada percakapan yang berjalan. <button class="btn ghost" data-go="setup" style="margin-left:8px">Pilih Situasi</button></div>`;
  const scen = byId(s.scenarioId);
  const cur = Math.min(s.idx + 1, s.total);
  const pct = Math.max(4, Math.round((Math.min(s.answered, s.total) / s.total) * 100));
  const spokenNow = s.spoken.indexOf(Math.min(s.idx, s.total - 1)) !== -1;

  return `
  <div class="chat-shell">
    <div class="chat-head">
      <div class="line1">
        <span style="font-size:1.5rem">${scen.emoji}</span>
        <h2>${scen.title}</h2>
        <span class="pill">${LEVEL_NAME[s.level]}</span>
        <span class="pill sim">Simulasi Respons AI</span>
        <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
          ${TTS_OK ? `<button class="btn ghost small" style="padding:8px 12px" data-tts aria-pressed="${state.voice.ttsOn}">${state.voice.ttsOn ? "🔊 Suara AI: Aktif" : "🔇 Suara AI: Mati"}</button>` : ""}
          <button class="btn ghost small" style="padding:8px 12px" data-vocab>${s.vocabOpen ? "Tutup" : "Buka"} Kosakata</button>
        </span>
      </div>
      <div>
        <div class="small muted" style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span>Percakapan ${cur} dari ${s.total}</span>
          <span>${s.vocabUsed.length}/${scen.vocab.length} kosakata kunci dipakai</span>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>
      <div class="vocab-panel" ${s.vocabOpen ? "" : "hidden"}>
        <div class="small"><b>Kosakata kunci — ${scen.title}</b></div>
        <div class="vocab-list">
          ${scen.vocab.map((v, i) => {
            const used = s.vocabUsed.indexOf(v.en) !== -1;
            return `<div class="vocab-item ${used ? "used" : ""}"><span class="mark">${used ? "✓" : "•"}</span><span><b>${v.en}</b> — <span class="muted">${v.id}</span> ${TTS_OK ? `<button class="speak-btn mini" data-say-vocab="${i}" title="Dengarkan pelafalannya">🔊</button>` : ""}</span></div>`;
          }).join("")}
        </div>
      </div>
    </div>

    <div class="msgs" id="msgs">
      <div class="sysnote">${scen.context}</div>
      ${s.messages.map((m, i) => msgHTML(m, i)).join("")}
      ${state.busy ? `<div class="typing" aria-label="AI sedang mengetik"><i></i><i></i><i></i></div>` : ""}
      ${s.idx >= s.total && !state.busy ? `<div class="sysnote">Semua giliran percakapan selesai. Klik <b>Selesai Latihan</b> untuk melihat skormu.</div>` : ""}
    </div>

    <div class="composer">
      <div class="in">
        <textarea id="answer" rows="2" placeholder="${s.idx >= s.total ? "Percakapan sudah selesai — klik Selesai Latihan" : state.voice.listening ? "Sedang mendengarkan… bicara dalam bahasa Inggris" : "Bicara dengan 🎤 atau ketik jawabanmu dalam bahasa Inggris..."}" ${s.idx >= s.total || state.busy ? "disabled" : ""}></textarea>
        <span class="in-btns">
          <button class="btn mic" data-mic aria-pressed="${state.voice.listening}" title="${ASR_OK ? "Jawab dengan suara" : "Input suara tidak tersedia di browser ini"}" ${s.idx >= s.total || state.busy ? "disabled" : ""}>${state.voice.listening ? "⏹" : "🎤"}</button>
          <button class="btn" data-send ${s.idx >= s.total || state.busy ? "disabled" : ""}>Kirim</button>
        </span>
      </div>
      <div class="voice-note ${state.voice.msg ? "warn-line" : ""}">
        ${state.voice.msg
          ? "⚠️ " + esc(state.voice.msg) + (state.voice.blocked ? ` <button class="btn-fix" data-go="about">Cara memakai mikrofon →</button>` : "")
          : state.voice.listening
            ? "🎙️ <b>Mendengarkan…</b> bicara dalam bahasa Inggris, lalu tekan ⏹ untuk berhenti. Hasilnya muncul di kolom jawaban supaya bisa kamu periksa dulu."
            : (ASR_OK ? "🎤 Tekan mikrofon untuk menjawab dengan suara" : "🎤 Input suara butuh Chrome/Edge — di browser ini kamu bisa mengetik") + " · 🔊 Dengarkan untuk menirukan kalimat AI · Enter untuk mengirim"}
      </div>
      <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
        <span class="row" style="gap:9px;align-items:center">
          <button class="btn ghost" style="padding:9px 14px" data-spoken aria-pressed="${spokenNow}" ${s.idx >= s.total ? "disabled" : ""}>${spokenNow ? "✅ Sudah kuucapkan" : "🗣️ Aku ucapkan dulu"}</button>
          <span class="small muted">${s.spoken.length}/${s.total} kalimat kamu ucapkan keras-keras</span>
        </span>
        <button class="btn gold" data-finish>Selesai Latihan</button>
      </div>
    </div>
  </div>`;
}

function msgHTML(m, i){
  if (m.role === "ai") return `<div class="msg ai"><span class="who">AI Partner</span><div class="bubble">${esc(m.text)}</div>${TTS_OK ? `<span class="row" style="gap:6px"><button class="speak-btn" data-say-msg="${i}">🔊 Dengarkan</button><button class="speak-btn" data-say-msg="${i}" data-slow="1">🐢 Pelan</button></span>` : ""}</div>`;
  if (m.role === "me") return `<div class="msg me"><span class="who">Kamu</span><div class="bubble">${esc(m.text)}</div>${TTS_OK ? `<button class="speak-btn" data-say-text="${esc(m.text)}" title="Dengar bagaimana kalimatmu diucapkan">🔊 Ucapkan kalimatku</button>` : ""}</div>`;
  if (m.role === "note") return `<div class="sysnote">${esc(m.text)}</div>`;
  if (m.role === "fix"){
    const f = m.fix;
    return `<div class="fixcard">
      <div class="hd">💡 Kartu Koreksi — santai, ini bagian dari belajar</div>
      <div class="rowline"><span class="lbl">Kalimatmu</span><span class="val strike">${esc(f.original)}</span></div>
      <div class="rowline"><span class="lbl">Saran</span><span class="val good">${esc(f.sugg)}</span></div>
      <div class="tip">${esc(f.tip)}</div>
      ${f.better ? (f.revealed
        ? `<div class="better"><b>Versi yang lebih baik</b>${esc(f.better)}${TTS_OK ? ` <button class="speak-btn mini" data-say-text="${esc(f.better)}" title="Dengarkan lalu tirukan">🔊</button>` : ""}</div>`
        : `<button class="btn-fix" data-better="${f.id}">✨ Coba Kalimat yang Lebih Baik</button>`) : ""}
    </div>`;
  }
  return "";
}

function viewSummary(){
  const r = state.summary;
  if (!r) return `<div class="card">Belum ada sesi yang selesai. <button class="btn ghost" data-go="setup" style="margin-left:8px">Mulai Latihan</button></div>`;
  const scen = byId(r.scenarioId);
  const band = r.score >= 85 ? { t:"Luar biasa!", d:"Kalimatmu jelas dan percaya diri. Coba level yang lebih tinggi!" }
    : r.score >= 70 ? { t:"Bagus sekali!", d:"Kamu sudah nyaman berbicara. Perbanyak kosakata kunci di sesi berikutnya." }
    : r.score >= 55 ? { t:"Terus berlatih!", d:"Alurnya sudah jalan. Baca lagi kartu koreksinya, lalu ulangi situasi ini." }
    : { t:"Awal yang baik!", d:"Setiap orang mulai dari sini. Coba jawab semua giliran percakapan di sesi berikutnya." };

  return `
  <div class="stack">
    <section class="card">
      <span class="eyebrow">Ringkasan Latihan</span>
      <h2 style="font-size:1.5rem;margin:6px 0 18px">${scen.emoji} ${scen.title} · ${LEVEL_NAME[r.level]}</h2>
      <div class="score-wrap">
        <div class="ring" style="--p:${r.score}"><div class="in"><div><div class="num">${r.score}</div><div class="of">DARI 100</div></div></div></div>
        <div class="breakdown">
          <h3 style="font-size:1.25rem">${band.t}</h3>
          <p class="small muted" style="margin-bottom:6px">${band.d}</p>
          ${bdRow("Kelengkapan menjawab", r.parts.completion, r.parts.completionMax, `${r.answered} dari ${r.total} giliran dijawab`)}
          ${bdRow("Kosakata kunci dipakai", r.parts.vocab, r.parts.vocabMax, `${r.vocabUsed.length} dari ${r.vocabUsed.length + r.vocabMissed.length} kosakata`)}
          ${bdRow("Ketepatan kalimat", r.parts.accuracy, r.parts.accuracyMax, `${r.corrections.length} kartu koreksi muncul · nilai dasar tetap diberikan`)}
        </div>
      </div>
      <div class="preview" style="margin-top:18px;border-style:solid">
        <div class="row" style="align-items:center;gap:12px">
          <span style="font-size:1.6rem">🗣️</span>
          <div>
            <div><b>Latihan mengucapkan: ${r.spoken || 0} dari ${r.total} kalimat</b></div>
            <p class="small muted">Ini kamu tandai sendiri, jadi tidak masuk hitungan skor — aplikasi belum bisa mendengar dan menilai pelafalanmu. Yang penting: kalimat yang diucapkan keras-keras jauh lebih cepat melekat daripada yang hanya diketik.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <span class="eyebrow">Ringkasan Kesalahan</span>
      <h3 style="font-size:1.2rem;margin:6px 0 12px">Yang bisa kamu rapikan</h3>
      ${r.corrections.length === 0
        ? `<p class="small muted">Tidak ada kartu koreksi di sesi ini. Kalimatmu sudah sesuai pola yang dikenali sistem — mantap! 🎉</p>`
        : `<div class="stack" style="gap:10px">${r.corrections.map(f => `
            <div class="fixcard">
              <div class="rowline"><span class="lbl">Kalimatmu</span><span class="val strike">${esc(f.original)}</span></div>
              <div class="rowline"><span class="lbl">Saran</span><span class="val good">${esc(f.sugg)}</span></div>
              ${f.better ? `<div class="better"><b>Versi yang lebih baik</b>${esc(f.better)}</div>` : ""}
              <div class="tip">${esc(f.tip)}</div>
            </div>`).join("")}</div>`}
    </section>

    <section class="card">
      <span class="eyebrow">Rekomendasi Kosakata</span>
      <h3 style="font-size:1.2rem;margin:6px 0 12px">Coba pakai ini di latihan berikutnya</h3>
      ${r.vocabMissed.length === 0
        ? `<p class="small muted">Kamu memakai semua kosakata kunci situasi ini. Luar biasa! Coba situasi lain atau naikkan levelnya.</p>`
        : `<div class="vocab-chips">${r.vocabMissed.map(v => `<span class="chip"><b>${v.en}</b> <span>· ${v.id}</span></span>`).join("")}</div>`}
      ${r.vocabUsed.length ? `<p class="small muted" style="margin-top:12px">Sudah kamu pakai: ${r.vocabUsed.map(v => `<b>${esc(v)}</b>`).join(", ")}.</p>` : ""}
    </section>

    <div class="row">
      <button class="btn" data-go="setup">Latihan Situasi Lain</button>
      <button class="btn ghost" data-again>Ulangi Situasi Ini</button>
      <button class="btn ghost" data-go="history">Lihat Riwayat Latihan</button>
    </div>
  </div>`;
}

function bdRow(label, val, max, note){
  const pct = max > 0 ? Math.round((val / max) * 100) : 0;
  return `<div class="bd-row">
    <span>${label} <span class="muted small">· ${note}</span></span>
    <span class="v">${val}/${max}</span>
    <span class="bd-bar"><i style="width:${pct}%"></i></span>
  </div>`;
}

function viewHistory(){
  return `
  <div class="stack">
    <div>
      <span class="eyebrow">Riwayat Latihan</span>
      <h2 style="font-size:1.5rem;margin-top:4px">Sesi yang sudah kamu selesaikan</h2>
      <p class="small muted" style="margin-top:6px">Riwayat disimpan sementara di browser selama sesi ini berlangsung. Tidak ada data pribadi yang disimpan, dan riwayat akan kosong lagi jika halaman dimuat ulang.</p>
    </div>
    ${state.history.length === 0
      ? `<div class="card"><p class="small muted">Belum ada sesi yang selesai. Setelah kamu menyelesaikan satu latihan, hasilnya akan muncul di sini.</p>
         <div class="row" style="margin-top:12px"><button class="btn" data-go="setup">Mulai Latihan</button></div></div>`
      : `<div class="hist">${state.history.map((r, i) => {
          const scen = byId(r.scenarioId);
          const jam = r.at.toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" });
          return `<div class="hist-item">
            <span class="em">${scen.emoji}</span>
            <span><b>${scen.title}</b><br><span class="small muted">${LEVEL_NAME[r.level]} · ${r.answered}/${r.total} giliran · ${r.corrections.length} koreksi · 🗣️ ${r.spoken || 0} diucapkan · ${jam}</span></span>
            <span class="sc">${r.score}</span>
          </div>`;
        }).join("")}</div>
        <div class="row"><button class="btn" data-go="setup">Latihan Lagi</button></div>`}
  </div>`;
}

      <p class="small">Aplikasi ini bernama <b>Speaking</b> Partner, jadi latihannya tidak berhenti di mengetik. Dua fitur suara memakai <b>Web Speech API bawaan browser</b> — bukan model AI, tanpa API key, dan tanpa mengirim rekaman ke server kami:</p>
      <ul class="clean" style="margin-top:10px">

        <li><b>🎤 Kamu berbicara</b> (speech-to-text) — tekan mikrofon, ucapkan jawabanmu, browser mengubahnya menjadi teks di kolom jawaban untuk kamu periksa dulu. <b>Hanya berjalan bila aplikasi dibuka di luar tampilan pratinjau</b> — lihat kotak di bawah.</li>
      </ul>
      <div class="warn" style="margin-top:14px"><b>Batasnya jujur:</b> aplikasi <b>belum menilai pelafalan</b> — suara diubah menjadi teks, lalu teks itulah yang dinilai. Penandaan “sudah kuucapkan” tidak masuk hitungan skor karena tidak bisa diverifikasi. Penilaian pelafalan adalah rencana pengembangan berikutnya.</div>
    </section>

    <section class="card">
      <span class="eyebrow">Kalau Mikrofon Tidak Mau Jalan</span>
      <h3 style="font-size:1.2rem;margin:6px 0 12px">Penyebab utamanya bukan di perangkatmu</h3>
      <p class="small">Aplikasi ini ditampilkan di dalam <b>kotak aman (sandbox)</b> milik platform tempat ia dipublikasikan. Sandbox itu memblokir akses mikrofon untuk semua halaman yang dimuat di dalamnya, dan halaman di dalam sandbox <b>tidak bisa meminta izin itu sendiri</b> — sekalipun izin mikrofon di laptop, HP, dan browser sudah kamu berikan. Jadi kalau tombol 🎤 menolak di sini, itu batas platform, bukan kesalahan perangkatmu.</p>
      <p class="small" style="margin-top:10px"><b>Cara memakai mikrofon sungguhan:</b></p>
      <ol class="clean" style="margin-top:8px">
        <li><b>Unduh berkas aplikasinya</b> (file <code>.html</code>), lalu buka dengan Chrome atau Edge langsung dari komputermu. Saat tombol 🎤 ditekan, browser akan menampilkan permintaan izin mikrofon yang sebenarnya — pilih <i>Allow</i>.</li>
        <li>Kalau membuka berkas langsung masih ditolak, jalankan lewat server lokal: buka folder berkas itu di Terminal/Command Prompt, ketik <code>python -m http.server 8000</code>, lalu buka <code>http://localhost:8000</code> di Chrome. Cara ini paling dapat diandalkan karena <code>localhost</code> dianggap alamat aman oleh browser.</li>
        <li>Atau unggah berkas ke hosting statis milik sekolah/pribadi (mis. GitHub Pages) — asalkan alamatnya <code>https://</code>, mikrofon akan berfungsi normal.</li>
      </ol>
      <p class="small muted" style="margin-top:12px">Pemeriksaan tambahan bila sudah di luar sandbox tetapi mikrofon tetap diam: pakai Chrome/Edge (Firefox dan Safari belum mendukung pengenalan suara ini) · klik ikon gembok di sebelah alamat web → <i>Site settings</i> → <i>Microphone</i> → <i>Allow</i> · tutup aplikasi lain yang memakai mikrofon (Zoom, Meet, perekam suara) · cek <i>Settings → Privacy &amp; security → Microphone</i> di Windows atau <i>System Settings → Privacy &amp; Security → Microphone</i> di macOS.</p>
      <p class="small muted" style="margin-top:10px">Aplikasi meminta izin lewat <code>getUserMedia</code> lebih dulu sebelum menyalakan pengenalan suara, supaya pesan yang muncul menyebut penyebab yang tepat — bukan sekadar “gagal”. Tanpa mikrofon pun, seluruh latihan tetap berjalan penuh: AI tetap berbicara, kamu menirukan, lalu mengetik jawabanmu, dan skornya dihitung sama.</p>

    <section class="card">
      <span class="eyebrow">Bagaimana “AI” di aplikasi ini bekerja</span>
      <h3 style="font-size:1.2rem;margin:6px 0 12px">Simulasi yang jujur</h3>
      <p class="small">Aplikasi ini berjalan sendiri di browser, tanpa backend dan tanpa API key. Karena itu respons “AI” adalah <b>simulasi</b>: setiap jawaban siswa dicocokkan dengan daftar pola kesalahan umum dan kata kunci yang sudah disiapkan siswa untuk situasi tersebut. Hasilnya salah satu dari tiga kemungkinan:</p>
      <ul class="clean" style="margin-top:10px">
        <li><b>Apresiasi</b> — jawaban mengandung kata kunci yang diharapkan dan tidak cocok dengan pola kesalahan mana pun.</li>
        <li><b>Kartu koreksi</b> — jawaban cocok dengan salah satu pola kesalahan (misalnya “Name is ...” tanpa “My”). Kartu berisi kalimat asli, saran perbaikan, penjelasan singkat, dan tombol “Coba Kalimat yang Lebih Baik”.</li>
        <li><b>Dorongan</b> — pola tidak dikenali sama sekali; aplikasi tetap merespons dengan kalimat dorongan yang relevan dengan situasi, lalu melanjutkan percakapan.</li>
      </ul>
      <div class="warn" style="margin-top:14px"><b>Versi produksi:</b> untuk pemahaman bahasa yang benar-benar alami, aplikasi ini perlu dihubungkan ke model AI melalui <b>backend yang aman</b>. API key tidak boleh pernah disimpan atau ditampilkan di sisi frontend. System prompt di atas adalah instruksi yang akan dipakai apabila API sungguhan dihubungkan.</div>
    </section>

/* =========================================================
   RENDER + EVENT
   ========================================================= */
function render(){
  renderNav();
  const app = $("#app");
  let html = "";
  switch (state.page){
    case "setup": html = viewSetup(); break;
    case "chat": html = viewChat(); break;
    case "summary": html = viewSummary(); break;
    case "history": html = viewHistory(); break;
    case "about": html = viewAbout(); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
  if (state.page === "chat") scrollMsgs();
}

function renderChat(keepFocus){
  if (state.page !== "chat") return;
  const val = $("#answer") ? $("#answer").value : "";
  $("#app").innerHTML = viewChat();
  const ta = $("#answer");
  if (ta && !ta.disabled){ ta.value = val; if (keepFocus) ta.focus(); }
  scrollMsgs();
}

function scrollMsgs(){
  const box = $("#msgs");
  if (box) box.scrollTop = box.scrollHeight;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-nav],[data-go],[data-level],[data-scen],[data-start],[data-send],[data-finish],[data-vocab],[data-better],[data-again],[data-resume],[data-drop],[data-tts],[data-mic],[data-spoken],[data-say-msg],[data-say-vocab],[data-say-text]");
  if (!t) return;

  if (t.hasAttribute("data-mic")) return micToggle();
  if (t.hasAttribute("data-open-tab")){
    try { window.open(window.location.href, "_blank", "noopener"); } catch (err) {}
    return;
  }
  if (t.hasAttribute("data-tts")){
    state.voice.ttsOn = !state.voice.ttsOn;
    if (!state.voice.ttsOn) hush();
    return renderChat();
  }
  if (t.dataset.sayMsg !== undefined){
    const s = state.session;
    const m = s && s.messages[+t.dataset.sayMsg];
    if (m && m.role === "ai") speak(m.text, true, t.dataset.slow === "1");
    return;
  }
  if (t.hasAttribute("data-spoken")){
    const s = state.session;
    if (!s) return;
    const turn = Math.min(s.idx, s.total - 1);
    const at = s.spoken.indexOf(turn);
    if (at === -1) s.spoken.push(turn); else s.spoken.splice(at, 1);
    return renderChat(true);
  }
  if (t.dataset.sayVocab !== undefined){
    const s = state.session;
    if (!s) return;
    const v = byId(s.scenarioId).vocab[+t.dataset.sayVocab];
    if (v) speak(v.en, true);
    return;
  }
  if (t.dataset.sayText !== undefined) return speak(t.dataset.sayText, true);

  if (t.dataset.nav !== undefined) return go(t.dataset.nav);
  if (t.dataset.go !== undefined) return go(t.dataset.go);

  if (t.dataset.level !== undefined){ state.pick.level = t.dataset.level; return render(); }
  if (t.dataset.scen !== undefined){ state.pick.scenario = t.dataset.scen; return render(); }

  if (t.hasAttribute("data-start")){
    if (!state.pick.level || !state.pick.scenario) return;
    return startSession(state.pick.scenario, state.pick.level);
  }
  if (t.hasAttribute("data-resume")){ state.page = "chat"; return render(); }
  if (t.hasAttribute("data-drop")){ state.session = null; return render(); }
  if (t.hasAttribute("data-again")){
    if (!state.summary) return go("setup");
    state.pick.level = state.summary.level;
    state.pick.scenario = state.summary.scenarioId;
    return startSession(state.summary.scenarioId, state.summary.level);
  }
  if (t.hasAttribute("data-send")){
    const ta = $("#answer");
    if (!ta) return;
    const v = ta.value; ta.value = "";
    return sendAnswer(v);
  }
  if (t.hasAttribute("data-finish")) return finishSession();
  if (t.hasAttribute("data-vocab")){
    if (state.session){ state.session.vocabOpen = !state.session.vocabOpen; renderChat(); }
    return;
  }
  if (t.dataset.better !== undefined){
    const s = state.session;
    if (!s) return;
    const m = s.messages.find(x => x.role === "fix" && x.fix.id === t.dataset.better);
    if (m){ m.fix.revealed = true; renderChat(); }
    return;
  }
});

document.addEventListener("keydown", e => {
  if (e.target && e.target.id === "answer" && e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    const v = e.target.value; e.target.value = "";
    sendAnswer(v);
  }
});

render();
</script>
