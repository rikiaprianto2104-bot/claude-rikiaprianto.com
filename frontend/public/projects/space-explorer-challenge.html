<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Space Explorer Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* ============ TOKENS — dunia visual tunggal: kokpit misi luar angkasa ============ */
:root{
  --void:#070B1E;      /* latar ruang angkasa */
  --void-2:#040714;
  --hull:#101733;      /* permukaan panel */
  --hull-2:#18224A;    /* panel terangkat */
  --line:#2A3566;      /* garis pemisah */
  --line-soft:#1E2850;
  --ink:#EEF2FF;       /* teks utama (putih berbias biru) */
  --ink-dim:#A6B1D4;   /* teks sekunder */
  --ink-faint:#7A86AD;
  --ion:#57C7FF;       /* biru terang — interaktif */
  --nebula:#A78BFA;    /* ungu — level & aksen kedua */
  --flare:#FF7A2F;     /* oranye — aksi utama & Mars */
  --flare-soft:#FFA76B;
  --go:#3DDC97;        /* benar */
  --go-bg:rgba(61,220,151,.14);
  --hold:#FF6E8A;      /* belum tepat */
  --hold-bg:rgba(255,110,138,.14);
  --amber:#FFC55C;

  --r-s:10px; --r-m:16px; --r-l:22px;
  --shadow:0 18px 44px -20px rgba(0,0,0,.85);
  --wrap:1080px;

  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;

  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}

body{
  margin:0;
  font-family:var(--f-body);
  background:var(--void);
  color:var(--ink);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

#starfield{
  position:fixed; inset:0; width:100%; height:100%;
  z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(167,139,250,.20), transparent 62%),
    radial-gradient(900px 600px at 10% 108%, rgba(87,199,255,.14), transparent 60%),
    linear-gradient(180deg,var(--void-2),var(--void) 42%);
}

#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column}

/* ============ BARIS MISI (nav) ============ */
.mission-bar{
  position:sticky; top:0; z-index:40;
  background:rgba(7,11,30,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.mission-bar-in{
  max-width:var(--wrap); margin:0 auto; padding:12px 18px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.brand-mark{width:34px; height:34px; flex:none}
.brand-text{display:flex; flex-direction:column; line-height:1.1}
.brand-name{font-family:var(--f-display); font-weight:800; font-size:16px; letter-spacing:-.01em}
.brand-sub{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint)}

nav.nav{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; max-width:100%}
nav.nav::-webkit-scrollbar{display:none}
.nav-btn{
  font-family:var(--f-body); font-size:13.5px; font-weight:600;
  color:var(--ink-dim); background:transparent;
  border:1px solid transparent; border-radius:999px;
  padding:8px 14px; cursor:pointer; white-space:nowrap;
  transition:color .15s, background .15s, border-color .15s;
}
.nav-btn:hover{color:var(--ink); background:rgba(87,199,255,.08)}
.nav-btn[aria-current="page"]{color:var(--void); background:var(--ion); border-color:var(--ion)}

:where(button,a,input,[tabindex]):focus-visible{
  outline:3px solid var(--flare); outline-offset:3px; border-radius:6px;
}

/* ============ LAYOUT ============ */
main{flex:1; width:100%; max-width:var(--wrap); margin:0 auto; padding:26px 18px 64px}
.stack{display:flex; flex-direction:column; gap:22px}
.site-foot{
  border-top:1px solid var(--line-soft); padding:20px 18px 30px;
  text-align:center; color:var(--ink-faint); font-size:12.5px;
}

/* ============ TIPOGRAFI ============ */
h1,h2,h3,h4{font-family:var(--f-display); font-weight:800; margin:0; text-wrap:balance; letter-spacing:-.02em; line-height:1.12}
h1{font-size:clamp(32px,6.4vw,54px)}
h2{font-size:clamp(22px,3.4vw,30px)}
h3{font-size:clamp(18px,2.4vw,21px)}
h4{font-size:16px; font-weight:600}
p{margin:0}
.lede{font-size:clamp(15.5px,2vw,18px); color:var(--ink-dim); max-width:60ch}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint); font-size:13px}
.eyebrow{
  font-family:var(--f-mono); font-size:10.5px; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ion);
}

/* ============ KOMPONEN DASAR ============ */
.panel{
  background:linear-gradient(180deg,rgba(24,34,74,.62),rgba(16,23,51,.62));
  border:1px solid var(--line-soft); border-radius:var(--r-l);
  padding:clamp(18px,3vw,28px);
}
.panel-flat{background:rgba(16,23,51,.5); border:1px solid var(--line-soft); border-radius:var(--r-m); padding:16px 18px}

.btn{
  font-family:var(--f-body); font-weight:700; font-size:16px;
  border-radius:999px; border:1px solid transparent; cursor:pointer;
  padding:14px 26px; min-height:52px;
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  transition:transform .12s ease, filter .15s ease, background .15s, color .15s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--flare); color:#1A0A00; box-shadow:0 12px 30px -14px rgba(255,122,47,.9)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ion{background:var(--ion); color:#04121D}
.btn-ion:hover{filter:brightness(1.08)}
.btn-ghost{background:rgba(87,199,255,.08); color:var(--ink); border-color:var(--line)}
.btn-ghost:hover{background:rgba(87,199,255,.16)}
.btn-lg{font-size:18px; padding:17px 34px; min-height:60px}
.btn-sm{font-size:13.5px; padding:9px 16px; min-height:40px}
.btn-row{display:flex; flex-wrap:wrap; gap:12px}

.chip{
  font-family:var(--f-mono); font-size:10.5px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  padding:5px 11px; border-radius:999px; border:1px solid var(--line);
  color:var(--ink-dim); background:rgba(16,23,51,.7); display:inline-block;
}
.chip-easy{color:var(--go); border-color:rgba(61,220,151,.45); background:var(--go-bg)}
.chip-medium{color:var(--ion); border-color:rgba(87,199,255,.45); background:rgba(87,199,255,.13)}
.chip-hard{color:var(--flare-soft); border-color:rgba(255,122,47,.5); background:rgba(255,122,47,.14)}
.chip-tier{color:var(--nebula); border-color:rgba(167,139,250,.45); background:rgba(167,139,250,.13)}
.chip-demo{color:var(--amber); border-color:rgba(255,197,92,.45); background:rgba(255,197,92,.12)}

/* ============ BERANDA ============ */
.hero{
  display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:clamp(20px,4vw,44px); align-items:center;
  padding:clamp(22px,4vw,40px);
  border:1px solid var(--line-soft); border-radius:28px;
  background:
    radial-gradient(700px 380px at 88% 18%, rgba(255,122,47,.13), transparent 66%),
    linear-gradient(180deg,rgba(24,34,74,.68),rgba(11,16,38,.72));
}
.hero-tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.hero h1{margin-bottom:10px}
.hero h1 .glow{
  background:linear-gradient(96deg,var(--ion),var(--nebula) 52%,var(--flare));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-sub{font-family:var(--f-display); font-weight:600; font-size:clamp(16px,2.4vw,21px); color:var(--flare-soft); margin-bottom:14px}
.hero-cta{display:flex; gap:12px; flex-wrap:wrap; margin-top:22px}
.hero-by{margin-top:20px; padding-top:16px; border-top:1px dashed var(--line); font-size:13px; color:var(--ink-faint)}

/* Panggung ilustrasi orisinal: Bumi, Bulan, bintang, Mars, pesawat */
.stage{position:relative; aspect-ratio:1/1; min-height:250px}
.stage svg{position:absolute; inset:0; width:100%; height:100%}
.orbit-ring{transform-box:fill-box; transform-origin:center; animation:spin 46s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.twinkle{animation:tw 3.2s ease-in-out infinite}
.twinkle.d1{animation-delay:.9s} .twinkle.d2{animation-delay:1.8s} .twinkle.d3{animation-delay:2.6s}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

/* NOVA */
.nova-row{display:flex; gap:14px; align-items:flex-start}
.nova-av{width:56px; height:56px; flex:none}
.nova-bubble{
  background:rgba(87,199,255,.10); border:1px solid rgba(87,199,255,.32);
  border-radius:4px 16px 16px 16px; padding:12px 16px; flex:1; min-width:0;
}
.nova-name{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ion); margin-bottom:3px}
.nova-msg{font-size:15px; color:var(--ink)}

/* ============ STRIP LINTASAN ============ */
.traj-wrap{border:1px solid var(--line-soft); border-radius:var(--r-l); background:rgba(11,16,38,.6); padding:18px 20px 14px}
.traj-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:26px}
.traj-stage-name{font-family:var(--f-display); font-weight:600; font-size:15px}
.traj-readout{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:.06em}
.traj-track{position:relative; height:4px; margin:0 30px 8px; background:var(--line-soft); border-radius:4px}
.traj-fill{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,var(--ion),var(--nebula) 55%,var(--flare)); border-radius:4px; transition:width .55s cubic-bezier(.4,0,.2,1)}
.traj-node{position:absolute; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center}
.traj-dot{width:15px; height:15px; border-radius:50%; border:2px solid var(--line); background:var(--void); transition:.35s}
.traj-node.on .traj-dot{border-color:var(--ion); background:var(--ion); box-shadow:0 0 0 5px rgba(87,199,255,.18)}
.traj-node[data-node="mars"].on .traj-dot{border-color:var(--flare); background:var(--flare); box-shadow:0 0 0 5px rgba(255,122,47,.22)}
.traj-label{position:absolute; top:18px; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); white-space:nowrap}
.traj-node.on .traj-label{color:var(--ink-dim)}
.traj-craft{
  position:absolute; top:-24px; width:30px; height:30px;
  transform:translateX(-50%); transition:left .55s cubic-bezier(.4,0,.2,1);
}
.traj-craft svg{width:100%; height:100%; display:block}

/* ============ TELEMETRI ============ */
.telemetry{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.tel{
  background:rgba(16,23,51,.62); border:1px solid var(--line-soft);
  border-radius:var(--r-m); padding:11px 13px; min-width:0;
}
.tel-k{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tel-v{font-family:var(--f-mono); font-weight:700; font-size:19px; font-variant-numeric:tabular-nums; margin-top:2px}
.tel-v small{font-size:12px; color:var(--ink-faint); font-weight:500}
.tel-score .tel-v{color:var(--flare-soft)}
.tel-correct .tel-v{color:var(--go)}

/* ============ KARTU PERTANYAAN ============ */
.qcard{border:1px solid var(--line-soft); border-radius:var(--r-l); background:linear-gradient(180deg,rgba(24,34,74,.66),rgba(16,23,51,.66)); padding:clamp(18px,3.2vw,30px)}
.qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.qnum{font-family:var(--f-mono); font-size:11.5px; letter-spacing:.1em; color:var(--ink-faint)}
.qtext{font-family:var(--f-display); font-weight:600; font-size:clamp(19px,3vw,26px); line-height:1.32; margin-bottom:20px; text-wrap:balance}
.opts{display:flex; flex-direction:column; gap:11px}
.opt{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  font-family:var(--f-body); font-size:16.5px; font-weight:600; color:var(--ink);
  background:rgba(11,16,38,.62); border:1.5px solid var(--line);
  border-radius:var(--r-m); padding:15px 17px; min-height:60px; cursor:pointer;
  transition:border-color .15s, background .15s, transform .12s;
}
.opt:hover:not(:disabled){border-color:var(--ion); background:rgba(87,199,255,.09); transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt-key{
  font-family:var(--f-mono); font-weight:700; font-size:13px; flex:none;
  width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  background:rgba(87,199,255,.13); color:var(--ion); border:1px solid var(--line);
}
.opt-txt{flex:1; min-width:0}
.opt-mark{font-size:19px; flex:none; line-height:1}
.opt.correct{border-color:var(--go); background:var(--go-bg)}
.opt.correct .opt-key{background:var(--go); color:#04180F; border-color:var(--go)}
.opt.wrong{border-color:var(--hold); background:var(--hold-bg)}
.opt.wrong .opt-key{background:var(--hold); color:#2A0710; border-color:var(--hold)}
.opt.dim{opacity:.45}

/* ============ FEEDBACK ============ */
.feedback{margin-top:20px; border-radius:var(--r-m); border:1px solid var(--line); background:rgba(11,16,38,.72); overflow:hidden}
.fb-top{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line-soft)}
.fb-icon{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:19px; flex:none}
.fb-good .fb-icon{background:var(--go-bg); border:1px solid var(--go)}
.fb-bad .fb-icon{background:var(--hold-bg); border:1px solid var(--hold)}
.fb-title{font-family:var(--f-display); font-weight:800; font-size:19px}
.fb-good .fb-title{color:var(--go)} .fb-bad .fb-title{color:var(--hold)}
.fb-pts{margin-left:auto; font-family:var(--f-mono); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums}
.fb-good .fb-pts{color:var(--go)} .fb-bad .fb-pts{color:var(--ink-faint)}
.fb-body{padding:16px 18px; display:flex; flex-direction:column; gap:14px}
.fb-explain{font-size:15.5px; line-height:1.62}
.fb-src{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-faint); line-height:1.55}
.fb-src a{color:var(--ion); text-decoration:none; border-bottom:1px solid rgba(87,199,255,.4); word-break:break-word}
.fb-src a:hover{color:var(--flare-soft); border-color:var(--flare-soft)}
.fb-actions{display:flex; justify-content:flex-end; padding:0 18px 18px}

/* ============ CHECKPOINT ============ */
.cp{text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; padding:clamp(24px,5vw,44px)}
.cp-badge{width:96px; height:96px}
.cp-stats{display:grid; grid-template-columns:repeat(2,minmax(120px,1fr)); gap:12px; width:100%; max-width:420px}
.cp-stat{background:rgba(11,16,38,.62); border:1px solid var(--line-soft); border-radius:var(--r-m); padding:14px}
.cp-stat .k{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint)}
.cp-stat .v{font-family:var(--f-mono); font-weight:700; font-size:24px; font-variant-numeric:tabular-nums; color:var(--flare-soft)}

/* ============ HASIL ============ */
.landing{position:relative; height:150px; margin-bottom:6px}
.landing svg{position:absolute; inset:0; width:100%; height:100%}
.land-craft{animation:land 2.1s cubic-bezier(.35,.9,.35,1) 1 both}
@keyframes land{from{transform:translate(-130px,-72px) rotate(28deg)}to{transform:translate(0,0) rotate(0)}}
.score-hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:stretch}
.score-big{
  border-radius:var(--r-l); border:1px solid rgba(255,122,47,.35); padding:22px;
  background:radial-gradient(420px 200px at 70% 0%, rgba(255,122,47,.18), transparent 70%), rgba(16,23,51,.7);
  display:flex; flex-direction:column; justify-content:center;
}
.score-num{font-family:var(--f-mono); font-weight:700; font-size:clamp(40px,8vw,60px); line-height:1; color:var(--flare); font-variant-numeric:tabular-nums}
.score-num span{font-size:.42em; color:var(--ink-faint)}
.pct-ring{display:flex; align-items:center; gap:16px}
.ring{width:104px; height:104px; flex:none}
.rank-name{font-family:var(--f-display); font-weight:800; font-size:clamp(21px,3.6vw,28px); line-height:1.1}
.rank-easy{color:var(--go)} .rank-mid{color:var(--ion)} .rank-max{color:var(--flare)}
.levels{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.lv{border:1px solid var(--line-soft); border-radius:var(--r-m); background:rgba(11,16,38,.6); padding:15px}
.lv-bar{height:6px; border-radius:6px; background:var(--line-soft); margin-top:10px; overflow:hidden}
.lv-bar i{display:block; height:100%; border-radius:6px}
.lv-e i{background:var(--go)} .lv-m i{background:var(--ion)} .lv-h i{background:var(--flare)}
.lv-v{font-family:var(--f-mono); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums; margin-top:4px}
.two-col{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.tick-list{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.tick-list li{display:flex; gap:9px; font-size:14.5px; line-height:1.5; color:var(--ink-dim)}
.tick-list li b{color:var(--ink); font-weight:600}
.tick{flex:none; font-size:14px}

/* ============ REVIEW ============ */
.filters{display:flex; gap:8px; flex-wrap:wrap}
.fbtn{
  font-family:var(--f-body); font-size:13px; font-weight:600; cursor:pointer;
  background:rgba(16,23,51,.7); color:var(--ink-dim);
  border:1px solid var(--line); border-radius:999px; padding:8px 15px; min-height:38px;
}
.fbtn:hover{color:var(--ink); border-color:var(--ion)}
.fbtn[aria-pressed="true"]{background:var(--ion); color:var(--void); border-color:var(--ion)}
.rv{border:1px solid var(--line-soft); border-left-width:4px; border-radius:var(--r-m); background:rgba(16,23,51,.55); padding:16px 18px; display:flex; flex-direction:column; gap:10px}
.rv.ok{border-left-color:var(--go)}
.rv.no{border-left-color:var(--hold)}
.rv-head{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.rv-q{font-family:var(--f-display); font-weight:600; font-size:17px; line-height:1.35}
.rv-ans{display:flex; flex-direction:column; gap:6px; font-size:14.5px}
.rv-ans div{display:flex; gap:8px; flex-wrap:wrap}
.rv-ans .lbl{font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); min-width:112px; padding-top:3px}
.rv-ans .val{flex:1; min-width:160px}
.val-ok{color:var(--go); font-weight:600}
.val-no{color:var(--hold); font-weight:600}

/* ============ TABEL ============ */
.table-scroll{overflow-x:auto; border:1px solid var(--line-soft); border-radius:var(--r-m)}
table{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px}
th,td{text-align:left; padding:11px 13px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); background:rgba(11,16,38,.75); white-space:nowrap}
tr:last-child td{border-bottom:none}
td.st-ver{color:var(--go); font-weight:600}
td.st-fix{color:var(--amber); font-weight:600}
td.st-chk{color:var(--flare-soft); font-weight:600}

/* ============ PUSAT FAKTA ============ */
.fact-group{display:flex; flex-direction:column; gap:12px}
.fact{border:1px solid var(--line-soft); border-radius:var(--r-m); background:rgba(11,16,38,.55); padding:15px 17px; display:flex; flex-direction:column; gap:7px}
.fact-q{font-family:var(--f-display); font-weight:600; font-size:15.5px}
.fact-a{font-size:14.5px; color:var(--ink-dim); line-height:1.6}
.fact-a b{color:var(--ion); font-weight:700}
.src-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.src-list li{display:flex; flex-direction:column; gap:2px; font-size:14px}
.src-list a{color:var(--ion); text-decoration:none; font-family:var(--f-mono); font-size:12px; word-break:break-all; border-bottom:1px solid rgba(87,199,255,.3)}
.src-list a:hover{color:var(--flare-soft)}
.src-name{font-weight:600}

/* ============ SERTIFIKAT ============ */
.cert{
  border-radius:var(--r-l); padding:clamp(24px,5vw,44px); text-align:center;
  border:2px solid var(--flare);
  background:
    radial-gradient(600px 300px at 50% -10%, rgba(255,122,47,.16), transparent 70%),
    linear-gradient(180deg,rgba(24,34,74,.9),rgba(11,16,38,.94));
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.cert-seal{width:78px; height:78px}
.cert-title{font-family:var(--f-display); font-weight:800; font-size:clamp(23px,4.4vw,34px); color:var(--flare-soft)}
.cert-rule{width:90px; height:2px; background:var(--flare); border-radius:2px}
.cert-for{font-size:15.5px; color:var(--ink-dim); max-width:52ch; line-height:1.65}
.cert-name{font-family:var(--f-display); font-weight:800; font-size:clamp(22px,4vw,30px)}
.cert-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:12px; width:100%; margin-top:6px}
.cert-cell{border:1px solid var(--line); border-radius:var(--r-m); padding:12px; background:rgba(11,16,38,.5)}
.cert-cell .k{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint)}
.cert-cell .v{font-family:var(--f-mono); font-weight:700; font-size:17px; margin-top:3px; font-variant-numeric:tabular-nums}
.cert-foot{font-size:12.5px; color:var(--ink-faint); margin-top:6px; line-height:1.6}

/* ============ MODAL ============ */
.modal-back{position:fixed; inset:0; z-index:80; background:rgba(4,7,20,.78); backdrop-filter:blur(5px); display:grid; place-items:center; padding:20px}
.modal{max-width:430px; width:100%; background:var(--hull); border:1px solid var(--line); border-radius:var(--r-l); padding:26px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px}

/* ============ MISC ============ */
.steps{list-style:none; counter-reset:s; margin:0; padding:0; display:flex; flex-direction:column; gap:11px}
.steps li{counter-increment:s; display:flex; gap:13px; align-items:flex-start; font-size:15.5px; line-height:1.6}
.steps li::before{
  content:counter(s); flex:none; width:28px; height:28px; border-radius:9px;
  background:rgba(87,199,255,.13); color:var(--ion); border:1px solid var(--line);
  font-family:var(--f-mono); font-weight:700; font-size:12.5px; display:grid; place-items:center; margin-top:1px;
}
.bullets{margin:8px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:7px; font-size:15px; color:var(--ink-dim); line-height:1.6}
.bullets li::marker{color:var(--ion)}
.legs{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px}
.leg{border:1px solid var(--line-soft); border-radius:var(--r-m); padding:15px; background:rgba(11,16,38,.5); display:flex; flex-direction:column; gap:7px}
.leg-ic{font-size:24px}
.prompt-box{
  font-family:var(--f-mono); font-size:13px; line-height:1.75; white-space:pre-wrap;
  background:rgba(4,7,20,.72); border:1px solid var(--line); border-left:3px solid var(--nebula);
  border-radius:var(--r-s); padding:15px 17px; overflow-x:auto; color:var(--ink-dim);
}
.prompt-box b{color:var(--nebula); font-weight:700}
.notice{border:1px solid rgba(255,197,92,.42); background:rgba(255,197,92,.09); border-radius:var(--r-m); padding:14px 17px; font-size:14.5px; line-height:1.62; color:var(--ink-dim)}
.notice b{color:var(--amber)}
.divide{height:1px; background:var(--line-soft); border:0; margin:2px 0}
.sec-head{display:flex; flex-direction:column; gap:6px; margin-bottom:4px}

/* ============ RESPONSIF ============ */
@media (max-width:860px){
  .hero{grid-template-columns:1fr; gap:24px}
  .stage{max-width:330px; margin:0 auto; width:100%}
  .score-hero{grid-template-columns:1fr}
}
@media (max-width:620px){
  main{padding:18px 14px 52px}
  .mission-bar-in{padding:10px 14px; gap:10px}
  .brand-sub{display:none}
  .telemetry{grid-template-columns:repeat(2,minmax(0,1fr))}
  .levels{grid-template-columns:1fr}
  .traj-track{margin:0 26px 8px}
  .traj-label{font-size:8.5px}
  .opt{font-size:15.5px; padding:14px 14px; gap:11px}
  .btn{width:100%}
  .btn-row .btn{width:100%}
  .fb-actions .btn{width:100%}
  .rv-ans .lbl{min-width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
}

/* ============ CETAK SERTIFIKAT ============ */
@media print{
  #starfield,.mission-bar,.site-foot,.no-print{display:none !important}
  body{background:#fff !important; color:#111 !important}
  main{padding:0; max-width:none}
  .cert{
    background:#fff !important; border:3px solid #FF7A2F !important;
    color:#111 !important; page-break-inside:avoid;
  }
  .cert *{color:#111 !important}
  .cert-title{color:#C2410C !important}
  .cert-cell{background:#FFF7ED !important; border-color:#FDBA74 !important}
  .cert-foot,.cert-cell .k{color:#57534E !important}
  .cert-rule{background:#FF7A2F !important}
}

    for(var i=0;i<QUESTIONS.length;i++){
      var q = QUESTIONS[i];

      if(!Array.isArray(q.options) || q.options.length !== 4) return "Pertanyaan nomor " + (i+1) + " tidak memiliki tepat empat pilihan.";

      if(!POINTS[q.level]) return "Pertanyaan nomor " + (i+1) + " tidak memiliki tingkat kesulitan yang dikenal.";

    filter:"all"
  };

  function isCorrect(i){ return S.run.answers[i] !== null && S.run.answers[i] === QUESTIONS[i].answer; }
  function answeredCount(){ var n=0; for(var i=0;i<12;i++){ if(S.run.answers[i]!==null) n++; } return n; }
  function correctCount(){ var n=0; for(var i=0;i<12;i++){ if(isCorrect(i)) n++; } return n; }
  function scoreOf(level){
    var t=0;
    for(var i=0;i<12;i++){ if(QUESTIONS[i].level===level && isCorrect(i)) t += POINTS[level]; }
    return t;
  }
  function totalScore(){ return scoreOf("easy") + scoreOf("medium") + scoreOf("hard"); }
  function percent(){ return Math.round(totalScore() / MAX.total * 100); }

  function stageName(done){
    if(done >= 12) return "Pesawat mendarat di Mars";
    if(done >= 8)  return "Melanjutkan perjalanan menuju Mars";
    if(done >= 4)  return "Tiba di Stasiun Bulan";
    return "Bersiap meninggalkan Bumi";
  }
  function trajectory(){
    var done = answeredCount();
    var pos  = done / 12 * 100;
    var html = '<div class="traj-wrap"><div class="traj-head">' +
      '<div class="traj-stage-name">🛰️ ' + esc(stageName(done)) + '</div>' +
      '<div class="traj-readout">JARAK TEMPUH ' + Math.round(pos) + '% · BUMI → BULAN → LUAR ANGKASA → MARS</div>' +
      '</div><div class="traj-track">' +
      '<div class="traj-fill" style="width:' + pos + '%"></div>' +
      '<div class="traj-craft" style="left:' + pos + '%">' + craftSVG() + '</div>';
    NODES.forEach(function(n){
      var on = pos >= n.at - 0.5;
      html += '<div class="traj-node' + (on ? " on" : "") + '" data-node="' + n.id + '" style="left:' + n.at + '%">' +
        '<div class="traj-dot"></div><div class="traj-label">' + esc(n.label) + '</div></div>';
    });
    return html + '</div><div style="height:14px"></div></div>';
  }
  function telemetry(){
    var i = S.run.idx;
    var lv = QUESTIONS[i] ? QUESTIONS[i].level : "easy";
    return '<div class="telemetry">' +
      '<div class="tel"><div class="tel-k">Pertanyaan</div><div class="tel-v">' + (i+1) + '<small> / 12</small></div></div>' +
      '<div class="tel"><div class="tel-k">Level</div><div class="tel-v" style="font-size:15px">' + LEVEL_LABEL[lv] + '</div></div>' +
      '<div class="tel tel-score"><div class="tel-k">Skor</div><div class="tel-v">' + totalScore() + '<small> / 180</small></div></div>' +
      '<div class="tel tel-correct"><div class="tel-k">Benar</div><div class="tel-v">' + correctCount() + '<small> / 12</small></div></div>' +
      '</div>';
  }

  function viewQuiz(){
    var i = S.run.idx;
    var q = QUESTIONS[i];
    if(!q) return viewError("Data pertanyaan tidak ditemukan.");
    var picked = S.run.answers[i];
    var locked = picked !== null;

    var html = '<div class="stack">' + trajectory() + telemetry() + '<div class="qcard">' +
      '<div class="qhead">' +
        '<span class="chip chip-' + q.level + '">' + LEVEL_LABEL[q.level] + ' · ' + POINTS[q.level] + ' poin</span>' +
        '<span class="chip">' + esc(LEVEL_STAGE[q.level]) + '</span>' +
        '<span class="qnum">PERTANYAAN ' + (i+1) + ' DARI 12</span>' +
      '</div>' +
      '<p class="qtext">' + esc(q.q) + '</p>' +
      '<div class="opts" role="group" aria-label="Pilihan jawaban">';

    var keys = ["A","B","C","D"];
    q.options.forEach(function(opt, k){
      var cls = "opt", mark = "";
      if(locked){
        if(k === q.answer){ cls += " correct"; mark = "✓"; }
        else if(k === picked){ cls += " wrong"; mark = "✕"; }
        else { cls += " dim"; }
      }
      html += '<button class="' + cls + '" data-act="answer" data-i="' + k + '"' + (locked ? " disabled" : "") + '>' +
        '<span class="opt-key">' + keys[k] + '</span>' +
        '<span class="opt-txt">' + esc(opt) + '</span>' +
        (mark ? '<span class="opt-mark">' + mark + '</span>' : "") +
        '</button>';
    });
    html += '</div>';

    if(!locked){
      html += '<div style="margin-top:20px">' + novaBlock(q.nova) + '</div>';
    } else {
      var good = picked === q.answer;
      html += '<div class="feedback ' + (good ? "fb-good" : "fb-bad") + '" id="fb">' +
        '<div class="fb-top">' +
          '<div class="fb-icon">' + (good ? "✓" : "!") + '</div>' +
          '<div class="fb-title">' + (good ? "Benar!" : "Belum Tepat") + '</div>' +
          '<div class="fb-pts">' + (good ? "+" + POINTS[q.level] : "+0") + ' poin</div>' +
        '</div>' +
        '<div class="fb-body">' +
          (good ? "" : '<p class="fb-explain" style="color:var(--ink-dim)"><strong style="color:var(--ink)">Jawaban yang tepat: ' + esc(q.options[q.answer]) + '</strong></p>') +
          '<p class="fb-explain">' + esc(q.explain) + '</p>' +
          srcLine(q.src) +
          novaBlock(good
            ? "Bagus! Pesawat maju satu langkah. Fakta ini akan berguna nanti."
            : "Tidak apa-apa. Kita tetap terbang — yang penting kamu sekarang tahu jawabannya.") +
        '</div>' +
        '<div class="fb-actions">' +
          '<button class="btn btn-primary" data-act="next" id="next-btn">' +
            (i === 11 ? "Selesaikan Misi →" : "Lanjutkan →") +
          '</button>' +
        '</div>' +
      '</div>';
    }

    html += '</div>' +
      '<div class="btn-row no-print">' +
        '<button class="btn btn-ghost btn-sm" data-act="ask-restart">↺ Mulai Ulang Misi</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="go" data-view="guide">📖 Lihat Panduan</button>' +
      '</div></div>';
    return html;
  }

  function viewCheckpoint(){
    var n = S.checkpoint;
    var map = {
      1:{lv:"easy",   title:"Persiapan Bumi Selesai!", color:"#3DDC97", glyph:"🌍",
         msg:"Mesin panas, bahan bakar penuh. Empat pertanyaan pertama sudah kita lewati — sekarang kita menuju Stasiun Bulan."},
      2:{lv:"medium", title:"Stasiun Bulan Berhasil Dicapai!", color:"#57C7FF", glyph:"🌕",
         msg:"Kita berhasil sampai di Bulan, tempat Neil Armstrong dulu berjalan. Jalur berikutnya melewati sabuk asteroid — bersiap!"},
      3:{lv:"hard",   title:"Mars Sudah Terlihat!", color:"#FF7A2F", glyph:"🔴",
         msg:"Titik merah itu bukan bintang — itu Mars, dan kita sudah sangat dekat. Waktunya melihat hasil perjalananmu."}
    };
    var c = map[n];
    if(!c) return viewError("Checkpoint tidak dikenal.");
    var r = levelRange(c.lv);
    var benar = 0;
    for(var i = r[0]; i <= r[1]; i++){ if(isCorrect(i)) benar++; }
    return '<div class="stack">' + trajectory() +
      '<section class="panel cp">' +
        badgeSVG(c.color, c.glyph) +
        '<span class="chip chip-' + c.lv + '">Checkpoint ' + n + ' · Level ' + LEVEL_LABEL[c.lv] + '</span>' +
        '<h2>' + esc(c.title) + '</h2>' +

          '<div class="cp-stat"><div class="k">Skor level ini</div><div class="v">' + scoreOf(c.lv) + '<span style="font-size:14px;color:var(--ink-faint)"> / ' + MAX[c.lv] + '</span></div></div>' +
          '<div class="cp-stat"><div class="k">Jawaban benar</div><div class="v">' + benar + '<span style="font-size:14px;color:var(--ink-faint)"> / 4</span></div></div>' +
        '</div>' +
        '<div style="width:100%;max-width:540px;text-align:left">' + novaBlock(c.msg) + '</div>' +
        '<button class="btn btn-primary btn-lg" data-act="cp-continue">' + (n === 3 ? "Lihat Hasil Misi →" : "Lanjutkan Perjalanan →") + '</button>' +
      '</section></div>';

  function viewResult(){
    if(!S.run.finishedAt) return viewEmpty("Misi belum selesai", "Selesaikan 12 pertanyaan dulu untuk melihat hasil akhirmu.");
    var r = rank(), p = percent();
    var benarList = [], belajarList = [];
    for(var i=0;i<12;i++){
      (isCorrect(i) ? benarList : belajarList).push(i);
    }
    function listItems(arr, tick){
      if(!arr.length) return '<li><span class="tick">—</span><span>Tidak ada.</span></li>';
      return arr.map(function(i){
        return '<li><span class="tick">' + tick + '</span><span><b>' + esc(QUESTIONS[i].topic) + '</b> — ' +
          esc(QUESTIONS[i].options[QUESTIONS[i].answer]) + ' <span class="faint">(' + LEVEL_LABEL[QUESTIONS[i].level] + ')</span></span></li>';
      }).join("");
    }
    function lvCard(lv, cls, label){
      var s = scoreOf(lv), m = MAX[lv];
      return '<div class="lv ' + cls + '"><span class="chip chip-' + lv + '">' + label + '</span>' +
        '<div class="lv-v">' + s + '<span style="font-size:13px;color:var(--ink-faint)"> / ' + m + '</span></div>' +
        '<div class="lv-bar"><i style="width:' + (s/m*100) + '%"></i></div></div>';
    }
    return '<div class="stack">' +
      landingSVG() +
      '<div class="sec-head" style="text-align:center;align-items:center">' +
        '<span class="eyebrow">Pendaratan Berhasil</span>' +
        '<h2>Pesawatmu mendarat di Mars 🎉</h2>' +
        '<p class="lede" style="text-align:center">Semua penjelajah sampai di Mars. Gelar di bawah ini menunjukkan seberapa banyak fakta yang sudah kamu kuasai — bukan berhasil atau gagalnya perjalanan.</p>' +
      '</div>' +

      '<section class="score-hero">' +
        '<div class="score-big">' +
          '<div class="eyebrow" style="color:var(--flare-soft)">Skor Akhir</div>' +
          '<div class="score-num">' + totalScore() + '<span> / 180</span></div>' +
          '<p class="faint" style="margin-top:8px">' + correctCount() + ' jawaban benar dari 12 pertanyaan</p>' +
        '</div>' +
        '<div class="panel" style="display:flex;align-items:center">' +
          '<div class="pct-ring">' + ringSVG(p) +
            '<div><div class="eyebrow">Gelar Penjelajah</div>' +
            '<div class="rank-name ' + r.cls + '">' + r.icon + " " + r.name + '</div>' +
            '<p class="faint" style="margin-top:6px">' + esc(r.msg) + '</p></div>' +
          '</div>' +
        '</div>' +
      '</section>' +

      '<section class="levels">' +
        lvCard("easy","lv-e","Easy · Bumi") +
        lvCard("medium","lv-m","Medium · Bulan") +
        lvCard("hard","lv-h","Hard · Mars") +
      '</section>' +

      '<section class="two-col">' +

    return '<div class="stack"><section class="panel cp">' +
      badgeSVG("#57C7FF","🛰️") +
      '<h2>' + esc(title) + '</h2><p class="lede" style="text-align:center">' + esc(msg) + '</p>' +
      '<div class="btn-row"><button class="btn btn-primary" data-act="start-main">🚀 Mulai Misi</button>' +
      '<button class="btn btn-ghost" data-act="go" data-view="home">🏠 Beranda</button></div>' +
      '</section></div>';
  }
  function viewError(msg){
    return '<div class="stack"><section class="panel cp">' +
      badgeSVG("#FF6E8A","🛠️") +
      '<h2>Ada gangguan di panel kendali</h2>' +
      '<p class="lede" style="text-align:center">' + esc(msg) + ' Tenang, datanya tidak hilang — cukup mulai ulang misi.</p>' +
      '<button class="btn btn-primary btn-lg" data-act="restart-now">↺ Mulai Ulang</button>' +
      '</section></div>';
  }

  /* =========================================================
     9. RENDER
     ========================================================= */
  var NAV = [
    {id:"home",  label:"Beranda"},
    {id:"quiz",  label:"Mulai Misi"},
    {id:"guide", label:"Panduan"},
    {id:"facts", label:"Pusat Fakta"},
    {id:"about", label:"Tentang Proyek"}
  ];
  function navCurrent(){
    if(S.view === "checkpoint" || S.view === "result" || S.view === "review" || S.view === "certificate") return "quiz";
    return S.view;
  }
  function renderNav(){
    var cur = navCurrent();
    document.getElementById("nav").innerHTML = NAV.map(function(n){
      return '<button class="nav-btn" data-act="nav" data-view="' + n.id + '"' +
        (cur === n.id ? ' aria-current="page"' : "") + '>' + n.label + '</button>';
    }).join("");
  }

  var VIEWS = {
    home:viewHome, guide:viewGuide, quiz:viewQuiz, checkpoint:viewCheckpoint,
    result:viewResult, review:viewReview, certificate:viewCertificate,
    facts:viewFacts, about:viewAbout
  };

  function render(scrollTop){
    var host = document.getElementById("view");
    try{
      if(DATA_ERROR){ host.innerHTML = viewError(DATA_ERROR); renderNav(); return; }
      var fn = VIEWS[S.view] || viewHome;
      host.innerHTML = fn();
      renderNav();
      if(scrollTop !== false) window.scrollTo({top:0, behavior:"instant" in window ? "auto" : "auto"});
    }catch(err){
      host.innerHTML = viewError("Terjadi kesalahan saat menampilkan halaman.");
      if(window.console) console.error(err);
    }
  }

  /* =========================================================
     10. AKSI
     ========================================================= */
  function go(v){ S.view = v; render(); }

  function startMission(){
    /* Melanjutkan jika misi sedang berjalan; tidak pernah menghapus tanpa konfirmasi. */
    if(S.run.finishedAt){ S.view = "result"; render(); return; }
    if(!S.run.started){ S.run = freshRun(); S.run.started = true; }
    S.view = "quiz"; render();
  }
  function restart(){
    S.run = freshRun(); S.run.started = true;
    S.checkpoint = null; S.filter = "all";
    S.view = "quiz"; render();
  }
  function answer(k){
    var i = S.run.idx;
    if(S.run.answers[i] !== null) return;   /* kunci: tidak bisa diklik dua kali */
    if(k < 0 || k > 3) return;
    S.run.answers[i] = k;
    render(false);
    var fb = document.getElementById("fb");
    var nb = document.getElementById("next-btn");
    if(fb && fb.scrollIntoView) fb.scrollIntoView({behavior:"smooth", block:"nearest"});
    if(nb) nb.focus({preventScroll:true});
  }
  function next(){
    var i = S.run.idx;
    if(S.run.answers[i] === null) return;
    if(i === 3){ S.checkpoint = 1; S.view = "checkpoint"; render(); return; }
    if(i === 7){ S.checkpoint = 2; S.view = "checkpoint"; render(); return; }
    if(i === 11){
      S.run.finishedAt = Date.now();
      S.checkpoint = 3; S.view = "checkpoint"; render(); return;
    }
    S.run.idx = i + 1;
    render();
  }
  function cpContinue(){
    if(S.checkpoint === 3){ S.view = "result"; render(); return; }
    S.run.idx = S.checkpoint === 1 ? 4 : 8;
    S.view = "quiz"; render();
  }

  function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }
  function askRestart(){
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-back" data-act="modal-close"><div class="modal" role="dialog" aria-modal="true" aria-label="Konfirmasi mulai ulang">' +
      '<h3>Mulai ulang misi?</h3>' +
      '<p class="muted">Skor <strong>' + totalScore() + ' poin</strong> dan ' + answeredCount() + ' jawaban yang sudah kamu isi akan dihapus, lalu pesawat kembali ke Bumi.</p>' +
      '<div class="btn-row" style="margin-top:6px">' +
      '<button class="btn btn-ghost" data-act="modal-close">Batal</button>' +
      '<button class="btn btn-primary" data-act="restart-confirm">Ya, mulai ulang</button>' +
      '</div></div></div>';
    var b = document.querySelector("#modal-root .btn-primary");
    if(b) b.focus();
  }

  /* =========================================================
     11. EVENT DELEGATION
     ========================================================= */
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-act]");
    if(!t) return;
    var act = t.getAttribute("data-act");

    if(act === "modal-close"){ if(e.target === t) closeModal(); return; }
    if(act === "restart-confirm"){ closeModal(); restart(); return; }
    if(act === "ask-restart"){ askRestart(); return; }
    if(act === "restart-now"){ restart(); return; }
    if(act === "nav"){
      var v = t.getAttribute("data-view");
      if(v === "quiz"){ startMission(); } else { go(v); }
      return;
    }
    if(act === "go"){ go(t.getAttribute("data-view")); return; }
    if(act === "start-main"){
      if(S.run.finishedAt){ restart(); } else { startMission(); }
      return;
    }
    if(act === "answer"){ answer(parseInt(t.getAttribute("data-i"), 10)); return; }
    if(act === "next"){ next(); return; }
    if(act === "cp-continue"){ cpContinue(); return; }
    if(act === "filter"){ S.filter = t.getAttribute("data-f"); render(false); return; }
    if(act === "print"){ window.print(); return; }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeModal();
  });

  /* =========================================================
     12. BINTANG BERKILAU (canvas ringan)
     ========================================================= */
  (function stars(){
    var cv = document.getElementById("starfield");
    if(!cv || !cv.getContext) return;
    var ctx = cv.getContext("2d"), pts = [], raf = null;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function build(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width  = Math.floor(window.innerWidth  * dpr);
      cv.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      var n = Math.min(150, Math.round(window.innerWidth * window.innerHeight / 11000));
      pts = [];
      for(var i=0;i<n;i++){
        pts.push({
          x:Math.random()*window.innerWidth,
          y:Math.random()*window.innerHeight,
          r:Math.random()*1.25 + .35,
          a:Math.random()*Math.PI*2,
          s:Math.random()*.016 + .005,
          h:Math.random() < .12 ? "#A78BFA" : (Math.random() < .12 ? "#57C7FF" : "#EEF2FF")
        });
      }
    }
    function draw(){
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      for(var i=0;i<pts.length;i++){
        var p = pts[i];
        if(!reduce){ p.a += p.s; }
        var o = reduce ? .5 : (0.32 + 0.42 * (Math.sin(p.a) * .5 + .5));
        ctx.globalAlpha = o;
        ctx.fillStyle = p.h;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if(!reduce) raf = requestAnimationFrame(draw);
    }
    function boot(){ build(); if(raf) cancelAnimationFrame(raf); draw(); }
    var t;
    window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(boot, 180); });
    boot();
  })();

  /* =========================================================
     13. MULAI
     ========================================================= */
  render();
})();
</script>

</body></html>
