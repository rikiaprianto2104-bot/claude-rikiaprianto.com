<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Jelajah Indonesia Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F2F5F2;
  --ground-2:#E7EDEA;
  --surface:#FFFFFF;
  --surface-2:#EDF2F0;
  --ink:#10242B;
  --ink-soft:#4C636B;
  --ink-faint:#7B9198;
  --line:#D4DFDB;
  --line-strong:#B9C9C4;
  --laut:#0E5C74;
  --laut-2:#14778F;
  --laut-ink:#093F52;
  --pulau:#2F7A55;
  --pulau-2:#3E9268;
  --kunyit:#D89210;
  --rempah:#DD5A26;
  --merah:#BE2F3A;
  --benar:#1C7A4E;
  --benar-bg:#E2F1E8;
  --benar-line:#9CCDB2;
  --salah:#A6303F;
  --salah-bg:#FBE8EA;
  --salah-line:#E2AEB5;
  --sea:#DCE9EC;
  --sea-2:#CBDFE4;
  --shadow:0 1px 2px rgba(16,36,43,.06), 0 8px 24px -12px rgba(16,36,43,.22);
  --shadow-lift:0 2px 4px rgba(16,36,43,.08), 0 18px 40px -18px rgba(16,36,43,.32);
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --maxw:1080px;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#071E27;
    --ground-2:#0A2732;
    --surface:#0D2B36;
    --surface-2:#123846;
    --ink:#E9F3F2;
    --ink-soft:#A2BAC0;
    --ink-faint:#77939B;
    --line:#1D4A5A;
    --line-strong:#2A6072;
    --laut:#54C6DC;
    --laut-2:#7BD9EA;
    --laut-ink:#A9E6F2;
    --pulau:#5FC98E;
    --pulau-2:#7BD9A4;
    --kunyit:#F2C14A;
    --rempah:#FF8B54;
    --merah:#F4737D;
    --benar:#5CD79E;
    --benar-bg:#0E3B2D;
    --benar-line:#1F6E51;
    --salah:#FF8794;
    --salah-bg:#3A1620;
    --salah-line:#7A2E3C;
    --sea:#0C3341;
    --sea-2:#0F4152;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 20px 44px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#071E27;
  --ground-2:#0A2732;
  --surface:#0D2B36;
  --surface-2:#123846;
  --ink:#E9F3F2;
  --ink-soft:#A2BAC0;
  --ink-faint:#77939B;
  --line:#1D4A5A;
  --line-strong:#2A6072;
  --laut:#54C6DC;
  --laut-2:#7BD9EA;
  --laut-ink:#A9E6F2;
  --pulau:#5FC98E;
  --pulau-2:#7BD9A4;
  --kunyit:#F2C14A;
  --rempah:#FF8B54;
  --merah:#F4737D;
  --benar:#5CD79E;
  --benar-bg:#0E3B2D;
  --benar-line:#1F6E51;
  --salah:#FF8794;
  --salah-bg:#3A1620;
  --salah-line:#7A2E3C;
  --sea:#0C3341;
  --sea-2:#0F4152;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 20px 44px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--laut)}
:focus-visible{outline:3px solid var(--rempah);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
.shell{max-width:var(--maxw);margin:0 auto;padding:14px 16px 64px;display:flex;flex-direction:column;gap:18px}

.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:8px 16px;
  width:100%;
}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand-mark{width:30px;height:30px;flex:none}
.navwrap{flex:1 1 260px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.navwrap::-webkit-scrollbar{display:none}
.nav{display:flex;gap:6px;min-width:max-content;padding:2px}
.nav button{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.nav button:hover{border-color:var(--line-strong);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--laut);border-color:var(--laut);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{color:#062028}}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:#062028}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.pad{padding:22px}
.pad-lg{padding:28px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.lead{font-size:16.5px;color:var(--ink-soft);max-width:62ch}
.muted{color:var(--ink-soft)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.btn{
  border:1px solid transparent;border-radius:999px;padding:14px 24px;
  font-weight:700;font-size:16px;min-height:52px;display:inline-flex;align-items:center;
  justify-content:center;gap:9px;transition:transform .12s, box-shadow .18s, background .15s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--laut);color:#fff;box-shadow:0 6px 0 -2px var(--laut-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#052029;box-shadow:0 6px 0 -2px #0B4E60}}
:root[data-theme="dark"] .btn-primary{color:#052029;box-shadow:0 6px 0 -2px #0B4E60}
.btn-primary:hover{background:var(--laut-2)}
.btn-warm{background:var(--rempah);color:#fff;box-shadow:0 6px 0 -2px #A63C15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-warm{color:#2B1206;box-shadow:0 6px 0 -2px #B25627}}
:root[data-theme="dark"] .btn-warm{color:#2B1206;box-shadow:0 6px 0 -2px #B25627}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-big{font-size:19px;padding:18px 34px;min-height:62px}
.btn-sm{font-size:14px;padding:10px 16px;min-height:42px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

.chip{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;min-height:38px;
  display:inline-flex;align-items:center;transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--laut);border-color:var(--laut);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#062028}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#062028}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);background:var(--surface-2);font-family:var(--f-mono)}
.tag-laut{color:var(--laut);border-color:color-mix(in srgb,var(--laut) 35%, transparent)}
.tag-pulau{color:var(--pulau);border-color:color-mix(in srgb,var(--pulau) 35%, transparent)}
.tag-kunyit{color:var(--kunyit);border-color:color-mix(in srgb,var(--kunyit) 40%, transparent)}
.tag-rempah{color:var(--rempah);border-color:color-mix(in srgb,var(--rempah) 40%, transparent)}
.tag-merah{color:var(--merah);border-color:color-mix(in srgb,var(--merah) 35%, transparent)}

/* ---------- hero ---------- */
.hero{
  border-radius:var(--r-xl);border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(168deg, var(--sea) 0%, var(--surface) 62%);
  box-shadow:var(--shadow-lift);
}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;padding:30px 30px 26px;align-items:center}
.hero-title{font-size:clamp(34px,6.4vw,54px);font-weight:800;line-height:1.02}
.hero-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.6vw,22px);color:var(--laut)}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap}
.hero-stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.hero-stat b{font-family:var(--f-mono);color:var(--laut)}
.hero-art{position:relative}
.byline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--line-strong);padding:14px 30px 20px;margin:0}

/* ---------- NUSA ---------- */
.nusa{display:flex;gap:13px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-m);padding:13px 15px}
.nusa-av{width:52px;height:52px;flex:none}
.nusa-txt{font-size:14.5px;line-height:1.5}
.nusa-name{font-family:var(--f-display);font-weight:700;color:var(--laut);font-size:14.5px;display:block}

/* ---------- map ---------- */
.mapbox{background:linear-gradient(180deg,var(--sea) 0%, var(--sea-2) 100%);border:1px solid var(--line);
  border-radius:var(--r-l);padding:10px;overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
.island{fill:var(--pulau);opacity:.85}
.island-dim{fill:var(--line-strong);opacity:.55}
.route{fill:none;stroke:var(--laut);stroke-width:2.6;stroke-dasharray:9 8;opacity:.75;stroke-linecap:round}
.node-ring{fill:var(--surface);stroke:var(--line-strong);stroke-width:2.5}
.node-ring.done{fill:var(--pulau);stroke:var(--pulau)}
.node-ring.now{fill:var(--kunyit);stroke:var(--kunyit)}
.node-lbl{font-family:var(--f-body);font-weight:700;font-size:15px;fill:var(--ink)}
.node-num{font-family:var(--f-mono);font-weight:600;font-size:15px;fill:var(--surface)}
.node-num.locked{fill:var(--ink-faint)}
.vehicle{transition:transform .7s cubic-bezier(.4,.05,.2,1)}
@media (prefers-reduced-motion:reduce){.vehicle{transition:none}}

/* ---------- quiz ---------- */
.qhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.progress-track{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--laut),var(--pulau));border-radius:999px;transition:width .5s ease}
@media (prefers-reduced-motion:reduce){.progress-fill{transition:none}}
.scorepill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:7px 15px;font-family:var(--f-mono);font-weight:600;font-size:14px}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(21px,3.6vw,28px);line-height:1.25}
.opts{display:grid;gap:11px}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);
  padding:15px 17px;min-height:62px;font-size:16.5px;font-weight:600;line-height:1.35;
  transition:border-color .15s, background .15s, transform .1s;
}
.opt:hover:not(:disabled){border-color:var(--laut);background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt-key{width:32px;height:32px;flex:none;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--ink-soft)}
.opt.is-correct{border-color:var(--benar);background:var(--benar-bg)}
.opt.is-correct .opt-key{background:var(--benar);border-color:var(--benar);color:#fff}
.opt.is-wrong{border-color:var(--salah);background:var(--salah-bg)}
.opt.is-wrong .opt-key{background:var(--salah);border-color:var(--salah);color:#fff}
.opt-mark{margin-left:auto;font-size:13px;font-weight:700;font-family:var(--f-mono);white-space:nowrap}
.opt.is-correct .opt-mark{color:var(--benar)}
.opt.is-wrong .opt-mark{color:var(--salah)}

.feedback{border-radius:var(--r-m);border:2px solid;padding:17px 19px;display:flex;flex-direction:column;gap:11px}
.feedback.ok{border-color:var(--benar-line);background:var(--benar-bg)}
.feedback.no{border-color:var(--salah-line);background:var(--salah-bg)}
.fb-title{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px}
.feedback.ok .fb-title{color:var(--benar)}
.feedback.no .fb-title{color:var(--salah)}
.fb-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;font-size:14px}
.fb-note b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
.src-link{font-size:13px;word-break:break-word}

.minimap{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.mm-dot{width:11px;height:11px;border-radius:50%;background:var(--line-strong)}
.mm-dot.done{background:var(--pulau)}
.mm-dot.now{background:var(--kunyit);box-shadow:0 0 0 4px color-mix(in srgb,var(--kunyit) 25%, transparent)}
.mm-name{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-left:4px}

/* ---------- checkpoint / result ---------- */
.badge{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;width:104px}
.badge svg{width:76px;height:76px}
.badge-name{font-size:11.5px;font-weight:700;line-height:1.25;color:var(--ink-soft)}
.badges{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 15px;display:flex;flex-direction:column;gap:3px}
.stat-v{font-family:var(--f-mono);font-weight:600;font-size:26px;line-height:1.1;color:var(--laut)}
.stat-l{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.gelar{background:linear-gradient(150deg,var(--laut),var(--pulau));color:#fff;border-radius:var(--r-l);
  padding:24px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.gelar h2{font-size:clamp(26px,5vw,38px);color:#fff}
.gelar .eyebrow{color:rgba(255,255,255,.82)}
.gelar p{color:rgba(255,255,255,.92);font-size:14.5px;max-width:52ch}
.regionscore{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rs{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;background:var(--surface)}
.rs-bar{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.rs-bar span{display:block;height:100%;background:var(--pulau);border-radius:999px}

/* ---------- review ---------- */
.rev{border:1px solid var(--line);border-radius:var(--r-m);padding:16px 17px;background:var(--surface);display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--line)}
.rev.ok{border-left-color:var(--benar)}
.rev.no{border-left-color:var(--salah)}
.rev-q{font-family:var(--f-display);font-weight:700;font-size:17.5px;line-height:1.3}
.ans-line{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14.5px}
.ans-line b{font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);min-width:104px}
.ans-ok{color:var(--benar);font-weight:700}
.ans-no{color:var(--salah);font-weight:700}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.galcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow)}
.galart{background:var(--sea);border-bottom:1px solid var(--line);padding:14px;display:grid;place-items:center}
.galart svg{width:100%;max-width:180px;height:auto;display:block}
.galbody{padding:15px 16px 17px;display:flex;flex-direction:column;gap:9px;flex:1}
.galname{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2}
.galnote{background:var(--surface-2);border-radius:var(--r-s);padding:9px 11px;font-size:12.8px;color:var(--ink-soft);border-left:3px solid var(--kunyit)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:13.6px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.st{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.st-ver{background:var(--benar-bg);color:var(--benar);border:1px solid var(--benar-line)}
.st-fix{background:color-mix(in srgb,var(--kunyit) 18%, transparent);color:var(--kunyit);border:1px solid color-mix(in srgb,var(--kunyit) 45%, transparent)}
.st-open{background:var(--salah-bg);color:var(--salah);border:1px solid var(--salah-line)}

/* ---------- misc blocks ---------- */
.notice{border:1px dashed var(--line-strong);background:var(--surface-2);border-radius:var(--r-m);padding:14px 16px;font-size:14px;color:var(--ink-soft)}
.notice b{color:var(--ink)}
.steps{display:grid;gap:11px;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:13px;align-items:flex-start;background:var(--surface-2);border-radius:var(--r-m);padding:13px 15px}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:9px;background:var(--laut);color:#fff;
  display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps li::before{color:#062028}}
:root[data-theme="dark"] .steps li::before{color:#062028}
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14.5px;color:var(--ink-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.promptbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:15px 17px;font-family:var(--f-mono);font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-x:auto}
.regcard{display:flex;gap:13px;align-items:center;border:1px solid var(--line);border-radius:var(--r-m);padding:13px 15px;background:var(--surface)}
.regcard.done{border-color:var(--pulau);background:color-mix(in srgb,var(--pulau) 8%, var(--surface))}
.regcard.now{border-color:var(--kunyit);background:color-mix(in srgb,var(--kunyit) 10%, var(--surface))}
.regdot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);flex:none}
.regcard.done .regdot{background:var(--pulau);border-color:var(--pulau);color:#fff}
.regcard.now .regdot{background:var(--kunyit);border-color:var(--kunyit);color:#3A2701}

/* ---------- certificate ---------- */
.cert{background:var(--surface);border:3px double var(--laut);border-radius:var(--r-l);padding:34px 30px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;box-shadow:var(--shadow-lift)}
.cert h2{font-size:clamp(25px,5vw,36px);color:var(--laut)}
.cert-rule{width:76px;height:4px;border-radius:999px;background:var(--kunyit)}
.cert-body{font-size:15.5px;color:var(--ink-soft);max-width:56ch}
.cert-name{font-family:var(--f-display);font-weight:800;font-size:clamp(23px,4.6vw,32px)}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:11px;width:100%}
.cert-cell{border:1px solid var(--line);border-radius:var(--r-m);padding:11px;background:var(--surface-2)}
.cert-cell .stat-v{font-size:22px}
.cert-foot{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:12.5px;color:var(--ink-faint);border-top:1px dashed var(--line-strong);padding-top:14px;width:100%}

/* ---------- footer ---------- */
.foot{text-align:center;font-size:12.5px;color:var(--ink-faint);padding-top:6px;display:flex;flex-direction:column;gap:5px}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hero-in{grid-template-columns:1fr;padding:24px 20px 20px;gap:20px}
  .two{grid-template-columns:1fr}
  .pad-lg{padding:20px}
  .pad{padding:17px}
  .shell{padding:12px 12px 56px}
  .topbar{padding:8px 12px}
  .byline{padding:14px 20px 18px}
}
@media (max-width:520px){
  .btn{width:100%}
  .row.actions{flex-direction:column}
  .badge{width:88px}
  .badge svg{width:64px;height:64px}
  .hero-title{font-size:34px}
  .cert{padding:24px 18px}
}

@media print{
  .topbar,.noprint{display:none!important}
  body{background:#fff;color:#111;background-image:none}
  .shell{padding:0;max-width:100%}
  .cert{box-shadow:none;border-color:#0E5C74;break-inside:avoid}
}

const MAX_SKOR = QUESTIONS.length * 10;

let state = {
  view: "beranda",
  qIndex: 0,
  answers: new Array(QUESTIONS.length).fill(null),
  cpRegion: 0,
  started: false,
  reviewFilter: "semua",
  galWilayah: "semua",
  galKategori: "semua"
};

function resetPerjalanan(){
  state.qIndex = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.cpRegion = 0;
  state.started = false;
  state.reviewFilter = "semua";
}

/* ---- derived ---- */
const firstIndexOf = [];
(function(){ let c=0; REGIONS.forEach((r,i)=>{ firstIndexOf[i]=c; c+=r.jml; }); })();
function lastIndexOf(ri){ return firstIndexOf[ri] + REGIONS[ri].jml - 1; }
function regionOf(qi){ return QUESTIONS[qi] ? QUESTIONS[qi].r : 0; }
function answeredCount(){ return state.answers.filter(a => a !== null).length; }
function isBenar(i){ return state.answers[i] !== null && state.answers[i] === QUESTIONS[i].correct; }
function skor(){ let s=0; for(let i=0;i<QUESTIONS.length;i++){ if(isBenar(i)) s+=10; } return s; }
function benarCount(){ let n=0; for(let i=0;i<QUESTIONS.length;i++){ if(isBenar(i)) n++; } return n; }
function persen(){ return Math.round((skor() / MAX_SKOR) * 100); }
function selesaiSemua(){ return answeredCount() === QUESTIONS.length; }
function regionSelesai(ri){
  for(let i=firstIndexOf[ri]; i<=lastIndexOf(ri); i++){ if(state.answers[i]===null) return false; }
  return true;
}
function skorRegion(ri){ let s=0; for(let i=firstIndexOf[ri]; i<=lastIndexOf(ri); i++){ if(isBenar(i)) s+=10; } return s; }
function benarRegion(ri){ let n=0; for(let i=firstIndexOf[ri]; i<=lastIndexOf(ri); i++){ if(isBenar(i)) n++; } return n; }
function lencanaCount(){ let n=0; for(let i=0;i<REGIONS.length;i++){ if(regionSelesai(i)) n++; } return n; }
function statusRegion(ri){
  if(regionSelesai(ri)) return "selesai";
  if(state.started && regionOf(state.qIndex) === ri) return "sekarang";
  return "terkunci";
}
function gelar(){
  const p = persen();
  if(p >= 85) return { nama:"Master Jelajah Indonesia", desc:"Pengetahuanmu tentang keragaman Indonesia sudah sangat kuat. Terus bagikan ke teman-temanmu!" };
  if(p >= 60) return { nama:"Penjelajah Nusantara", desc:"Kamu sudah mengenal banyak hal tentang Indonesia. Sedikit lagi menuju gelar tertinggi!" };
  return { nama:"Sahabat Nusantara", desc:"Perjalanan belajar baru dimulai. Baca lagi penjelasan tiap soal, lalu coba jelajah sekali lagi!" };
}
function kategoriTerbaik(){
  const map = {};
  QUESTIONS.forEach((q,i)=>{
    if(!map[q.kat]) map[q.kat] = { benar:0, total:0 };
    map[q.kat].total++;
    if(isBenar(i)) map[q.kat].benar++;
  });
  let best = null;
  Object.keys(map).forEach(k=>{
    const m = map[k];
    const rasio = m.benar / m.total;
    if(!best || rasio > best.rasio || (rasio === best.rasio && m.total > best.total)){
      best = { kat:k, rasio:rasio, benar:m.benar, total:m.total };
    }
  });
  return best;
}
function faktaUlang(){
  const out = [];
  for(let i=0;i<QUESTIONS.length;i++){
    if(state.answers[i] !== null && !isBenar(i)) out.push(QUESTIONS[i].fakta);
  }
  return out;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tanggalHariIni(){
  try{
    return new Date().toLocaleDateString("id-ID",{ day:"numeric", month:"long", year:"numeric" });
  }catch(e){
    const d = new Date();
    return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
  }
}

  const cls = lvl === "Mudah" ? "tag-pulau" : lvl === "Sedang" ? "tag-kunyit" : "tag-rempah";
  return '<span class="tag '+cls+'">'+esc(lvl)+'</span>';
}

}

function petaSvg(opts){
  opts = opts || {};
  const showLabels = opts.labels !== false;
  const prog = Math.max(0, Math.min(1, answeredCount() / QUESTIONS.length));
  let islands = "";
  Object.keys(ISLANDS).forEach(k=>{
    islands += '<polygon class="island" points="'+ISLANDS[k]+'"/>';
  });
  let nodes = "";
  REGIONS.forEach((R,i)=>{
    const st = statusRegion(i);
    const cls = st === "selesai" ? "done" : st === "sekarang" ? "now" : "";
    const x = R.node[0], y = R.node[1];
    const labelAnchor = x > 700 ? "end" : "middle";
    const lx = x > 700 ? x - 4 : x;
    nodes += '<g>'+
      '<circle class="node-ring '+cls+'" cx="'+x+'" cy="'+y+'" r="17"/>'+
      '<text class="node-num'+(cls?'':' locked')+'" x="'+x+'" y="'+(y+5)+'" text-anchor="middle">'+(st==="terkunci"?"?":(i+1))+'</text>'+
      (showLabels ? '<text class="node-lbl" x="'+lx+'" y="'+(y-26)+'" text-anchor="'+labelAnchor+'">'+esc(R.nama)+'</text>' : '')+
      '</g>';
  });
  return '<div class="mapbox"><svg class="mapsvg" viewBox="0 0 1000 420" role="img" aria-label="Peta ilustratif kepulauan Indonesia dengan enam titik perjalanan">'+
    '<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">'+
      '<path d="M50 0H0V50" fill="none" stroke="var(--line)" stroke-width="1" opacity=".45"/></pattern></defs>'+
    '<rect width="1000" height="420" fill="url(#grid)"/>'+
    islands +
    '<path id="routepath" class="route" d="'+ROUTE_D+'"/>'+
    nodes +
    '<g class="vehicle" id="vehicle"><g transform="translate(-13,-13)">'+
      '<circle cx="13" cy="13" r="13" fill="var(--surface)" stroke="var(--rempah)" stroke-width="2.5"/>'+
      '<path d="M6.5 13.5l13-5.5-3.4 5.5 3.4 5.5z" fill="var(--rempah)"/>'+
    '</g></g>'+
  '</svg></div>';
}

function placeVehicle(){
  const svg = document.getElementById("routepath");
  const veh = document.getElementById("vehicle");
  if(!svg || !veh) return;
  const prog = Math.max(0, Math.min(1, answeredCount() / QUESTIONS.length));
  let x = REGIONS[0].node[0], y = REGIONS[0].node[1];
  try{
    const len = svg.getTotalLength();
    if(len > 0){
      const p = svg.getPointAtLength(len * prog);
      x = p.x; y = p.y;
    }
  }catch(e){ /* fallback: node pertama */ }
  veh.setAttribute("transform","translate("+x+","+y+")");
}

function miniMap(){
  const cur = state.started ? regionOf(state.qIndex) : -1;
  let html = '<div class="minimap" aria-label="Posisi perjalanan">';
  REGIONS.forEach((R,i)=>{
    const st = statusRegion(i);
    html += '<span class="mm-dot '+(st==="selesai"?"done":st==="sekarang"?"now":"")+'" title="'+esc(R.nama)+'"></span>';
  });
  if(cur >= 0) html += '<span class="mm-name">Sedang di '+esc(REGIONS[cur].nama)+'</span>';
  html += '</div>';
  return html;
}

function viewKuis(){
  const i = state.qIndex;
  const Q = QUESTIONS[i];
  if(!Q){
    return '<section class="card pad-lg stack">'+
      '<h1 style="font-size:26px">Ups, pertanyaan tidak ditemukan</h1>'+
      '<p class="lead">Data pertanyaan tidak bisa dibaca. Perjalanan bisa dimulai ulang tanpa kehilangan apa pun — tidak ada data pribadi yang tersimpan.</p>'+
      '<div class="row actions"><button class="btn btn-primary btn-big" data-act="ulang">🔄 Mulai Ulang</button>'+
      '<button class="btn btn-ghost" data-act="go" data-v="beranda">Kembali ke Beranda</button></div>'+
    '</section>'+ footer();
  }
  const R = REGIONS[Q.r];
  const dijawab = state.answers[i];
  const terkunci = dijawab !== null;
  const benar = terkunci && dijawab === Q.correct;
  const huruf = ["A","B","C","D"];

  const opts = Q.opts.map((o,oi)=>{
    let cls = "opt";
    let mark = "";
    if(terkunci){
      if(oi === Q.correct){ cls += " is-correct"; mark = '<span class="opt-mark">Jawaban benar</span>'; }
      else if(oi === dijawab){ cls += " is-wrong"; mark = '<span class="opt-mark">Pilihanmu</span>'; }
    }
    return '<button class="'+cls+'" data-act="jawab" data-i="'+oi+'"'+(terkunci?' disabled':'')+'>'+
      '<span class="opt-key">'+huruf[oi]+'</span><span>'+esc(o)+'</span>'+mark+'</button>';
  }).join("");

  const fb = terkunci ? (
    '<div class="feedback '+(benar?"ok":"no")+'">'+
      '<div class="fb-title">'+(benar? "✅ Benar!" : "💡 Belum Tepat")+'</div>'+
      '<p style="font-size:15.5px">'+esc(Q.exp)+'</p>'+
      (benar ? '' : '<p class="small"><b>Jawaban yang tepat:</b> '+esc(Q.opts[Q.correct])+'</p>')+
      '<div class="fb-note"><b>Catatan budaya</b>'+esc(Q.budaya)+'</div>'+
      '<div class="fb-note"><b>Sumber pemeriksaan fakta</b>'+srcLink(Q.src)+'</div>'+
    '</div>'
  ) : (
    '<div class="nusa">'+nusaAvatar(46)+'<div class="nusa-txt"><span class="nusa-name">NUSA</span>'+esc(NUSA_PESAN[i])+'</div></div>'
  );

  const akhirWilayah = i === lastIndexOf(Q.r);

  return ''+
  '<section class="card pad-lg stack">'+
    '<div class="qhead">'+
      '<div class="stack-s" style="gap:7px">'+
        '<span class="eyebrow">Pertanyaan '+(i+1)+' dari 15</span>'+
        '<div class="qmeta">'+
          '<span class="tag tag-laut">'+R.emoji+' '+esc(R.nama)+'</span>'+
          '<span class="tag">'+esc(Q.kat)+'</span>'+
          lvlTag(Q.lvl)+
        '</div>'+
      '</div>'+
      '<div class="scorepill">⭐ <span>'+skor()+'</span><span class="muted" style="font-weight:500">/ '+MAX_SKOR+' poin</span></div>'+
    '</div>'+
    '<div class="progress-track" role="progressbar" aria-valuenow="'+(i+1)+'" aria-valuemin="1" aria-valuemax="15" aria-label="Kemajuan kuis">'+
      '<div class="progress-fill" style="width:'+Math.round(((terkunci? i+1 : i) / QUESTIONS.length)*100)+'%"></div>'+
    '</div>'+
    miniMap()+
    '<h1 class="qtext">'+esc(Q.q)+'</h1>'+
    '<div class="opts">'+opts+'</div>'+
    fb+
    '<div class="row actions">'+
      '<button class="btn btn-primary btn-big" data-act="lanjut"'+(terkunci?'':' disabled')+'>'+
        (akhirWilayah ? "Selesaikan Wilayah "+esc(R.nama)+" →" : "Lanjutkan →")+'</button>'+
      '<button class="btn btn-ghost btn-sm noprint" data-act="go" data-v="peta">Lihat Peta</button>'+
    '</div>'+
    (terkunci ? '' : '<p class="tiny muted">Pilih satu jawaban dulu. Setelah memilih, kamu bisa membaca penjelasannya sebelum lanjut.</p>')+
  '</section>'+
  petaMini()+ footer();
}

function viewReview(){
  const filters = [
    { k:"semua", l:"Semua" },
    { k:"benar", l:"Benar" },
    { k:"salah", l:"Perlu Dipelajari" }
  ].concat(REGIONS.map((R,i)=>({ k:"r"+i, l:R.nama })));

  const chips = filters.map(f=>
    '<button class="chip" data-act="revfilter" data-k="'+f.k+'" aria-pressed="'+(state.reviewFilter===f.k)+'">'+esc(f.l)+'</button>'
  ).join("");

  const items = [];
  for(let i=0;i<QUESTIONS.length;i++){
    const Q = QUESTIONS[i];
    const a = state.answers[i];
    if(a === null) continue;
    const ok = a === Q.correct;
    const f = state.reviewFilter;
    if(f === "benar" && !ok) continue;
    if(f === "salah" && ok) continue;
    if(f.charAt(0) === "r" && f.length > 1 && Q.r !== parseInt(f.slice(1),10)) continue;
    items.push(
      '<article class="rev '+(ok?"ok":"no")+'">'+
        '<div class="qmeta">'+
          '<span class="tag '+(ok?"tag-pulau":"tag-merah")+'">'+(ok?"✅ Benar":"💡 Perlu dipelajari")+'</span>'+
          '<span class="tag tag-laut">'+esc(REGIONS[Q.r].nama)+'</span>'+
          '<span class="tag">'+esc(Q.kat)+'</span>'+
          lvlTag(Q.lvl)+
        '</div>'+
        '<h3 class="rev-q">'+(i+1)+'. '+esc(Q.q)+'</h3>'+
        '<div class="ans-line"><b>Jawabanmu</b><span class="'+(ok?"ans-ok":"ans-no")+'">'+esc(Q.opts[a])+'</span></div>'+
        '<div class="ans-line"><b>Jawaban benar</b><span class="ans-ok">'+esc(Q.opts[Q.correct])+'</span></div>'+
        '<p class="small">'+esc(Q.exp)+'</p>'+
        '<div class="fb-note"><b>Catatan budaya</b>'+esc(Q.budaya)+'</div>'+
        '<div class="fb-note"><b>Sumber fakta</b>'+srcLink(Q.src)+'</div>'+
      '</article>'
    );
  }

  const kosong = items.length === 0
    ? '<div class="notice">Tidak ada pertanyaan yang cocok dengan filter ini. Coba pilih filter lain, misalnya <b>Semua</b>.</div>'
    : '';

  return ''+
  '<section class="card pad-lg stack">'+
    '<span class="eyebrow">Ulasan jawaban</span>'+
    '<h1 style="font-size:clamp(27px,5vw,36px)">Pelajari Jawaban</h1>'+
    '<p class="lead">Semua pertanyaan yang sudah kamu jawab, lengkap dengan jawaban benar, penjelasan, dan sumbernya.</p>'+
    '<div class="row" role="group" aria-label="Filter jawaban">'+chips+'</div>'+
    '<p class="tiny muted">Menampilkan '+items.length+' dari '+answeredCount()+' pertanyaan yang sudah dijawab.</p>'+
    kosong +
    '<div class="stack">'+items.join("")+'</div>'+
    '<div class="row actions">'+
      (selesaiSemua() ? '<button class="btn btn-primary" data-act="go" data-v="hasil">← Kembali ke Hasil</button>' : '<button class="btn btn-primary" data-act="mulai">▶ Lanjutkan Jelajah</button>')+
      '<button class="btn btn-ghost" data-act="go" data-v="galeri">Galeri Budaya</button>'+
    '</div>'+
  '</section>'+ footer();
}

function viewGaleri(){
  const kats = [];
  GALERI.forEach(g=>{ if(kats.indexOf(g.kat) < 0) kats.push(g.kat); });

  const wChips = ['<button class="chip" data-act="galw" data-k="semua" aria-pressed="'+(state.galWilayah==="semua")+'">Semua wilayah</button>']
    .concat(REGIONS.map((R,i)=>'<button class="chip" data-act="galw" data-k="'+i+'" aria-pressed="'+(state.galWilayah===String(i))+'">'+esc(R.nama)+'</button>')).join("");
  const kChips = ['<button class="chip" data-act="galk" data-k="semua" aria-pressed="'+(state.galKategori==="semua")+'">Semua kategori</button>']
    .concat(kats.map(k=>'<button class="chip" data-act="galk" data-k="'+esc(k)+'" aria-pressed="'+(state.galKategori===k)+'">'+esc(k)+'</button>')).join("");

  const cards = GALERI.filter(g=>{
    if(state.galWilayah !== "semua" && String(g.r) !== state.galWilayah) return false;
    if(state.galKategori !== "semua" && g.kat !== state.galKategori) return false;
    return true;
  }).map(g=>
    '<article class="galcard">'+
      '<div class="galart">'+(ILUS[g.id] || "")+'</div>'+
      '<div class="galbody">'+
        '<h3 class="galname">'+esc(g.nama)+'</h3>'+
        '<div class="qmeta"><span class="tag tag-laut">'+esc(REGIONS[g.r].nama)+'</span><span class="tag">'+esc(g.kat)+'</span></div>'+
        '<p class="small">'+esc(g.desc)+'</p>'+
        '<div class="galnote"><strong>Catatan keberagaman:</strong> '+esc(g.note)+'</div>'+
        '<div class="tiny" style="margin-top:auto">Sumber: '+srcLink(g.src)+'</div>'+
      '</div>'+
    '</article>'
  ).join("");

  return ''+
  '<section class="card pad-lg stack">'+
    '<span class="eyebrow">15 kartu budaya dan alam</span>'+
    '<h1 style="font-size:clamp(27px,5vw,36px)">Galeri Budaya</h1>'+
    '<p class="lead">Bisa dibuka kapan saja, tidak perlu menyelesaikan kuis dulu. Semua ilustrasi digambar sendiri memakai bentuk sederhana, jadi tidak memakai gambar atau motif berhak cipta.</p>'+
    '<div class="stack-s">'+
      '<span class="eyebrow">Filter wilayah</span><div class="row">'+wChips+'</div>'+
      '<span class="eyebrow">Filter kategori</span><div class="row">'+kChips+'</div>'+
    '</div>'+
    '<p class="tiny muted">Menampilkan '+(cards ? GALERI.filter(g=>(state.galWilayah==="semua"||String(g.r)===state.galWilayah)&&(state.galKategori==="semua"||g.kat===state.galKategori)).length : 0)+' dari '+GALERI.length+' kartu.</p>'+
    (cards ? '<div class="gal">'+cards+'</div>' : '<div class="notice">Tidak ada kartu yang cocok dengan kombinasi filter ini. Coba pilih <b>Semua wilayah</b> atau <b>Semua kategori</b>.</div>')+
    '<div class="notice">Setiap wilayah di Indonesia punya jauh lebih banyak budaya daripada yang ada di galeri ini. Lima belas kartu ini hanya pintu masuk untuk belajar lebih jauh.</div>'+
  '</section>'+ footer();

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function renderNav(){
  const nav = document.getElementById("nav");
  const current = state.view;
  const map = { cara:"beranda", checkpoint:"kuis", hasil:"kuis", review:"kuis", sertifikat:"kuis" };
  const active = map[current] || current;
  nav.innerHTML = NAV_ITEMS.map(n=>
    '<button data-act="nav" data-v="'+n.v+'"'+(active===n.v?' aria-current="page"':'')+'>'+esc(n.label)+'</button>'
  ).join("");
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  try{
    switch(state.view){
      case "beranda":    html = viewBeranda(); break;
      case "cara":       html = viewCara(); break;
      case "peta":       html = viewPeta(); break;
      case "kuis":       html = viewKuis(); break;
      case "checkpoint": html = viewCheckpoint(); break;
      case "hasil":      html = viewHasil(); break;
      case "review":     html = viewReview(); break;
      case "galeri":     html = viewGaleri(); break;
      case "fakta":      html = viewFakta(); break;
      case "tentang":    html = viewTentang(); break;
      case "sertifikat": html = viewSertifikat(); break;
      default:           state.view = "beranda"; html = viewBeranda();
    }
  }catch(err){
    html = '<section class="card pad-lg stack">'+
      '<h1 style="font-size:26px">Terjadi kendala saat menampilkan halaman</h1>'+
      '<p class="lead">Jangan khawatir, tidak ada data yang hilang. Kamu bisa memulai ulang perjalanan.</p>'+
      '<div class="row actions"><button class="btn btn-primary btn-big" data-act="ulang">🔄 Mulai Ulang</button></div></section>';
  }
  app.innerHTML = html;
  renderNav();
  placeVehicle();
}

function goTo(v, keepScroll){
  if(VIEWS.indexOf(v) < 0) v = "beranda";
  state.view = v;
  render();
  if(!keepScroll) window.scrollTo({ top:0, behavior:"auto" });
}

function mulai(){
  if(selesaiSemua()){ goTo("hasil"); return; }
  if(!state.started){
    state.started = true;
    state.qIndex = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    state.cpRegion = 0;
  }
  goTo("kuis");
}

function jawab(oi){
  const i = state.qIndex;
  if(!QUESTIONS[i]) return;
  if(state.answers[i] !== null) return;   /* kunci: hanya dihitung sekali */
  if(oi < 0 || oi >= QUESTIONS[i].opts.length) return;
  state.answers[i] = oi;
  render();
}

function lanjut(){
  const i = state.qIndex;
  const Q = QUESTIONS[i];
  if(!Q || state.answers[i] === null) return;
  if(i === lastIndexOf(Q.r)){
    state.cpRegion = Q.r;
    goTo("checkpoint");
  }else{
    state.qIndex = i + 1;
    goTo("kuis");
  }
}

function checkpointLanjut(){
  const ri = state.cpRegion;
  if(ri >= REGIONS.length - 1){
    goTo("hasil");
  }else{
    state.qIndex = firstIndexOf[ri + 1];
    goTo("kuis");
  }
}

function ulangi(){
  resetPerjalanan();
  state.started = true;
  goTo("kuis");
}

document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.getAttribute("data-act");
  if(act === "nav"){
    const v = t.getAttribute("data-v");
    if(v === "kuis"){ mulai(); } else { goTo(v); }
  }
  else if(act === "go"){ goTo(t.getAttribute("data-v")); }
  else if(act === "mulai"){ mulai(); }
  else if(act === "jawab"){ jawab(parseInt(t.getAttribute("data-i"),10)); }
  else if(act === "lanjut"){ lanjut(); }
  else if(act === "cplanjut"){ checkpointLanjut(); }
  else if(act === "ulang"){ ulangi(); }
  else if(act === "cetak"){ window.print(); }
  else if(act === "revfilter"){ state.reviewFilter = t.getAttribute("data-k"); render(); }
  else if(act === "galw"){ state.galWilayah = t.getAttribute("data-k"); render(); }
  else if(act === "galk"){ state.galKategori = t.getAttribute("data-k"); render(); }
});

render();
</script>
