<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Robot Chef and the Magic Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --ground:#FBF6FF;
  --ground-2:#F0E7FF;
  --surface:#FFFFFF;
  --surface-2:#F5EEFF;
  --ink:#2E1F52;
  --ink-soft:#6B5B90;
  --line:#E4D8F7;
  --line-strong:#CDB8F0;
  --ungu:#7A4DE0;
  --ungu-deep:#5A32B8;
  --biru:#2FA9E8;
  --biru-soft:#D8F1FD;
  --kuning:#F0A500;
  --kuning-soft:#FFF1CC;
  --pink:#EE4E90;
  --pink-soft:#FFE1EE;
  --mint:#0FA97D;
  --shadow:0 10px 0 rgba(122,77,224,.13);
  --shadow-soft:0 8px 26px rgba(74,38,140,.12);
  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#171129;
    --ground-2:#1F1638;
    --surface:#241A3D;
    --surface-2:#2E2250;
    --ink:#F5EFFF;
    --ink-soft:#BCACDE;
    --line:#3C2C64;
    --line-strong:#544090;
    --ungu:#B196FF;
    --ungu-deep:#8E6BFF;
    --biru:#63CBFF;
    --biru-soft:#22344F;
    --kuning:#FFCE5C;
    --kuning-soft:#413317;
    --pink:#FF8DBB;
    --pink-soft:#43213A;
    --mint:#4FE3B8;
    --shadow:0 10px 0 rgba(0,0,0,.35);
    --shadow-soft:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#171129;
  --ground-2:#1F1638;
  --surface:#241A3D;
  --surface-2:#2E2250;
  --ink:#F5EFFF;
  --ink-soft:#BCACDE;
  --line:#3C2C64;
  --line-strong:#544090;
  --ungu:#B196FF;
  --ungu-deep:#8E6BFF;
  --biru:#63CBFF;
  --biru-soft:#22344F;
  --kuning:#FFCE5C;
  --kuning-soft:#413317;
  --pink:#FF8DBB;
  --pink-soft:#43213A;
  --mint:#4FE3B8;
  --shadow:0 10px 0 rgba(0,0,0,.35);
  --shadow-soft:0 10px 30px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(60% 45% at 12% 0%, color-mix(in srgb, var(--biru) 22%, transparent), transparent 70%),
    radial-gradient(55% 40% at 92% 6%, color-mix(in srgb, var(--pink) 20%, transparent), transparent 70%),
    radial-gradient(70% 50% at 50% 100%, color-mix(in srgb, var(--ungu) 16%, transparent), transparent 72%);
  pointer-events:none;
  z-index:0;
}
h1,h2,h3,h4{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit}

.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 16px 56px}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
}
.topbar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand-mark{
  width:38px;height:38px;flex:none;border-radius:12px;
  background:linear-gradient(150deg,var(--ungu),var(--biru));
  display:grid;place-items:center;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.14)
}
.brand-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.02rem;line-height:1.1;color:var(--ink)}
.brand-sub{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{
  border:2px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  font-weight:800;font-size:.9rem;
  padding:8px 14px;border-radius:999px;cursor:pointer;
  transition:transform .12s ease, border-color .12s ease;
}
.nav button:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.nav button[aria-current="page"]{background:var(--ungu);border-color:var(--ungu);color:#fff}
.icon-btn{
  border:2px solid var(--line);background:var(--surface);color:var(--ink);
  width:42px;height:42px;border-radius:999px;cursor:pointer;font-size:1.05rem;
  display:grid;place-items:center;transition:transform .12s ease;
}
.icon-btn:hover{transform:translateY(-2px)}
:where(button,a,[tabindex]):focus-visible{outline:3px solid var(--kuning);outline-offset:3px;border-radius:8px}
@media(max-width:660px){
  .topbar-in{padding:8px 12px;gap:8px;row-gap:8px}
  .brand-mark{width:32px;height:32px;font-size:17px;border-radius:10px}
  .brand-name{font-size:.84rem}
  .brand-sub{font-size:.58rem}
  .icon-btn{width:36px;height:36px;font-size:.95rem}
  .nav{order:3;width:100%;flex-wrap:nowrap;gap:6px}
  .nav button{flex:1 1 0;min-width:0;padding:8px 4px;font-size:.82rem;white-space:nowrap}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:58px;padding:14px 28px;border-radius:999px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;
  border:none;cursor:pointer;text-align:center;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-primary{background:linear-gradient(160deg,var(--ungu),var(--ungu-deep));color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.2)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn-sun{background:linear-gradient(160deg,#FFD166,var(--kuning));color:#3A2600;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn-sun:hover{transform:translateY(-3px)}
.btn-ghost{background:var(--surface);color:var(--ink);border:3px solid var(--line-strong);box-shadow:0 5px 0 var(--line)}
.btn-ghost:hover{transform:translateY(-3px)}
.btn-sm{min-height:48px;padding:10px 20px;font-size:1rem}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- Hero ---------- */
.hero{
  margin-top:22px;
  background:var(--surface);
  border:3px solid var(--line);
  border-radius:34px;
  padding:26px;
  box-shadow:var(--shadow-soft);
  display:grid;grid-template-columns:1fr;gap:22px;align-items:center;
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:auto -40px -70px -40px;height:150px;
  background:radial-gradient(50% 100% at 50% 0%, color-mix(in srgb,var(--kuning) 26%,transparent), transparent 70%);
  pointer-events:none;
}
.hero-art{
  position:relative;display:grid;place-items:center;
  background:linear-gradient(165deg, var(--biru-soft), color-mix(in srgb,var(--pink-soft) 70%, transparent));
  border-radius:26px;padding:18px 10px;border:2px dashed var(--line-strong);
  overflow:hidden;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--kuning-soft);color:var(--ink);
  border:2px solid color-mix(in srgb,var(--kuning) 55%, var(--line));
  font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;
}
.hero h1{font-size:clamp(1.9rem,7vw,3rem);margin:14px 0 6px}
.hero .tag{font-family:'Baloo 2',sans-serif;font-size:1.05rem;color:var(--ungu);font-weight:700;margin-bottom:10px}
.hero p.lead{color:var(--ink-soft);font-size:1.05rem;max-width:58ch;margin-bottom:18px}
@media(min-width:760px){
  .hero{grid-template-columns:1.05fr .95fr;padding:34px}
  .hero-art{order:2}
}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{
  background:var(--surface-2);border:2px solid var(--line);
  border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem;color:var(--ink-soft)
}
.chip strong{color:var(--ink)}

/* ---------- ROBI ---------- */
.robi-stage{display:grid;place-items:center;gap:8px}
.robi{display:block;max-width:100%;height:auto;filter:drop-shadow(0 12px 14px rgba(60,25,120,.22))}
.robi-float{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.robi g[data-part]{display:none}
.robi[data-mood="senang"] g[data-part="eyes-normal"],
.robi[data-mood="senang"] g[data-part="mouth-smile"],
.robi[data-mood="masak"] g[data-part="eyes-happy"],
.robi[data-mood="masak"] g[data-part="mouth-smile"],
.robi[data-mood="kaget"] g[data-part="eyes-wow"],
.robi[data-mood="kaget"] g[data-part="mouth-o"],
.robi[data-mood="bangga"] g[data-part="eyes-star"],
.robi[data-mood="bangga"] g[data-part="mouth-big"]{display:block}
.robi .blink{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}

/* Speech bubble */
.bubble{
  position:relative;background:var(--surface);border:3px solid var(--ungu);
  border-radius:22px;padding:14px 18px;max-width:34ch;text-align:center;
  font-weight:700;color:var(--ink);box-shadow:0 5px 0 color-mix(in srgb,var(--ungu) 35%, transparent);
}
.bubble::after{
  content:"";position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
  width:18px;height:18px;background:var(--surface);
  border-right:3px solid var(--ungu);border-bottom:3px solid var(--ungu);
  rotate:45deg;border-bottom-right-radius:5px;
}

/* ---------- Sections / cards ---------- */
.section{margin-top:26px}
.panel{
  background:var(--surface);border:3px solid var(--line);border-radius:var(--r-lg);
  padding:22px;box-shadow:var(--shadow-soft);
}
.panel h2{font-size:1.5rem;margin-bottom:6px}
.panel h3{font-size:1.15rem;margin-bottom:6px}
.muted{color:var(--ink-soft)}
.small{font-size:.92rem}

/* ---------- Progress ---------- */
.progress{margin:6px 0 20px}
.pbar{height:14px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}
.pfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--biru),var(--ungu),var(--pink));transition:width .45s cubic-bezier(.4,1.4,.5,1)}
.psteps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 0;padding:0}
.psteps li{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:.72rem;font-weight:800;color:var(--ink-soft);line-height:1.2}
.pnum{
  width:30px;height:30px;border-radius:999px;display:grid;place-items:center;
  background:var(--surface-2);border:2px solid var(--line);color:var(--ink-soft);font-size:.85rem;
  transition:background .2s ease,color .2s ease,transform .2s ease;
}
.psteps li.done .pnum{background:var(--mint);border-color:var(--mint);color:#04281E}
.psteps li.active .pnum{background:var(--ungu);border-color:var(--ungu);color:#fff;transform:scale(1.14)}
.psteps li.active{color:var(--ink)}
@media(min-width:620px){.psteps li{font-size:.82rem}.pnum{width:34px;height:34px}}

/* ---------- Choice cards ---------- */
.scene-title{font-size:clamp(1.4rem,5vw,2rem);text-align:center;margin-bottom:6px}
.scene-sub{text-align:center;color:var(--ink-soft);margin-bottom:18px}
.choices{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.choices{grid-template-columns:repeat(3,1fr)}}
.choice{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  background:var(--surface-2);border:3px solid var(--line);border-radius:var(--r-lg);
  padding:20px 16px;cursor:pointer;color:var(--ink);
  box-shadow:0 6px 0 var(--line);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
}
.choice:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--line-strong);border-color:var(--line-strong)}
.choice:active{transform:translateY(2px);box-shadow:0 3px 0 var(--line)}
.choice[aria-pressed="true"]{border-color:var(--ungu);box-shadow:0 6px 0 var(--ungu);background:color-mix(in srgb,var(--ungu) 12%, var(--surface))}
.choice-emoji{
  font-size:2.7rem;line-height:1;width:78px;height:78px;border-radius:999px;display:grid;place-items:center;
  background:var(--surface);border:3px solid var(--line);
}
.choice[data-warna="pink"] .choice-emoji{background:var(--pink-soft);border-color:color-mix(in srgb,var(--pink) 45%,var(--line))}
.choice[data-warna="ungu"] .choice-emoji{background:color-mix(in srgb,var(--ungu) 16%,var(--surface));border-color:color-mix(in srgb,var(--ungu) 45%,var(--line))}
.choice[data-warna="kuning"] .choice-emoji{background:var(--kuning-soft);border-color:color-mix(in srgb,var(--kuning) 50%,var(--line))}
.choice[data-warna="biru"] .choice-emoji{background:var(--biru-soft);border-color:color-mix(in srgb,var(--biru) 45%,var(--line))}
.choice-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.18rem;line-height:1.2}
.choice-from{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ungu)}
.choice-desc{font-size:.93rem;color:var(--ink-soft)}
.choice-pick{
  margin-top:4px;font-weight:800;font-size:.85rem;color:var(--ungu);
  border:2px dashed color-mix(in srgb,var(--ungu) 45%,var(--line));border-radius:999px;padding:4px 12px;
}

.step-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}

/* ---------- Summary ---------- */
.summary{display:grid;grid-template-columns:1fr;gap:12px;margin:16px 0}
@media(min-width:620px){.summary{grid-template-columns:repeat(3,1fr)}}
.sum-item{
  display:flex;align-items:center;gap:12px;background:var(--surface-2);
  border:2px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
}
.sum-item .e{font-size:1.9rem;line-height:1}
.sum-item .k{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);display:block}
.sum-item .v{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.02rem;line-height:1.2}

/* ---------- Cooking ---------- */
.cooking{display:grid;place-items:center;gap:18px;padding:20px 0}
.pot{
  position:relative;width:190px;height:170px;display:grid;place-items:end center;
}
.pot-body{
  width:170px;height:96px;border-radius:0 0 46px 46px;
  background:linear-gradient(170deg,var(--ungu),var(--ungu-deep));
  border:4px solid color-mix(in srgb,var(--ungu-deep) 70%, #000);
  position:relative;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15)
}
.pot-rim{
  position:absolute;top:-14px;left:-14px;right:-14px;height:26px;border-radius:999px;
  background:linear-gradient(180deg,#EBDDFF,#C6ABF2);border:4px solid color-mix(in srgb,var(--ungu-deep) 70%, #000);
}
.pot-light{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:1.4rem;animation:glow 1.2s ease-in-out infinite}
.bubbles{position:absolute;inset:0 0 90px 0;pointer-events:none}
.bubbles span{
  position:absolute;bottom:0;font-size:1.5rem;animation:rise 2.2s linear infinite;opacity:0
}
@keyframes rise{0%{transform:translateY(10px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-115px) scale(1.15) rotate(20deg);opacity:0}}
.cook-status{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.25rem;text-align:center;min-height:2.6em}
.cook-track{width:min(340px,90%);height:16px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}
.cook-fill{height:100%;width:0;background:linear-gradient(90deg,var(--kuning),var(--pink),var(--ungu));border-radius:999px;transition:width .35s linear}

/* ---------- Result ---------- */
.result-hero{
  border-radius:30px;padding:26px 20px;text-align:center;position:relative;overflow:hidden;
  border:3px solid var(--line);
}
.result-hero[data-warna="pink"]{background:linear-gradient(165deg,var(--pink-soft), color-mix(in srgb,var(--kuning-soft) 70%, transparent))}
.result-hero[data-warna="ungu"]{background:linear-gradient(165deg,color-mix(in srgb,var(--ungu) 18%,var(--surface)), var(--biru-soft))}
.result-hero[data-warna="kuning"]{background:linear-gradient(165deg,var(--kuning-soft), var(--biru-soft))}
.result-hero[data-warna="pelangi"]{background:linear-gradient(120deg,var(--pink-soft),var(--kuning-soft),var(--biru-soft),color-mix(in srgb,var(--ungu) 18%,var(--surface)))}
.plate{
  width:150px;height:150px;margin:0 auto 12px;border-radius:999px;display:grid;place-items:center;
  background:var(--surface);border:5px solid var(--line-strong);font-size:4.4rem;line-height:1;
  box-shadow:0 10px 0 color-mix(in srgb,var(--line-strong) 60%, transparent);
  animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;
}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.tier-tag{
  display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 14px;border-radius:999px;margin-bottom:10px;border:2px solid transparent;
}
.tier-tag[data-t="rahasia"]{background:linear-gradient(90deg,var(--pink),var(--ungu));color:#fff}
.tier-tag[data-t="utama"]{background:var(--mint);color:#04281E}
.tier-tag[data-t="kejutan"]{background:var(--surface);color:var(--ink-soft);border-color:var(--line-strong)}
.result-hero h2{font-size:clamp(1.6rem,6vw,2.4rem);margin-bottom:4px}

.result-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
@media(min-width:740px){.result-grid{grid-template-columns:1fr 1fr}}
.info-card{background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);padding:16px}
.info-card h3{font-size:1.05rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.recipe-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recipe-list li{display:flex;align-items:center;gap:10px;font-weight:700}
.recipe-list .e{font-size:1.4rem;width:38px;height:38px;flex:none;border-radius:10px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center}
.badge{
  display:flex;align-items:center;gap:12px;background:linear-gradient(150deg,var(--kuning-soft),var(--pink-soft));
  border:3px dashed color-mix(in srgb,var(--kuning) 55%,var(--line));border-radius:var(--r-md);padding:14px 16px;
}
.badge .medal{font-size:2.2rem}
.moral{
  background:linear-gradient(150deg,color-mix(in srgb,var(--ungu) 14%,var(--surface)),var(--surface));
  border:3px solid color-mix(in srgb,var(--ungu) 40%,var(--line));border-radius:var(--r-md);
  padding:18px;text-align:center;margin-top:14px;
}
.moral .lbl{font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ungu)}
.moral p{font-family:'Baloo 2',sans-serif;font-size:1.2rem;font-weight:700;margin-top:6px}

.counter{
  display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px;
  font-weight:800;color:var(--ink-soft);font-size:.95rem;flex-wrap:wrap;text-align:center
}
.counter .dot{width:10px;height:10px;border-radius:999px;background:var(--mint)}

/* ---------- How to play / modal ---------- */
.modal-back{
  position:fixed;inset:0;z-index:50;background:rgba(30,15,60,.55);
  display:grid;place-items:center;padding:16px;overflow:auto;
}
.modal{
  background:var(--surface);border:4px solid var(--ungu);border-radius:30px;
  padding:24px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.steps-num{list-style:none;counter-reset:s;margin:14px 0 0;padding:0;display:grid;gap:10px}
.steps-num li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-weight:700}
.steps-num li::before{
  content:counter(s);flex:none;width:32px;height:32px;border-radius:999px;
  background:var(--ungu);color:#fff;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-size:1rem;
}
.hint{
  margin-top:16px;background:var(--kuning-soft);border:2px dashed color-mix(in srgb,var(--kuning) 60%,var(--line));
  border-radius:var(--r-md);padding:14px;font-weight:700
}

/* ---------- About / portfolio ---------- */
.about-head{
  background:linear-gradient(160deg,color-mix(in srgb,var(--ungu) 16%,var(--surface)),var(--biru-soft));
  border:3px solid var(--line);border-radius:var(--r-lg);padding:24px;
}
.meta{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
@media(min-width:620px){.meta{grid-template-columns:repeat(3,1fr)}}
.meta div{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.meta .k{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);display:block}
.meta .v{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;line-height:1.25}

.two-col{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.two-col{grid-template-columns:1fr 1fr}}
.tick{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.tick li{display:flex;gap:9px;align-items:flex-start;font-size:.97rem}
.tick li::before{content:"●";color:var(--ungu);font-size:.7rem;line-height:1.9;flex:none}
.tick.ai li::before{content:"◆";color:var(--biru)}
.tick.learn li::before{content:"★";color:var(--kuning)}

.prompt-box{
  background:var(--surface-2);border-left:6px solid var(--biru);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:14px 16px;margin-top:10px;
}
.prompt-box .k{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--biru)}
.prompt-box q{display:block;margin-top:6px;font-style:italic;font-weight:700;line-height:1.5}

.note{
  background:var(--pink-soft);border:2px solid color-mix(in srgb,var(--pink) 40%,var(--line));
  border-radius:var(--r-md);padding:16px;margin-top:14px;
}
.note h3{color:var(--ink)}

.iter{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:620px){.iter{grid-template-columns:1fr 1fr}}
.iter .v1,.iter .v2{border-radius:var(--r-md);padding:14px;border:2px solid var(--line);background:var(--surface-2)}
.iter .v2{border-color:color-mix(in srgb,var(--mint) 55%,var(--line));background:color-mix(in srgb,var(--mint) 10%,var(--surface))}
.iter .k{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:5px}

.footer{text-align:center;margin-top:30px;color:var(--ink-soft);font-size:.88rem;font-weight:700}

/* Error fallback */
.errbox{background:var(--surface);border:3px solid var(--pink);border-radius:var(--r-lg);padding:24px;text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* =========================================================

     ========================================================= */
  var actx = null;
  function nada(freq, dur, delay){
    if(!soundOn) return;
    try{
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        actx = new AC();
      }
      if(actx.state === 'suspended'){ actx.resume(); }
      var t0 = actx.currentTime + (delay||0);
      var osc = actx.createOscillator();
      var g = actx.createGain();
      osc.type='triangle';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.09, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t0); osc.stop(t0+dur+0.03);
    }catch(e){}
  }
  function sfxKlik(){ nada(620,0.10,0); }
  function sfxPilih(){ nada(520,0.10,0); nada(780,0.12,0.09); }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function batalkanTimer(){
    for(var i=0;i<cookTimers.length;i++){ clearTimeout(cookTimers[i]); }
    cookTimers = [];
    cookToken++;

  function kartuPilihan(item, terpilih, jenis){
    return '<button type="button" class="choice" data-action="pilih" data-jenis="'+jenis+'" data-kode="'+item.kode+'" data-warna="'+item.warna+'" aria-pressed="'+(terpilih?'true':'false')+'">' +
      '<span class="choice-emoji" aria-hidden="true">'+item.emoji+'</span>' +
      '<span class="choice-from">'+esc(item.asal)+'</span>' +
      '<span class="choice-name">'+esc(item.nama)+'</span>' +
      '<span class="choice-desc">'+esc(item.desc)+'</span>' +
      '<span class="choice-pick">'+(terpilih?'✓ Dipilih':'Pilih ini')+'</span>' +
    '</button>';
  }

  function tahapDari(step){
    if(step<=0) return 0;
    if(step===1) return 1;
    if(step===2) return 2;
    if(step===3 || step===4) return 3;
    return 4;
  }

  function progressHTML(){
    var t = tahapDari(state.step);
    var label = ['Bahan Utama','Bahan Ajaib','Cara Masak','Hasil Resep'];
    var li = '';
    for(var i=1;i<=4;i++){
      var cls = t>i ? 'done' : (t===i ? 'active' : '');
      li += '<li class="'+cls+'"><span class="pnum" aria-hidden="true">'+(t>i?'✓':i)+'</span><span>'+label[i-1]+'</span></li>';
    }
    var pct = (t/4)*100;
    return '<div class="progress">' +
      '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>' +
      '<ol class="psteps">'+li+'</ol>' +
      '<p class="sr">Tahap '+t+' dari 4</p>' +
    '</div>';
  }

  function footer(){
    return '<p class="footer">Future Makers: Belajar AI, Ciptakan Aplikasi · Tier 1 – AI Buddy Basics · Dibuat oleh Siswa Future Makers dengan bantuan Claude AI</p>';
  }

  /* =========================================================
     MODAL: CARA BERMAIN
     ========================================================= */
  function bukaModal(){
    var root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-back" data-action="tutup-modal-luar" role="dialog" aria-modal="true" aria-label="Cara bermain">' +
      '<div class="modal">' +
        '<h2 style="font-size:1.5rem">📖 Cara Bermain</h2>' +
        '<ol class="steps-num">' +
          '<li>Pilih bahan utama.</li>' +
          '<li>Tambahkan bahan ajaib.</li>' +
          '<li>Pilih cara memasak.</li>' +
          '<li>Lihat makanan ciptaanmu.</li>' +
          '<li>Coba kombinasi lain untuk menemukan resep rahasia.</li>' +
        '</ol>' +
        '<div class="hint">🔎 <strong>Petunjuk resep rahasia:</strong> pilih dua bahan yang sama-sama berwarna pelangi, lalu ajak ROBI menari!</div>' +
        '<div class="btn-row" style="margin-top:20px">' +
          '<button type="button" class="btn btn-primary btn-sm" data-action="tutup-modal">Siap! 👍</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    var b = root.querySelector('.btn');
    if(b) b.focus();
  }
  function tutupModal(){
    document.getElementById('modal-root').innerHTML = '';
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function render(){
    var app = document.getElementById('app');
    var html = '';
    try{
      if(state.view === 'beranda'){ html = viewBeranda(); }
      else if(state.view === 'tentang'){ html = viewTentang(); }
      else { html = viewMain(); }
      if(!html || !html.length){ html = viewError('Halaman tidak dapat ditampilkan.'); }
    }catch(err){
      try{ html = viewError('Terjadi kesalahan kecil di dapur.'); }
      catch(e2){ html = '<div class="errbox"><h2>Ups!</h2><p>Ayo mulai ulang.</p><button type="button" class="btn btn-primary" data-action="masak-lagi">Mulai Ulang</button></div>'; }
    }
    app.innerHTML = html;

    var btns = document.querySelectorAll('#nav button');
    for(var i=0;i<btns.length;i++){
      if(btns[i].getAttribute('data-view') === state.view){ btns[i].setAttribute('aria-current','page'); }
      else { btns[i].removeAttribute('aria-current'); }
    }

    if(state.view === 'main' && state.step === 5){ jalankanMasak(); }
  }

  function jalankanMasak(){
    batalkanTimer();
    var token = cookToken;
    var pesan = [
      'ROBI sedang menciptakan resep ajaib…',
      'Mencampur bahan pilihanmu…',
      'Menambahkan keajaiban… kelap-kelip!',
      'Hampir siap! Wanginya enak sekali!'
    ];
    var idx = 0;
    var fill = document.getElementById('cook-fill');
    var stat = document.getElementById('cook-status');
    if(fill){ setTimeout(function(){ if(fill) fill.style.width = '100%'; }, 60); }

    for(var i=1;i<pesan.length;i++){
      (function(k){
        cookTimers.push(setTimeout(function(){
          if(token !== cookToken) return;
          var s = document.getElementById('cook-status');
          if(s) s.textContent = pesan[k];
          nada(440 + k*90, 0.09, 0);
        }, k*650));
      })(i);
    }
    if(stat) stat.textContent = pesan[0];
    nada(400,0.1,0);

    cookTimers.push(setTimeout(function(){
      if(token !== cookToken) return;
      selesaiMasak();
    }, 2700));
  }

  function selesaiMasak(){
    batalkanTimer();
    if(!state.main || !state.magic || !state.method){
      state.step = 1; render(); return;
    }
    var key = state.main+'-'+state.magic+'-'+state.method;
    state.key = key;
    if(RESEP[key] && !ditemukan[key]){ ditemukan[key] = true; simpan(); }
    state.step = 6;
    render();
    sfxHore();
    scrollAtas();
  }

  function resetPermainan(){
    batalkanTimer();
    state.step = 0;
    state.main = null;
    state.magic = null;
    state.method = null;
    state.key = null;
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if(!el) return;
    var act = el.getAttribute('data-action');

    if(act === 'tutup-modal-luar'){
      if(e.target === el){ tutupModal(); }
      return;
    }
    if(act === 'tutup-modal'){ sfxKlik(); tutupModal(); return; }
    if(act === 'cara'){ sfxKlik(); bukaModal(); return; }

    if(act === 'sound'){
      soundOn = !soundOn;
      el.textContent = soundOn ? '🔊' : '🔇';
      el.setAttribute('aria-label', soundOn ? 'Matikan suara' : 'Hidupkan suara');
      if(soundOn) sfxPilih();
      return;
    }

    if(act === 'nav'){
      var v = el.getAttribute('data-view');
      sfxKlik();
      batalkanTimer();
      if(v === 'main'){
        if(state.step === 5){ state.step = 4; }
        if(state.step === 6 && !state.key){ resetPermainan(); }
        if(typeof state.step !== 'number' || state.step < 0 || state.step > 6){ resetPermainan(); }
      }
      state.view = v;
      render();
      scrollAtas();
      return;
    }

    if(act === 'mulai'){
      sfxPilih();
      resetPermainan();
      state.view = 'main';
      state.step = 0;
      render();
      scrollAtas();
      return;
    }

    if(act === 'ke-step'){
      var st = parseInt(el.getAttribute('data-step'), 10);
      if(isNaN(st)) st = 0;
      batalkanTimer();
      if(st === 2 && !state.main){ st = 1; }
      if(st === 3 && !state.magic){ st = state.main ? 2 : 1; }
      if(st === 4 && !state.method){ st = state.magic ? 3 : (state.main ? 2 : 1); }
      state.step = st;
      state.view = 'main';
      sfxKlik();
      render();
      scrollAtas();
      return;
    }

    if(act === 'pilih'){
      var jenis = el.getAttribute('data-jenis');
      var kode = el.getAttribute('data-kode');
      sfxPilih();
      if(jenis === 'main'){ state.main = kode; state.step = 2; }
      else if(jenis === 'magic'){ state.magic = kode; state.step = 3; }
      else if(jenis === 'method'){ state.method = kode; state.step = 4; }
      render();
      scrollAtas();
      return;
    }

    if(act === 'masak'){
      if(!state.main || !state.magic || !state.method){
        state.step = state.main ? (state.magic ? 3 : 2) : 1;
        render(); return;
      }
      sfxKlik();
      state.step = 5;
      render();
      scrollAtas();
      return;
    }

    if(act === 'lewati'){ selesaiMasak(); return; }

    if(act === 'masak-lagi'){
      sfxPilih();
      resetPermainan();
      state.view = 'main';
      state.step = 1;
      render();
      scrollAtas();
      return;
    }

    if(act === 'reset-koleksi'){
      ditemukan = {};
      simpan();
      sfxKlik();
      render();
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ tutupModal(); }
  });

  /* =========================================================
     START
     ========================================================= */
  muat();
  render();
})();
</script>
