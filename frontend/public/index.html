<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!-- ============================================================
             Analytics (Meta Pixel + PostHog) — lihat public/analytics.js.
             Skrip sengaja TIDAK ditulis inline: selama ada tag script inline,
             CSP wajib memuat 'unsafe-inline' pada script-src, dan itu membuat
             CSP hampir tidak berguna terhadap skrip suntikan.

             JANGAN menambah tag script inline baru di file ini — CSP produksi
             akan memblokirnya (lihat frontend/public/.htaccess).

             Meta Pixel ID diteruskan lewat data-pixel-id. Satu-satunya tempat
             mengubah nilainya tetap frontend/.env -> REACT_APP_META_PIXEL_ID.
             ============================================================ -->
        <script
            src="%PUBLIC_URL%/analytics.js"
            data-pixel-id="%REACT_APP_META_PIXEL_ID%"
        ></script>

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Official website of Riki MarkeThink, AI Marketing Strategist." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Riki MarkeThink</title>
    </head>
    <body>
        <!-- Meta Pixel (fallback tanpa JavaScript) — ID dari REACT_APP_META_PIXEL_ID -->
        <noscript
            ><img
                height="1"
                width="1"
                style="display: none"
                alt=""
                src="https://www.facebook.com/tr?id=%REACT_APP_META_PIXEL_ID%&ev=PageView&noscript=1"
        /></noscript>
        <!-- End Meta Pixel (noscript) -->

        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
