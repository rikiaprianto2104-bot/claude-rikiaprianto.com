<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Hasil Rancang Game — Future Makers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#140E3F; --night2:#2E1F8A; --violet:#6C5CE7; --violet-d:#4A3BC4;
  --ink:#1E1550; --ink-2:#5A5290; --paper:#fff; --lav:#EFEBFF; --sky:#E2F4FB;
  --peach:#FFEBDD; --mintbg:#E3F8EF; --cream:#FFF8EA; --yellow:#FFC93C; --pink:#FF7AA2;
  --cyan:#33C3E0; --mint:#2FCB95; --coral:#FF6B4A; --line:#DDD7F5;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.45;color:var(--ink);background:var(--lav);padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;padding:22px 16px 26px;border-radius:0 0 26px 26px}
header.top .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.1}
header.top p{margin:2px 0 0;color:#d9d3ff;font-size:14.5px}
header.top .kanan{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:16px;color:#fff;background:var(--violet);border:0;border-radius:14px;padding:11px 18px;cursor:pointer;box-shadow:0 4px 0 var(--violet-d);transition:transform .08s,box-shadow .08s;min-height:44px}
.btn:hover{background:#7a6cf0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--violet-d)}
.btn.kecil{font-size:14.5px;padding:7px 14px;min-height:38px;border-radius:12px;box-shadow:0 3px 0 var(--violet-d)}
.btn.alt{background:#fff;color:var(--violet-d);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.alt:hover{background:#fff;border-color:var(--violet)}
.btn.ok{background:var(--mint);box-shadow:0 4px 0 #1f9f74}
.btn.bahaya{background:#fff;color:var(--coral);border:2px solid #FFD2C7;box-shadow:0 3px 0 #FFD2C7}
.btn[disabled]{opacity:.6;cursor:progress}
main{margin-top:18px}
.layar{display:none}.layar.aktif{display:block}
.card{background:var(--paper);border-radius:20px;padding:18px;margin:0 0 16px;box-shadow:0 6px 0 rgba(108,92,231,.10),0 12px 26px rgba(30,21,80,.07)}
.tengah{text-align:center;padding:40px 18px}
.tengah .big{font-size:52px;line-height:1.1}
.tengah p{color:var(--ink-2);max-width:460px;margin:6px auto}
.spin{width:42px;height:42px;border-radius:50%;border:5px solid var(--lav);border-top-color:var(--violet);margin:0 auto 12px;animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
/* daftar peserta */
.ringkas{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--ink-2);font-size:15px;flex-wrap:wrap}
.ringkas b{color:var(--ink)}
.peserta{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0 0 18px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:2px solid #fff;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 rgba(108,92,231,.12);min-height:58px}
.pcard:hover{border-color:var(--line)}
.pcard:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.pcard[aria-pressed=true]{border-color:var(--violet);background:#F6F3FF}
.pcard .lamp{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--lav);color:var(--ink-2)}
.pcard.sudah .lamp{background:var(--mint);color:#fff}
.pcard b{display:block;font-weight:600;font-size:15.5px;line-height:1.2}
.pcard small{color:var(--ink-2);font-size:12.5px}
/* detail */
.kepala{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.kepala h2{margin:0;font-size:24px;line-height:1.15}
.kepala .meta{color:var(--ink-2);font-size:14.5px}
.kepala select{font:inherit;font-size:15px;color:var(--ink);padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.kepala .kanan{margin-left:auto}
.kosong{background:var(--cream);border-radius:16px;padding:18px;text-align:center;color:var(--ink-2)}
details.jawab{background:#FBFAFF;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 14px}
details.jawab summary{cursor:pointer;font-weight:600;color:var(--violet-d)}
details.jawab dl{margin:10px 0 2px;display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:6px 14px;font-size:14.5px}
details.jawab dt{color:var(--ink-2)}
details.jawab dd{margin:0;font-weight:500;word-break:break-word}
@media (max-width:560px){details.jawab dl{grid-template-columns:1fr}details.jawab dt{margin-top:6px}}
/* kartu prompt */
.kp{border:2px solid var(--line);border-radius:20px;padding:16px;margin:0 0 16px;background:#fff}
.kp header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.kp header .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:23px;flex:none}
.kp h3{margin:0;font-size:20px;line-height:1.15}
.badge{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 11px;white-space:nowrap}
.badge.claude{background:#FFE9DD;color:#B4491F}
.badge.gpt{background:#DDF5EC;color:#14775A}
.langkah{margin:0 0 12px;padding:10px 14px 10px 34px;background:var(--cream);border-radius:14px;font-size:14.5px;color:var(--ink-2)}
.langkah li{margin:2px 0}
.langkah b{color:var(--ink)}
.galeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 12px}
.galeri.satu{grid-template-columns:minmax(220px,360px)}
figure{margin:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#FBFAFF}
figure .gbr{display:grid;place-items:center;background:#fff;min-height:150px}
figure img{display:block;width:100%;max-height:300px;object-fit:contain}
figure .tdk{padding:30px 12px;text-align:center;color:var(--ink-2);font-size:14.5px}
figcaption{padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--line)}
figcaption span{font-weight:600;font-size:14.5px;margin-right:auto}
.prompt{position:relative;border:2px solid var(--line);border-radius:16px;background:#FBFAFF;margin:0 0 10px}
.prompt pre{margin:0;padding:12px 14px;font:13.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:hidden;color:#2b2358}
.prompt.buka pre{max-height:none}
.prompt:not(.buka)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:54px;border-radius:0 0 14px 14px;background:linear-gradient(transparent,#FBFAFF 85%);pointer-events:none}
.aksi{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aksi .info{color:var(--ink-2);font-size:13.5px;margin-left:auto}
.bahaya-wrap{margin-top:8px;text-align:right}
/* toast */
.kodeform{display:flex;gap:10px;max-width:420px;margin:14px auto 0;flex-wrap:wrap}
.kodeform input{flex:1 1 200px;font:inherit;color:var(--ink);background:#FBFAFF;border:2px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
.kodeform input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(108,92,231,.16)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--night);color:#fff;padding:12px 20px;border-radius:16px;max-width:min(92vw,520px);text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.3);transition:all .22s;z-index:50;font-weight:500}
#toast.tampil{opacity:1;transform:translate(-50%,0)}
#toast.salah{background:var(--coral)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation-duration:3s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div>
    <h1>🎮 Hasil Rancang Game</h1>
    <p>Future Makers · prompt siap salin &amp; tempel</p>
  </div>
  <div class="kanan"><button class="btn alt kecil" id="muat-ulang" type="button">↻ Muat ulang</button></div>
</div></header>

<div class="wrap"><main>
  <section id="layar-muat" class="layar aktif card tengah"><div class="spin" aria-hidden="true"></div><p>Mengambil data…</p></section>
  <section id="layar-kunci" class="layar card tengah"><div class="big">🔒</div><h2 style="margin:6px 0">Halaman ini khusus Coach Riki</h2><p id="kunci-teks">Ketik kunci hasil untuk membuka halaman ini.</p>
    <form id="form-kunci" class="kodeform" autocomplete="off">
      <input type="password" id="kode" aria-label="Kunci hasil" placeholder="Kunci hasil" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" class="btn">Masuk</button>
    </form></section>

  <section id="layar-isi" class="layar">
    <div class="ringkas"><span id="ringkas"></span></div>
    <div class="peserta" id="peserta" role="group" aria-label="Pilih peserta"></div>
    <div id="detail"></div>
  </section>
</main></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var API = '/future-maker/rancang-game/api.php';
  var SIMPAN = 'rg-kunci-hasil';
  // Kunci datang dari kolom ketik, atau dari link lama (?k=...), atau diingat dari kunjungan sebelumnya.
  var KUNCI = new URLSearchParams(location.search).get('k') || '';
  if (!KUNCI) { try { KUNCI = localStorage.getItem(SIMPAN) || ''; } catch (e) {} }
  var sudahMasuk = false;
  function ingatKunci() {
    try { localStorage.setItem(SIMPAN, KUNCI); } catch (e) {}
    if (location.search) history.replaceState(null, '', location.pathname);   // kunci tidak tertinggal di alamat
  }
  function terkunci(teks) {
    var t = $('kunci-teks'); if (teks) t.textContent = teks;
    tampil('kunci'); $('kode').value = '';
  }
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var a in (attrs || {})) {
      if (a === 'text') e.textContent = attrs[a];
      else if (a === 'class') e.className = attrs[a];
      else e.setAttribute(a, attrs[a]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  };
  function tampil(n) { ['muat', 'kunci', 'isi'].forEach(function (x) { $('layar-' + x).classList.toggle('aktif', x === n); }); }

  // ---------------- Pemberitahuan kecil ----------------
  var tToast;
  function toast(teks, salah) {
    var t = $('toast'); t.textContent = teks; t.classList.toggle('salah', !!salah); t.classList.add('tampil');
    clearTimeout(tToast); tToast = setTimeout(function () { t.classList.remove('tampil'); }, salah ? 6000 : 3800);
  }

  function api(aksi, extra, opt) {
    opt = opt || {};
    return fetch(API + '?aksi=' + encodeURIComponent(aksi) + (extra || ''), {
      method: opt.method || 'GET', body: opt.body, headers: { 'X-Kunci': KUNCI }, cache: 'no-store'
    });
  }

  // ---------------- Salin teks ----------------
  function salinTeks(teks) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(teks).catch(function () { return cadangan(teks); });
    }
    return cadangan(teks);
  }
  function cadangan(teks) {
    return new Promise(function (ok, gagal) {
      var ta = el('textarea', { 'aria-hidden': 'true' }); ta.value = teks;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var b = false; try { b = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); b ? ok() : gagal(new Error('salin'));
    });
  }

  // ---------------- Foto: ambil sekali, simpan di memori ----------------
  var cacheFoto = {};
  function ambilFoto(id, jenis) {
    var k = id + ':' + jenis;
    if (!cacheFoto[k]) {
      cacheFoto[k] = api('foto', '&id=' + encodeURIComponent(id) + '&jenis=' + jenis).then(function (r) {
        if (!r.ok) throw new Error('foto ' + r.status);
        return r.blob();
      }).then(function (b) { return { blob: b, url: URL.createObjectURL(b) }; });
      cacheFoto[k].catch(function () { delete cacheFoto[k]; });
    }
    return cacheFoto[k];
  }
  // Papan klip hanya menerima PNG di semua browser, jadi foto diubah dulu ke PNG.
  function keBlobPng(blob) {
    return createImageBitmap(blob).then(function (bmp) {
      var c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
      c.getContext('2d').drawImage(bmp, 0, 0);
      return new Promise(function (ok, gagal) { c.toBlob(function (p) { p ? ok(p) : gagal(new Error('png')); }, 'image/png'); });
    });
  }
  function salinFoto(id, jenis) {
    if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) {
      toast('Browser ini belum bisa menyalin foto otomatis. Klik kanan (atau tekan lama) fotonya, lalu pilih "Salin gambar".', true);
      return Promise.resolve();
    }
    // Promise diberikan ke ClipboardItem langsung: Safari mewajibkan penyalinan dimulai
    // di dalam ketukan tombol, sebelum foto selesai diproses.
    var png = ambilFoto(id, jenis).then(function (f) { return keBlobPng(f.blob); });
    return navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]).then(function () {
      toast('Foto tersalin! Tempel di ChatGPT dengan Ctrl+V (di HP: tahan kolom chat → Tempel).');
    }).catch(function () {
      toast('Foto gagal disalin. Klik kanan (atau tekan lama) fotonya, lalu pilih "Salin gambar".', true);
    });
  }

  // ---------------- Bangun kartu prompt ----------------
  var LABEL = { hero: 'Tokoh Utama', musuh: 'Tokoh Musuh', dunia: 'Dunia Game' };

  function kotakFoto(entri, jenis, peserta) {
    var ada = entri.foto[jenis];
    var gbr = el('div', { class: 'gbr' });
    var cap = el('figcaption', {}, [el('span', { text: LABEL[jenis] })]);
    if (ada) {
      var img = el('img', { alt: 'Foto ' + LABEL[jenis] + ' ' + peserta.nama });
      gbr.appendChild(el('div', { class: 'tdk', text: 'Memuat foto…' }));
      ambilFoto(entri.id, jenis).then(function (f) { img.src = f.url; gbr.textContent = ''; gbr.appendChild(img); })
        .catch(function () { gbr.textContent = ''; gbr.appendChild(el('div', { class: 'tdk', text: 'Foto gagal dimuat.' })); });
      var salin = el('button', { type: 'button', class: 'btn kecil', text: '📋 Salin foto' });
      salin.addEventListener('click', function () { salinFoto(entri.id, jenis); });
      var unduh = el('button', { type: 'button', class: 'btn kecil alt', text: '⬇' , title: 'Unduh foto', 'aria-label': 'Unduh foto ' + LABEL[jenis] });
      unduh.addEventListener('click', function () {
        ambilFoto(entri.id, jenis).then(function (f) {
          var a = el('a', { href: f.url, download: peserta.no + '-' + jenis + '.jpg' });
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });
      });
      cap.appendChild(salin); cap.appendChild(unduh);
    } else {
      gbr.appendChild(el('div', { class: 'tdk', text: 'Belum ada foto ' + LABEL[jenis].toLowerCase() + '.' }));
    }
    return el('figure', {}, [gbr, cap]);
  }

  function kartuPrompt(o) {
    var galeri = el('div', { class: 'galeri' + (o.foto.length === 1 ? ' satu' : '') },
      o.foto.map(function (j) { return kotakFoto(o.entri, j, o.peserta); }));
    var pre = el('pre', { text: o.teks });
    var kotak = el('div', { class: 'prompt' }, [pre]);
    var lebih = el('button', { type: 'button', class: 'btn kecil alt', text: 'Lihat semua' });
    lebih.addEventListener('click', function () {
      var buka = kotak.classList.toggle('buka'); lebih.textContent = buka ? 'Ringkas' : 'Lihat semua';
    });
    var salin = el('button', { type: 'button', class: 'btn', text: '📋 Salin Prompt' });
    salin.addEventListener('click', function () {
      salinTeks(o.teks).then(function () {
        salin.textContent = '✓ Tersalin!'; salin.classList.add('ok');
        toast('Prompt tersalin. Tempel di ' + (o.untuk === 'claude' ? 'Claude' : 'ChatGPT') + ' dengan Ctrl+V.');
        setTimeout(function () { salin.textContent = '📋 Salin Prompt'; salin.classList.remove('ok'); }, 2200);
      }).catch(function () { toast('Gagal menyalin otomatis. Tekan "Lihat semua", blok teksnya, lalu salin manual.', true); });
    });
    return el('article', { class: 'kp' }, [
      el('header', {}, [
        el('span', { class: 'ic', style: 'background:' + o.warna, text: o.ikon, 'aria-hidden': 'true' }),
        el('h3', { text: o.judul }),
        el('span', { class: 'badge ' + o.untuk, text: o.untuk === 'claude' ? 'untuk Claude' : 'untuk ChatGPT' })
      ]),
      el('ol', { class: 'langkah' }, o.langkah.map(function (l) { var li = el('li'); li.innerHTML = l; return li; })),
      galeri, kotak,
      el('div', { class: 'aksi' }, [salin, lebih, el('span', { class: 'info', text: o.teks.length.toLocaleString('id-ID') + ' karakter' })])
    ]);
  }

  // Langkah-langkah berisi HTML statis milik halaman ini (bukan data anak).
  var LANGKAH_GPT = [
    'Buka <b>ChatGPT</b> (chatgpt.com), mulai <b>chat baru</b>.',
    'Klik <b>Salin foto</b> di bawah, lalu <b>tempel</b> di kolom chat (Ctrl+V; di HP tahan kolom chat → Tempel).',
    'Klik <b>Salin Prompt</b>, tempel di chat yang sama, lalu kirim.'
  ];

  function tampilDetail(p, indeks) {
    var d = $('detail'); d.textContent = '';
    var box = el('div', { class: 'card' });
    var kepala = el('div', { class: 'kepala' });
    kepala.appendChild(el('div', {}, [el('h2', { text: p.nama }), el('div', { class: 'meta', text: p.no })]));
    box.appendChild(kepala);

    if (!p.entri.length) {
      box.appendChild(el('div', { class: 'kosong', text: 'Belum ada isian dari ' + p.nama + '. Halaman ini akan terisi otomatis setelah formulir dikirim.' }));
      d.appendChild(box); return;
    }
    var e = p.entri[indeks];

    var meta = el('div', { class: 'meta', text: 'Dikirim ' + new Date(e.waktu).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) });
    kepala.firstChild.appendChild(meta);
    if (p.entri.length > 1) {
      var sel = el('select', { 'aria-label': 'Pilih versi isian' });
      p.entri.forEach(function (x, i) {
        sel.appendChild(el('option', { value: i, text: (i === 0 ? 'Terbaru · ' : 'Versi lama · ') + new Date(x.waktu).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) }));
      });
      sel.value = String(indeks);
      sel.addEventListener('change', function () { tampilDetail(p, +sel.value); });
      kepala.appendChild(el('div', { class: 'kanan' }, [sel]));
    }

    // Ringkasan jawaban
    var j = e.jawaban;
    var baris = [['Judul game', j.judul], ['Tokoh utama', j.nama_hero], ['Kekuatan tokoh utama', j.kekuatan_hero],
      ['Musuh', j.nama_musuh], ['Alasan jadi musuh', j.alasan_musuh], ['Kekuatan musuh', j.kekuatan_musuh],
      ['Tempat petualangan', j.dunia], ['Waktu', j.waktu_game], ['Rintangan', j.rintangan],
      ['Masalah utama', j.masalah], ['Akhir cerita', j.akhir]];
    var dl = el('dl');
    baris.forEach(function (b) { dl.appendChild(el('dt', { text: b[0] })); dl.appendChild(el('dd', { text: b[1] })); });
    box.appendChild(el('details', { class: 'jawab' }, [el('summary', { text: 'Lihat jawaban anak (' + baris.length + ' isian)' }), dl]));
    d.appendChild(box);

    var pr = e.prompt, ctx = { entri: e, peserta: p };
    d.appendChild(kartuPrompt({ entri: e, peserta: p, ikon: '🦸', warna: 'var(--lav)', untuk: 'gpt', judul: '1 · Gambar Tokoh Utama: ' + j.nama_hero,
      foto: ['hero'], teks: pr.hero, langkah: LANGKAH_GPT }));
    d.appendChild(kartuPrompt({ entri: e, peserta: p, ikon: '👾', warna: 'var(--peach)', untuk: 'gpt', judul: '2 · Gambar Tokoh Musuh: ' + j.nama_musuh,
      foto: ['musuh'], teks: pr.musuh, langkah: LANGKAH_GPT }));
    d.appendChild(kartuPrompt({ entri: e, peserta: p, ikon: '🏞️', warna: 'var(--mintbg)', untuk: 'gpt', judul: '3 · Gambar Dunia Game',
      foto: ['dunia'], teks: pr.dunia, langkah: LANGKAH_GPT }));
    d.appendChild(kartuPrompt({ entri: e, peserta: p, ikon: '🎮', warna: 'var(--cream)', untuk: 'claude', judul: '4 · Game 3D: ' + j.judul,
      foto: ['hero', 'musuh', 'dunia'], teks: pr.game,
      langkah: [
        'Buka <b>Claude</b> (claude.ai), mulai <b>chat baru</b>.',
        'Tempel <b>3 gambar</b> berurutan: Gambar 1 = Tokoh Utama, Gambar 2 = Musuh, Gambar 3 = Dunia. Paling bagus pakai <b>hasil gambar dari ChatGPT</b> (langkah 1–3); foto asli di bawah juga boleh.',
        'Klik <b>Salin Prompt</b>, tempel di chat yang sama, lalu kirim.'
      ] }));

    var hapus = el('button', { type: 'button', class: 'btn kecil bahaya', text: '🗑 Hapus isian ini' });
    hapus.addEventListener('click', function () {
      if (!confirm('Hapus isian "' + j.judul + '" milik ' + p.nama + ' beserta foto-fotonya?\nIni tidak bisa dibatalkan.')) return;
      var fd = new FormData(); fd.append('id', e.id);
      hapus.disabled = true;
      api('hapus', '', { method: 'POST', body: fd }).then(function (r) {
        if (!r.ok) throw new Error();
        toast('Isian dihapus.'); muat(p.no);
      }).catch(function () { hapus.disabled = false; toast('Gagal menghapus. Coba lagi.', true); });
    });
    d.appendChild(el('div', { class: 'bahaya-wrap' }, [hapus]));
  }

  // ---------------- Daftar peserta & muat data ----------------
  var data = [], dipilih = null, tanda = '';
  function gambarDaftar() {
    var wadah = $('peserta'); wadah.textContent = '';
    var sudah = data.filter(function (p) { return p.entri.length; }).length;
    $('ringkas').textContent = '';
    $('ringkas').appendChild(el('b', { text: sudah + ' dari ' + data.length }));
    $('ringkas').appendChild(document.createTextNode(' peserta sudah mengirim formulir.'));
    data.forEach(function (p) {
      var b = el('button', { type: 'button', class: 'pcard' + (p.entri.length ? ' sudah' : ''), 'aria-pressed': p.no === dipilih ? 'true' : 'false' }, [
        el('span', { class: 'lamp', text: p.entri.length ? '✓' : '…', 'aria-hidden': 'true' }),
        el('span', {}, [el('b', { text: p.nama }), el('small', { text: p.no + (p.entri.length ? ' · ' + p.entri.length + ' kiriman' : ' · belum mengirim') })])
      ]);
      b.addEventListener('click', function () { dipilih = p.no; gambarDaftar(); tampilDetail(p, 0); });
      wadah.appendChild(b);
    });
  }

  function muat(pertahankan, diam) {
    return api('daftar').then(function (r) {
      if (r.status === 403 || r.status === 503 || r.status === 429) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.status === 503) return terkunci('Formulir belum disetel di server (berkas rancang-game-secret.php belum ada). Lihat RANCANG-GAME-PASANG.md.');
          if (r.status === 429) return terkunci('Terlalu banyak salah ketik kunci. Coba lagi besok.');
          var tadiMasuk = sudahMasuk; sudahMasuk = false;
          KUNCI = ''; try { localStorage.removeItem(SIMPAN); } catch (e) {}
          terkunci(tadiMasuk ? 'Kunci sudah tidak berlaku. Ketik kunci yang baru.' : (diam || pertahankan === 'ketik' ? 'Kunci belum cocok. Coba ketik lagi.' : 'Ketik kunci hasil untuk membuka halaman ini.'));
        });
      }
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json().then(function (j) {
        if (!sudahMasuk) { sudahMasuk = true; ingatKunci(); }
        var baru = j.peserta.map(function (p) { return p.no + ':' + p.entri.map(function (e) { return e.id; }).join(','); }).join('|');
        if (diam && baru === tanda) return;           // tidak ada yang berubah: jangan ganggu layar
        tanda = baru; data = j.peserta;
        if (pertahankan && pertahankan !== true && pertahankan !== 'ketik') dipilih = pertahankan;
        if (!dipilih || !data.some(function (p) { return p.no === dipilih; })) {
          var pertama = data.filter(function (p) { return p.entri.length; })[0];
          dipilih = (pertama || data[0]).no;
        }
        tampil('isi'); gambarDaftar();
        var p = data.filter(function (x) { return x.no === dipilih; })[0];
        tampilDetail(p, 0);
      });
    }).catch(function () {
      if (!diam) terkunci('Tidak bisa terhubung ke server. Cek internet lalu muat ulang halaman ini.');
    });
  }

  $('muat-ulang').addEventListener('click', function () { cacheFoto = {}; muat(true); });
  $('form-kunci').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('kode').value.trim();
    if (!v) { $('kode').focus(); return; }
    KUNCI = v; tampil('muat'); muat('ketik');
  });
  if (!KUNCI) terkunci(); else muat();
  // Cek isian baru tiap 30 detik; layar hanya digambar ulang kalau ada kiriman baru.
  setInterval(function () { if (!document.hidden && $('layar-isi').classList.contains('aktif')) muat(true, true); }, 30000);
})();
</script>
</body>
</html>
