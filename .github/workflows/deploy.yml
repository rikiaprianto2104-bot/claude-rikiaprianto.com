name: Deploy to Hostinger

# Trigger otomatis setiap ada push ke branch main, plus tombol manual di tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Hak minimum untuk GITHUB_TOKEN. Default GitHub memberi hak TULIS ke repo;
# workflow ini hanya perlu membaca kode. Kalau ada langkah yang disusupi
# (mis. lewat dependency npm), token-nya tidak bisa dipakai menulis ke repo.
permissions:
  contents: read

# Cegah dua deploy jalan bersamaan (misal dua push beruntun).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Document root domain rikiaprianto.com di server Hostinger.
      # BUKAN rahasia — ubah di sini kalau docroot pindah.
      # (metode & kredensial upload mengikuti deploy.sh: SSH/SFTP port 65002, auth password)
      SFTP_REMOTE_PATH: /home/u295189530/domains/rikiaprianto.com/public_html

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Jangan tinggalkan kredensial git di runner setelah checkout —
          # langkah berikutnya (termasuk skrip npm pihak ketiga) tidak perlu
          # dan tidak boleh bisa push ke repo ini.
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (frontend)
        working-directory: frontend
        # `npm ci` memasang PERSIS versi yang tercatat di package-lock.json dan
        # memverifikasi hash setiap paket. `npm install` boleh menaikkan versi
        # sendiri, jadi paket yang baru saja disusupi bisa ikut terpasang tanpa
        # ada perubahan di repo. Fallback ke `npm install` supaya deploy tidak
        # mati total kalau lockfile sedang tidak sinkron — perbaiki lockfile-nya
        # kalau pesan fallback ini muncul.
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps \
            || { echo "::warning::npm ci gagal (lockfile tidak sinkron?) — fallback ke npm install"; \
                 npm install --no-audit --no-fund --legacy-peer-deps; }

      - name: Build React
        working-directory: frontend
        env:
          CI: "false"                 # CRA menganggap warning = error kalau CI=true
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      - name: Pastikan .htaccess ikut & build valid
        run: |
          set -euo pipefail
          if [ -f frontend/public/.htaccess ]; then
            cp -f frontend/public/.htaccess frontend/build/.htaccess
          fi
          test -f frontend/build/index.html
          # .htaccess memuat seluruh header keamanan situs. Kalau file ini tidak
          # ikut ter-upload, situs live kehilangan CSP/HSTS tanpa ada yang sadar.
          test -f frontend/build/.htaccess || { echo "ERROR: .htaccess tidak ada di build/"; exit 1; }
          grep -q "Content-Security-Policy" frontend/build/.htaccess \
            || { echo "ERROR: .htaccess di build/ tidak memuat header keamanan"; exit 1; }
          echo "build OK — $(find frontend/build -type f | wc -l) file"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Siapkan kredensial & known_hosts SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # --- Metode autentikasi -----------------------------------------
          # Kalau secret SFTP_SSH_KEY ada, pakai kunci SSH dan password tidak
          # pernah dikirim ke mana pun. Kalau belum ada, jatuh ke password
          # seperti sebelumnya supaya deploy tidak putus saat transisi.
          if [ -n "${SFTP_SSH_KEY:-}" ]; then
            # Menyalin private key lewat clipboard Windows merusaknya dengan dua
            # cara: LF berubah jadi CRLF, dan sering tersisip baris kosong.
            # OpenSSH menolak keduanya dengan pesan "invalid format" yang tidak
            # menjelaskan apa pun. Dinormalkan di sini — buang CR, spasi di ujung
            # baris, dan baris kosong — supaya secret yang sudah tersimpan tetap
            # terpakai tanpa perlu di-paste ulang.
            printf '%s\n' "$SFTP_SSH_KEY" \
              | tr -d '\r' \
              | sed 's/[[:space:]]*$//' \
              | grep -v '^[[:space:]]*$' > ~/.ssh/deploy_key || true

            # Jalur cadangan: kalau isinya tidak memuat penanda PEM sama sekali,
            # anggap secret diisi dalam bentuk base64 (lihat pesan galat di bawah)
            # dan coba dekode. Bentuk base64 kebal terhadap mangling spasi.
            if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key; then
              if tr -d '[:space:]' < ~/.ssh/deploy_key | base64 -d > ~/.ssh/deploy_key.dec 2>/dev/null \
                 && grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key.dec; then
                mv ~/.ssh/deploy_key.dec ~/.ssh/deploy_key
                echo "SFTP_SSH_KEY terbaca sebagai base64 dan berhasil didekode."
              fi
              rm -f ~/.ssh/deploy_key.dec
            fi

            chmod 600 ~/.ssh/deploy_key
            # Gagalkan lebih awal dengan pesan jelas kalau isi secret tetap bukan
            # private key yang utuh.
            ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1 || {
              echo "::error::Isi secret SFTP_SSH_KEY bukan private key yang valid."
              echo "::error::Terbaca $(wc -l < ~/.ssh/deploy_key) baris setelah dinormalkan (seharusnya 8)."
              echo "::error::Baris pertama : $(head -1 ~/.ssh/deploy_key | cut -c1-40)"
              echo "::error::Baris terakhir: $(tail -1 ~/.ssh/deploy_key | cut -c1-40)"
              echo "::error::Cara paling aman kalau paste biasa terus gagal: simpan kuncinya"
              echo "::error::dalam bentuk base64 satu baris. Di PowerShell jalankan —"
              echo "::error::  [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"\$env:USERPROFILE\\.ssh\\rikiaprianto_deploy\")) | Set-Clipboard"
              echo "::error::lalu tempel hasilnya ke secret SFTP_SSH_KEY. Workflow mendeteksi"
              echo "::error::bentuk base64 secara otomatis."
              exit 1
            }
            echo "AUTH=key" >> "$GITHUB_ENV"
            echo "Autentikasi: kunci SSH (password tidak dipakai)."
          else
            echo "::warning::Secret SFTP_SSH_KEY belum di-set — deploy masih memakai password SFTP."
            echo "AUTH=password" >> "$GITHUB_ENV"
          fi

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            # Jalur aman: kunci server sudah dipin sebagai secret. Kalau ada
            # yang menyamar sebagai server Hostinger (MITM), koneksi ditolak
            # SEBELUM password dikirim.
            # tr -d '\r': alasan yang sama seperti pada private key di atas —
            # CR yang terbawa dari clipboard Windows membuat baris known_hosts
            # tidak pernah cocok, dan verifikasi host gagal tanpa sebab jelas.
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
            echo "STRICT=yes" >> "$GITHUB_ENV"
            echo "known_hosts diambil dari secret SSH_KNOWN_HOSTS (host key di-pin)."
          else
            # Jalur sementara: ambil kunci host saat ini. Ini TIDAK melindungi
            # dari MITM pada run pertama — lihat instruksi di bawah.
            echo "::warning::Secret SSH_KNOWN_HOSTS belum di-set. Password SFTP dikirim ke host yang identitasnya belum diverifikasi."
            echo "::warning::Cara menutup celah ini: jalankan 'ssh-keyscan -p <PORT> <HOST>' dari jaringan yang Anda percaya, lalu simpan hasilnya sebagai repository secret bernama SSH_KNOWN_HOSTS."
            # `|| true`: kalau keyscan gagal (jaringan runner), jangan matikan
            # deploy — accept-new tetap bisa menerima kunci saat koneksi.
            ssh-keyscan -p "$SFTP_PORT" -H "$SFTP_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
            touch ~/.ssh/known_hosts
            echo "STRICT=accept-new" >> "$GITHUB_ENV"
          fi
          chmod 600 ~/.ssh/known_hosts

          # --- Diagnostik --------------------------------------------------
          # Run #12 gagal dengan exit 255 (galat SSH) dan log Actions tidak bisa
          # dibaca tanpa login, jadi perbandingan ini dicetak langsung ke log:
          # kalau kunci yang DI-PIN berbeda dari yang DISODORKAN server ke
          # runner, itulah penyebabnya — dan selisihnya kelihatan di sini.
          # Kunci publik bukan rahasia, aman dicetak.
          echo "--- kunci yang DI-PIN (dipakai untuk verifikasi) ---"
          ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null | sed 's/^/  /' || echo "  (kosong)"
          echo "--- kunci yang DISODORKAN server ke runner saat ini ---"
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" > /tmp/live_keys 2>/dev/null || true
          ssh-keygen -lf /tmp/live_keys 2>/dev/null | sed 's/^/  /' \
            || echo "  (keyscan tidak mengembalikan kunci — port SSH mungkin diblokir dari runner)"
          echo "-----------------------------------------------------"

      - name: Upload frontend/build ke server (SSH/SFTP, port 65002)
        env:
          SSHPASS:   ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          set -euo pipefail
          : "${SFTP_HOST:?secret SFTP_HOST belum di-set di repo}"
          : "${SFTP_PORT:?secret SFTP_PORT belum di-set di repo}"
          : "${SFTP_USER:?secret SFTP_USER belum di-set di repo}"

          # SEBELUMNYA: StrictHostKeyChecking=no + UserKnownHostsFile=/dev/null.
          # Artinya runner menerima server MANA PUN yang menjawab di alamat itu
          # lalu mengirimkan password SFTP ke sana — siapa pun yang bisa
          # membelokkan rute/DNS mendapat kredensial penuh ke public_html.
          # Sekarang identitas server diverifikasi lewat known_hosts.
          #
          # Array, bukan string: opsi tetap utuh sebagai argumen terpisah tanpa
          # bergantung pada word splitting.
          SSH_BASE=(
            -p "${SFTP_PORT}"
            -o StrictHostKeyChecking="${STRICT}"
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )

          if [ "${AUTH}" = "key" ]; then
            # IdentitiesOnly=yes: jangan coba kunci lain yang kebetulan ada di
            # agent runner — hanya kunci deploy ini.
            SSH=(ssh "${SSH_BASE[@]}"
                 -i "$HOME/.ssh/deploy_key"
                 -o IdentitiesOnly=yes
                 -o PubkeyAuthentication=yes
                 -o PreferredAuthentications=publickey)
          else
            : "${SSHPASS:?secret SFTP_PASSWORD belum di-set di repo}"
            SSH=(sshpass -e ssh "${SSH_BASE[@]}"
                 -o PubkeyAuthentication=no
                 -o PreferredAuthentications=password)
          fi

          REMOTE="${SFTP_USER}@${SFTP_HOST}"

          echo "==> Cek koneksi ke ${REMOTE}:${SFTP_PORT} (auth: ${AUTH})"
          # Tanpa blok `|| { ... }` ini, kegagalan ssh hanya muncul di ringkasan
          # Actions sebagai "exit code 255" tanpa keterangan apa pun.
          "${SSH[@]}" "${REMOTE}" \
            "echo connected as \$(whoami); mkdir -p '${SFTP_REMOTE_PATH}'" || {
              rc=$?
              echo "::error::Koneksi SSH gagal (exit $rc)."
              echo "::error::Kalau pesan di atas menyebut 'host key verification failed' atau"
              echo "::error::'REMOTE HOST IDENTIFICATION HAS CHANGED', berarti kunci yang di-pin"
              echo "::error::tidak cocok dengan yang disodorkan server ke runner — bandingkan"
              echo "::error::sidik jari yang dicetak di langkah 'Siapkan known_hosts'."
              exit $rc
            }

          # Sama seperti deploy.sh: stream tar dari build/ lalu extract di server.
          # Menimpa file yang namanya sama, TIDAK menghapus file lain (tanpa --delete).
          echo "==> Upload frontend/build  ->  ${REMOTE}:${SFTP_REMOTE_PATH}"
          tar -C frontend/build -czf - . \
            | "${SSH[@]}" "${REMOTE}" \
                "tar -C '${SFTP_REMOTE_PATH}' -xzf - && echo 'ekstrak selesai'"

          echo "==> Selesai. https://rikiaprianto.com/"

      - name: Verifikasi header keamanan di situs live
        # Gagalkan deploy kalau header penting hilang — mis. karena hosting
        # menolak salah satu direktif .htaccess dan file-nya diabaikan diam-diam.
        run: |
          set -euo pipefail
          # Coba beberapa kali: cache/propagasi di sisi hosting kadang butuh
          # beberapa detik, dan deploy tidak boleh gagal hanya karena itu.
          headers=""
          for attempt in 1 2 3 4 5; do
            sleep 5
            headers="$(curl -sSI --max-time 30 https://rikiaprianto.com/ | tr 'A-Z' 'a-z')"
            grep -q "^content-security-policy:.*default-src" <<<"$headers" && break
            echo "percobaan $attempt: header belum muncul, menunggu…"
          done
          echo "$headers"
          missing=0
          for h in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy; do
            if ! grep -q "^$h:" <<<"$headers"; then
              echo "::error::Header keamanan hilang di situs live: $h"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Semua header keamanan terpasang."
